<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Piazzolla:opsz,wght@8..30,500;8..30,600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #F2ECDD; } a:hover { color: oklch(75% 0.14 80); }
    .swatch { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; }
  </style>
</helmet>
<div style="width: 960px; height: 680px; background: #16241D; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; padding: 56px; font-family: 'IBM Plex Sans', sans-serif;">

  <div style="display: flex; justify-content: space-between; align-items: center;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #8FA093; text-transform: uppercase;">Option E</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #8FA093; text-transform: uppercase;">Autorite chaleureuse</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 26px;">
    <svg width="76" height="44" viewBox="0 0 76 44" fill="none">
      <path d="M14 44 L28 16 L42 44 Z" fill="oklch(75% 0.14 80)" opacity="0.85"/>
      <path d="M34 44 L48 16 L62 44 Z" fill="oklch(75% 0.14 80)" opacity="0.55"/>
      <path d="M24 44 L38 8 L52 44 Z" fill="oklch(75% 0.14 80)"/>
    </svg>
    <div style="font-family: 'Piazzolla', serif; font-size: 82px; font-weight: 600; letter-spacing: -0.01em; color: #F2ECDD; line-height: 1;">Chatllow</div>
    <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #B7C4B9;">Conseil IA, ancrage francophone</div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: flex-end;">
    <div style="display: flex; gap: 20px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="swatch" style="background: #16241D; border: 1px solid #33473A;"></div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #B7C4B9;">#16241D</div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="swatch" style="background: oklch(75% 0.14 80);"></div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #B7C4B9;">or</div>
      </div>
    </div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #B7C4B9; text-align: right; line-height: 1.6;">
      Piazzolla / IBM Plex Sans<br>
      Ton : chaleureux, premium, identité francophone assumée
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
