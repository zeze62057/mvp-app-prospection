<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #F4F2ED; } a:hover { color: oklch(70% 0.19 40); }
    .swatch { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; }
  </style>
</helmet>
<div style="width: 960px; height: 680px; background: #14161F; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; padding: 56px; font-family: 'IBM Plex Sans', sans-serif;">

  <div style="display: flex; justify-content: space-between; align-items: center;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #83808F; text-transform: uppercase;">Option C</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #83808F; text-transform: uppercase;">Marque distinctive</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 26px;">
    <svg width="96" height="96" viewBox="0 0 88 88" fill="none">
      <circle cx="44" cy="44" r="42" stroke="oklch(70% 0.19 40)" stroke-width="2" opacity="0.45"/>
      <path d="M14 50 C 28 30, 40 30, 44 44 C 48 58, 60 58, 74 38" stroke="oklch(70% 0.19 40)" stroke-width="5" stroke-linecap="round" fill="none"/>
    </svg>
    <div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 80px; font-weight: 700; letter-spacing: -0.02em; color: #F4F2ED; line-height: 1;">Chatllow</div>
    <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #A6A3B0;">Le flux entre l'entreprise et l'IA</div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: flex-end;">
    <div style="display: flex; gap: 20px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="swatch" style="background: #14161F; border: 1px solid #3A3844;"></div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #A6A3B0;">#14161F</div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="swatch" style="background: oklch(70% 0.19 40);"></div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #A6A3B0;">ambre</div>
      </div>
    </div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #A6A3B0; text-align: right; line-height: 1.6;">
      Bricolage Grotesque / IBM Plex Sans<br>
      Ton : mémorable, symbole fort, marque autonome
    </div>
  </div>

</div>
</x-dc>

</html>
