<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    :root {
      --encre: #14161F;
      --indigo: oklch(62% 0.19 250);
      --indigo-soft: oklch(62% 0.19 250 / 0.10);
      --fond: #FCFCFB;
      --fond-carte: #FFFFFF;
      --ligne: rgba(20,22,31,0.10);
      --texte: #14161F;
      --texte-mute: rgba(20,22,31,0.60);
      --display: 'Space Grotesk', sans-serif;
      --corps: 'IBM Plex Sans', sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }
    html, body { margin: 0; background: var(--fond); }
    .page { width: 1280px; height: 800px; font-family: var(--corps); color: var(--texte); display: flex; flex-direction: column; }

    .nav { display: flex; align-items: center; gap: 12px; padding: 26px 64px; border-bottom: 1px solid var(--ligne); }
    .brand-mark { width: 26px; height: 26px; flex-shrink: 0; }
    .brand-word { font-family: var(--display); font-weight: 600; font-size: 17px; }

    .wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 64px; }
    .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--indigo); margin-bottom: 14px; }
    .title { font-family: var(--display); font-weight: 600; font-size: 26px; margin: 0 0 8px; }
    .sub { font-size: 13.5px; color: var(--texte-mute); margin-bottom: 36px; }

    .slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 620px; margin-bottom: 32px; }
    .slot { border: 1px solid var(--ligne); background: var(--fond-carte); border-radius: 10px; padding: 14px; text-align: center; cursor: pointer; }
    .slot-day { font-family: var(--mono); font-size: 11px; color: var(--texte-mute); margin-bottom: 6px; }
    .slot-time { font-family: var(--display); font-weight: 600; font-size: 15px; }
    .slot.selected { border-color: var(--indigo); background: var(--indigo-soft); }

    .btn-primary { background: var(--encre); color: #FCFCFB; border: none; padding: 15px 28px; border-radius: 10px; font-family: var(--corps); font-weight: 600; font-size: 14.5px; cursor: pointer; }
    .btn-primary.disabled { opacity: 0.35; cursor: default; }

    .confirm-panel { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .confirm-check { width: 52px; height: 52px; border-radius: 50%; background: var(--indigo-soft); display: flex; align-items: center; justify-content: center; }
    .confirm-title { font-family: var(--display); font-weight: 600; font-size: 20px; }
    .confirm-sub { font-size: 13.5px; color: var(--texte-mute); }
  </style>
</helmet>

<div class="page">
  <div class="nav">
    <svg class="brand-mark" viewBox="0 0 64 64" fill="none">
      <rect x="4" y="4" width="40" height="40" rx="13" fill="#14161F" opacity="0.14"/>
      <rect x="20" y="20" width="40" height="40" rx="13" fill="oklch(62% 0.19 250)"/>
    </svg>
    <div class="brand-word">Chatllow</div>
  </div>

  <div class="wrap">
    <sc-if value="{{!confirmed}}" hint-placeholder-val="{{true}}">
      <div class="eyebrow">Rendez-vous</div>
      <div class="title">Choisissez un créneau</div>
      <div class="sub">Échange de 30 minutes pour approfondir le pilote recommandé.</div>
      <div class="slots">
        <sc-for list="{{slots}}" as="slot" hint-placeholder-count="6">
          <div class="slot {{slot.cls}}" onClick="{{slot.pick}}">
            <div class="slot-day">{{slot.day}}</div>
            <div class="slot-time">{{slot.time}}</div>
          </div>
        </sc-for>
      </div>
      <div class="btn-primary {{confirmCls}}" onClick="{{confirm}}">Confirmer le rendez-vous</div>
    </sc-if>

    <sc-if value="{{confirmed}}" hint-placeholder-val="{{false}}">
      <div class="confirm-panel">
        <div class="confirm-check">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 13l4 4L20 6" stroke="oklch(62% 0.19 250)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="confirm-title">Rendez-vous confirmé</div>
        <div class="confirm-sub">{{chosenLabel}} &middot; une invitation suit par email.</div>
      </div>
    </sc-if>
  </div>
</div>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { day: "[jour 1]", time: "10:00" },
      { day: "[jour 1]", time: "15:30" },
      { day: "[jour 2]", time: "09:00" },
      { day: "[jour 2]", time: "14:00" },
      { day: "[jour 3]", time: "11:30" },
      { day: "[jour 3]", time: "16:00" }
    ];
    const picked = this.state.picked ?? null;
    const confirmed = this.state.confirmed ?? false;

    const slots = raw.map((s, i) => ({
      day: s.day,
      time: s.time,
      cls: picked === i ? 'selected' : '',
      pick: () => this.setState({ picked: i })
    }));

    const chosen = picked !== null ? raw[picked] : null;

    return {
      slots,
      confirmCls: picked !== null ? '' : 'disabled',
      confirm: () => { if (picked !== null) this.setState({ confirmed: true }); },
      confirmed,
      chosenLabel: chosen ? `${chosen.day} à ${chosen.time}` : ''
    };
  }
}
</script>
</x-dc>
</body>
</html>
