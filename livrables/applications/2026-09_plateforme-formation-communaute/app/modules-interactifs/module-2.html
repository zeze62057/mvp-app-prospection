<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivier IA — Module 2 interactif : Maîtrisez n8n</title>
<style>
:root{
  --bg:#113832; --bg2:#163e37; --panel:#1d4a43; --panel2:#2b554e;
  --line:#3d635d; --txt:#ffffff; --muted:#bcd8d2; --dim:#8fb5ad;
  --orange:#e16139; --orange2:#ec987e; --violet:#5fc7b8; --violet2:#8fe0d3;
  --ok:#33c97e; --okbg:rgba(51,201,126,.12); --ko:#e5484d; --kobg:rgba(229,72,77,.12);
  --gold:#ffd166;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(95,199,184,.14),transparent),radial-gradient(900px 500px at -10% 10%,rgba(225,97,57,.10),transparent),var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.6;min-height:100vh}
h1,h2,h3,h4{font-family:"Unbounded","Segoe UI",system-ui,sans-serif;line-height:1.25}
code,pre,.mono{font-family:"Cascadia Code","Fira Code",Consolas,monospace}
a{color:var(--violet2)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* ---------- Header ---------- */
header.top{position:sticky;top:0;z-index:50;background:rgba(17,56,50,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding:12px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:"Unbounded",sans-serif;font-weight:700;letter-spacing:.5px}
.logo-badge{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--orange),var(--violet));display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 4px 18px rgba(255,138,61,.35)}
.logo small{display:block;font-size:10px;color:var(--muted);font-weight:400;letter-spacing:2px;text-transform:uppercase}
.prog-wrap{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:210px;flex:1;max-width:340px}
.prog{flex:1;height:9px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog>div{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--violet));transition:width .5s ease}
.prog-txt{font-size:12px;color:var(--muted);white-space:nowrap}
/* ---------- Nav ---------- */
nav.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 14px;border-radius:99px;cursor:pointer;font-size:13.5px;font-weight:600;transition:.2s;display:flex;align-items:center;gap:7px}
.tab:hover{border-color:var(--violet);color:var(--txt)}
.tab.on{background:linear-gradient(135deg,rgba(225,97,57,.25),rgba(95,199,184,.22));border-color:var(--orange);color:var(--txt)}
.tab .dot{width:16px;height:16px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim)}
.tab.done .dot{background:var(--ok);border-color:var(--ok);color:#062b18}
/* ---------- Layout ---------- */
main{padding:26px 0 60px}
.view{display:none;animation:fadein .35s ease}
.view.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,rgba(225,97,57,.16),rgba(95,199,184,.14)),var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px 30px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(24px,4vw,38px);margin:10px 0 8px}
.hero .kicker{display:inline-block;background:rgba(225,97,57,.18);border:1px solid rgba(225,97,57,.45);color:var(--orange2);padding:4px 14px;border-radius:99px;font-size:12.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.hero p{color:var(--muted);max-width:760px;font-size:16px}
.sec-head{display:flex;align-items:flex-start;gap:18px;margin:6px 0 22px;flex-wrap:wrap}
.sec-num{font-family:"Unbounded";font-size:44px;font-weight:800;background:linear-gradient(135deg,var(--orange),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.sec-head h2{font-size:clamp(22px,3vw,30px)}
.sec-head .sub{color:var(--muted);margin-top:4px;max-width:720px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
/* ---------- Cards / concepts ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.card h3{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.card h3 .ico{width:28px;height:28px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.concept{cursor:pointer;transition:.2s;border-left:3px solid var(--line)}
.concept:hover{border-left-color:var(--orange);transform:translateX(3px)}
.concept .c-t{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.concept .plus{margin-left:auto;width:22px;height:22px;border-radius:6px;background:var(--panel2);color:var(--orange2);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;transition:.25s}
.concept.open .plus{transform:rotate(45deg);background:rgba(225,97,57,.22)}
.concept .c-body{display:none;margin-top:12px;color:var(--muted);font-size:14.5px}
.concept.open .c-body{display:block;animation:fadein .3s}
.concept .c-body strong{color:var(--txt)}
.hintline{font-size:12.5px;color:var(--dim);margin:4px 0 12px;display:flex;gap:7px;align-items:center}
.key-banner{margin:22px 0;border-radius:16px;padding:18px 22px;background:linear-gradient(120deg,rgba(225,97,57,.18),rgba(95,199,184,.16));border:1px solid rgba(225,97,57,.5);display:flex;gap:14px;align-items:flex-start}
.key-banner .kb-ico{font-size:24px;flex:none}
.key-banner .kb-l{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--orange2)}
.key-banner p{font-size:16.5px;font-weight:600;margin-top:2px}
/* ---------- Flip cas réel ---------- */
.flip{perspective:1200px;min-height:250px}
.flip-in{position:relative;width:100%;min-height:250px;transition:transform .6s;transform-style:preserve-3d;cursor:pointer}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:22px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.flip-front{background:linear-gradient(150deg,rgba(95,199,184,.22),var(--panel))}
.flip-back{background:linear-gradient(150deg,rgba(225,97,57,.22),var(--panel));transform:rotateY(180deg)}
.flip-face .tag{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--violet2)}
.flip-back .tag{color:var(--orange2)}
.flip-face h4{font-size:17px}
.flip-face p{color:var(--muted);font-size:14px}
.flip-face .cta{margin-top:auto;font-size:12.5px;color:var(--dim)}
/* ---------- Quiz ---------- */
.quiz-q{margin-bottom:16px}
.quiz-q .qq{font-weight:700;margin-bottom:10px;display:flex;gap:10px}
.quiz-q .qq .qn{flex:none;width:26px;height:26px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--orange2)}
.opt{display:block;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:11px 14px;border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:14.5px;transition:.15s}
.opt:hover{border-color:var(--violet)}
.opt.good{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--kobg);border-color:var(--ko)}
.opt:disabled{cursor:default;opacity:.9}
.q-expl{display:none;background:var(--bg2);border-left:3px solid var(--orange);border-radius:0 10px 10px 0;padding:10px 14px;font-size:13.5px;color:var(--muted);margin-top:6px}
.q-expl.show{display:block;animation:fadein .3s}
.quiz-score{display:none;text-align:center;padding:18px;border-radius:16px;font-size:17px;font-weight:700;margin-top:8px}
.quiz-score.show{display:block}
.quiz-score.win{background:var(--okbg);border:1px solid var(--ok);color:var(--ok)}
.quiz-score.retry{background:var(--kobg);border:1px solid var(--ko);color:var(--ko)}
.btn{background:linear-gradient(135deg,var(--orange),#c24d28);color:#fff;border:none;padding:11px 22px;border-radius:12px;font-size:14.5px;font-weight:700;cursor:pointer;transition:.2s;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,138,61,.35)}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
.btn.violet{background:linear-gradient(135deg,var(--violet),#3ba898)}
/* ---------- Prompts ---------- */
.prompt{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.prompt .p-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.prompt .p-title{font-weight:700;font-size:15px}
.prompt .p-use{font-size:12.5px;color:var(--dim)}
.prompt pre{background:#0a2620;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:12.8px;white-space:pre-wrap;color:#d9d5f5;max-height:230px;overflow:auto}
.copy-btn{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:6px 13px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;transition:.15s}
.copy-btn:hover{border-color:var(--orange);color:var(--orange2)}
.p-expected{margin-top:10px;font-size:13px;color:var(--muted);background:rgba(95,199,184,.12);border:1px solid rgba(95,199,184,.4);border-radius:10px;padding:9px 12px}
.p-expected b{color:var(--violet2)}
.safe-note{display:flex;gap:10px;background:var(--kobg);border:1px solid rgba(229,72,77,.4);border-radius:12px;padding:12px 15px;font-size:13.5px;color:#f0b9bb;margin-bottom:14px}
/* ---------- Exercices ---------- */
.step{display:flex;gap:14px;padding:13px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border:none}
.step .sn{flex:none;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--violet));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.step .sig{display:inline-block;margin-top:6px;font-size:12.5px;background:var(--okbg);border:1px solid rgba(51,201,126,.4);color:var(--ok);padding:4px 11px;border-radius:99px}
/* ---------- Activities ---------- */
.act{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:24px;margin:22px 0}
.act-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.act-h .a-ico{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,rgba(225,97,57,.32),rgba(95,199,184,.3));display:flex;align-items:center;justify-content:center;font-size:19px}
.act-h h3{font-size:18px}
.act-sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.feedback{display:none;margin-top:14px;padding:13px 16px;border-radius:12px;font-size:14px;animation:fadein .3s}
.feedback.show{display:block}
.feedback.ok{display:block;background:var(--okbg);border:1px solid var(--ok);color:#bff0d6}
.feedback.ko{display:block;background:var(--kobg);border:1px solid var(--ko);color:#f3c2c4}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:8px 15px;cursor:pointer;font-size:13.5px;transition:.15s;color:var(--txt)}
.chip:hover{border-color:var(--violet)}
.chip.sel{background:rgba(225,97,57,.2);border-color:var(--orange);color:var(--orange2)}
.chip.okc{background:var(--okbg);border-color:var(--ok)}
.chip.koc{background:var(--kobg);border-color:var(--ko)}
/* terminal */
.term{background:#0a2620;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:8px}
.term-bar{display:flex;gap:7px;align-items:center;padding:9px 13px;background:#14352f;border-bottom:1px solid var(--line)}
.term-bar i{width:11px;height:11px;border-radius:50%;display:inline-block}
.term-bar span{margin-left:8px;font-size:12px;color:var(--dim)}
.term-out{padding:14px;height:280px;overflow-y:auto;font-size:13.3px;line-height:1.65}
.term-out .cmd{color:var(--orange2)}
.term-out .okl{color:var(--ok)}
.term-out .err{color:var(--ko)}
.term-out .info{color:var(--violet2)}
.term-out .warn{color:var(--gold)}
.term-line{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:#0d2c26}
.term-line .ps{color:var(--ok);font-size:13.3px;flex:none}
.term-line input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:13.3px;font-family:inherit}
.term-side{font-size:13px;color:var(--muted)}
.term-side ul{margin:8px 0 14px 18px}
.term-side li{margin-bottom:4px}
/* sortable */
.sortable{display:flex;flex-direction:column;gap:9px;margin:10px 0}
.sort-item{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:11px;font-size:14px;cursor:grab;user-select:none}
.sort-item .ord{flex:none;width:26px;height:26px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--muted)}
.sort-item .mv{margin-left:auto;color:var(--dim);cursor:pointer;font-size:15px;padding:2px 8px}
.sort-item .mv:hover{color:var(--orange2)}
/* dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:22px}
.dash-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.dash-card:hover{transform:translateY(-4px);border-color:var(--violet);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.dash-card .dc-num{font-family:"Unbounded";font-size:13px;font-weight:800;color:var(--orange2);letter-spacing:1px}
.dash-card h3{font-size:18px;margin:6px 0 8px}
.dash-card p{font-size:13.5px;color:var(--muted)}
.dash-card .dc-foot{margin-top:14px;display:flex;align-items:center;gap:10px}
.dc-prog{flex:1;height:7px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.dc-prog>div{height:100%;background:linear-gradient(90deg,var(--orange),var(--violet));width:0%;transition:width .5s}
.dc-state{font-size:12px;font-weight:700;color:var(--dim)}
.dc-state.ok{color:var(--ok)}
.dash-hero-stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 18px;flex:1;min-width:150px}
.stat b{font-family:"Unbounded";font-size:22px;display:block;color:var(--orange2)}
.stat span{font-size:12px;color:var(--muted)}
.rulette{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:16px}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;font-size:13.5px;color:var(--muted)}
.rule b{color:var(--txt);display:block;margin-bottom:5px;font-size:14.5px}
.match-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
.match-row .m-lab{font-weight:700;font-size:14.5px;min-width:190px}
.match-row select{background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px;font-family:inherit;min-width:230px}
.final-hero{text-align:center;padding:40px 20px;border-radius:22px;background:linear-gradient(135deg,rgba(225,97,57,.2),rgba(95,199,184,.18)),var(--panel);border:1px solid var(--line)}
.big-emoji{font-size:56px}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--dim);font-size:13px;text-align:center}
.confetti{position:fixed;top:-10px;font-size:22px;animation:fall linear forwards;z-index:99;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
.tool-flex{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.mini{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13px;color:var(--muted);transition:.15s}
.mini:hover{border-color:var(--orange);color:var(--orange2)}
.vs-panel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
@media(max-width:700px){.vs-panel{grid-template-columns:1fr}}
.vs-col{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:110px}
.vs-col h5{font-size:13px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.vs-col.a h5{color:var(--orange2)}.vs-col.b h5{color:var(--violet2)}
.vs-item{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px;margin-bottom:7px;cursor:pointer;transition:.15s}
.vs-item:hover{border-color:var(--gold);color:var(--gold)}
.vs-item.placed{opacity:.45;cursor:default}

/* ---- Panneaux Expert ---- */
.exp-panel{margin:22px 0;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:24px}
.exp-panel .ep-k{display:inline-block;background:rgba(225,97,57,.18);border:1px solid rgba(225,97,57,.45);color:var(--orange2);padding:4px 14px;border-radius:99px;font-size:11.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px}
.ana-box{background:var(--bg2);border-left:3px solid var(--teal);border-radius:0 12px 12px 0;padding:13px 16px;font-size:15px;margin-bottom:12px}
.ana-box .lab{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal2);display:block;margin-bottom:4px}
.exp-box{background:linear-gradient(120deg,rgba(225,97,57,.14),rgba(95,199,184,.10));border:1px solid rgba(225,97,57,.4);border-radius:14px;padding:15px 18px;font-size:15px;margin-bottom:14px}
.exp-box .lab{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--orange2);display:block;margin-bottom:5px}
.exp-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:800px){.exp-grid2{grid-template-columns:1fr}}
.exp-col{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
.exp-col h4{font-size:14px;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.exp-col ul{list-style:none}
.exp-col li{font-size:13.5px;color:var(--muted);padding:5px 0 5px 24px;position:relative;border-bottom:1px dashed var(--line)}
.exp-col li:last-child{border:none}
.exp-col li::before{position:absolute;left:0;top:5px}
.exp-col.err li::before{content:"✗";color:var(--ko)}
.exp-col.chk li::before{content:"✓";color:var(--ok)}
.act-box{background:linear-gradient(120deg,rgba(95,199,184,.14),transparent);border:1px solid rgba(95,199,184,.4);border-radius:14px;padding:14px 17px;font-size:14.5px;margin-bottom:14px}
.act-box .lab{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal2);display:block;margin-bottom:5px}
.gloss{background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.gloss h4{font-size:14px;padding:12px 17px 8px}
.gloss .g-row{display:flex;gap:14px;padding:9px 17px;border-top:1px solid var(--line);font-size:13.5px;align-items:baseline}
.gloss .g-row b{color:var(--orange2);min-width:150px;flex:none}
.gloss .g-row span{color:var(--muted)}


/* ---- Améliorations V2 ---- */
.note-area{width:100%;min-height:110px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:13px 15px;font-size:14.5px;font-family:inherit;resize:vertical;outline:none;box-sizing:border-box}
.note-area:focus{border-color:var(--teal)}
@media print{body>*{display:none!important}#cert{display:flex!important}#certinner{-webkit-print-color-adjust:exact;print-color-adjust:exact}#certbar{display:none!important}}

</style>
</head>
<body>
<header class="top"><div class="wrap top-in">
  <div class="logo"><div class="logo-badge">🌱</div><div>Vivier IA<small>Module 2 · n8n</small></div></div>
  <div class="prog-wrap"><div class="prog"><div id="progBar"></div></div><span class="prog-txt" id="progTxt">0 / 7 sections</span></div>
</div></header>

const DATA=[{"num":"01","title":"Découvrir n8n","icon":"🧩","sub":"Ce que n8n fait réellement, les credentials centralisées, le choix du trigger, la différence action/logique et les bons réflexes dès le premier workflow.","concepts":[{"t":"Deux rôles distincts","d":"n8n <strong>orchestre</strong> les automatisations et les connexions externes ; Claude Code <strong>construit le produit</strong>. Ajouter n8n quand il n'apporte rien, c'est une brique en plus, sans besoin."},{"t":"Les credentials, centralisées","d":"Une credential stocke une clé sensible <strong>une seule fois</strong> : mise à jour en un seul endroit, aucune duplication, risque d'exposition réduit. Et une credential se vérifie par un <strong>test réel</strong>."},{"t":"Quatre familles de triggers","d":"<strong>Webhook</strong> (événement externe), <strong>Schedule</strong> (à une heure régulière), <strong>App Trigger</strong> (événement dans une application), <strong>Manual</strong> (pour tester uniquement). Partez de l'événement réel du besoin, pas du trigger le plus facile à configurer."},{"t":"Action ou logique","d":"Un nœud <strong>action</strong> a un effet réel à l'extérieur (envoyer, écrire). Un nœud de <strong>logique</strong> oriente ou transforme le flux sans effet extérieur (IF, Set, Merge). Tout workflow se lit ainsi : un déclencheur, des nœuds, une sortie."},{"t":"Les bons réflexes","d":"L'adresse de test n'est pas l'adresse de production : un 404 peut dire « pas encore actif ». Quand ça casse, regardez d'abord <strong>ce qui circule entre deux nœuds précis</strong>. Et plus il y a de Code, plus il y a d'endroits où chercher une erreur."}],"key":"Tout workflow se lit ainsi : un déclencheur, des nœuds, une sortie.","cas":{"t":"Cas réel : quand la méthode prévue n'existe pas","ctx":"Connecter Gmail à n8n pour envoyer l'e-mail d'un diagnostic en ligne — 17 septembre 2026.","d1":"La connexion par OAuth Google était impossible : aucune application Google n'était préconfigurée sur ce n8n auto-hébergé.","d2":"Choix d'une credential SMTP avec un mot de passe d'application Gmail, après avoir activé la validation en deux étapes. Le test d'envoi a été accepté par Gmail, et l'e-mail est bien arrivé.","lecon":"Si la méthode prévue est impossible, choisissez-en une autre et testez-la. Une credential se vérifie par un test réel."},"act":{"type":"trig","title":"🎯 Le bon trigger","sub":"4 automatisationss à implanter. Pour chacune, choisissez la bonne famille de trigger : Webhook, Schedule, App Trigger ou Manual. Attention au piège…","icon":"🎯"},"prompts":[{"t":"Choisir comment lancer n8n","use":"Pour choisir entre n8n Cloud et un essai local, puis ouvrir n8n dans le navigateur. Aide pour l'étape 1 de l'exercice.","txt":"Je suis débutant complet. Je veux découvrir n8n, un outil qui construit des automatisations en reliant des nœuds sur un canevas, sans écrire de code. J'utilise [VOTRE SYSTÈME : Windows, Mac ou Linux] et Node.js est déjà installé.\nExpliquez-moi avec des mots simples les deux façons de commencer : n8n Cloud, et le lancement local gratuit avec la commande npx n8n. Dites laquelle choisir pour apprendre et pourquoi le mode local ne convient pas à un usage réel avec de vrais clients. Guidez-moi ensuite pour ouvrir n8n dans le navigateur.\nExpliquez chaque terme technique en une phrase simple (workflow, nœud, instance, localhost).","att":"Le choix justifié entre n8n Cloud et le mode local, puis les étapes pour ouvrir n8n dans mon navigateur. *Source : 01-decouvrir-n8n.md, l.5-8, l.41-46.*"},{"t":"Tester un webhook pas à pas","use":"Pour comprendre et réussir le test d'un nœud Webhook avec une requête envoyée depuis un terminal. Aide pour l'étape 2 de l'exercice.","txt":"Je suis débutant. Dans n8n, j'ai ajouté un nœud Webhook et je veux vérifier qu'il reçoit des données avant de construire la suite. Expliquez-moi avec des mots simples ce qu'est un webhook et pourquoi l'adresse de test n'est pas celle de production.\nGuidez-moi dans l'ordre : noter l'adresse  de logique ?** *Corrigé :* Action : effet réel à l'extérieur. Logique : oriente ou transforme le flux, sans effet extérieur. **5. Pourquoi éviter de passer trop vite au nœud Code ?** *Corrigé :* Un workflow couvert de nœuds Code redevient difficile à maintenir et perd l'intérêt visuel de n8n. ## Projet [À COMPLÉTER] : le texte source ne décrit pas de projet."}],"exercice":[{"e":"Lancez n8n en local avec npx n8n (ou ouvrez n8n Cloud) et ouvrez-le dans le navigateur.","s":"l'instance est accessible sur http://localhost:5678."},{"e":"Ajoutez un nœud Webhook, cliquez sur « Listen for test event » et envoyez une requête de test depuis un terminal.","s":"n8n affiche la donnée reçue dans l'éditeur."},{"e":"Citez les 4 familles de triggers avec un exemple d'usage pour chacune.","s":"Webhook, Schedule, App Trigger, Manual (test uniquement)."},{"e":"Pour une automatisation de votre choix, dites quel trigger est le plus adapté, et pourquoi.","s":"pas de réponse unique : cohérence entre l'événement réel et le trigger choisi."}],"quiz":[{"q":"Quelle différence de rôle entre n8n et Claude Code ?","x":"n8n orchestre les automatisations et connexions externes. Claude Code construit le produit.","o":["n8n orchestre les automatisations et connexions externes ; Claude Code construit le produit","Claude Code orchestre, n8n construit le produit","Les deux outils font exactement la même chose","n8n remplace entièrement Claude Code"],"c":0},{"q":"Pourquoi centraliser les credentials ?","x":"Pour éviter la duplication d'une clé sensible, simplifier sa mise à jour et réduire le risque d'exposition.","o":["Pour éviter la duplication d'une clé sensible, simplifier sa mise à jour et réduire le risque d'exposition","Pour que les workflows tournent plus vite","Parce que n8n refuse de démarrer sans elles","Pour payer moins cher l'abonnement"],"c":0},{"q":"Citez les quatre familles de triggers.","x":"Webhook, Schedule, App Trigger, Manual (test uniquement).","o":["Webhook, Schedule, App Trigger, K78cq7VJbXT/9+1RtT4xD7TJnkEBjgolZePHHf38/WP7mX+Lxh8dADQ1wmDqBAiY1fS0bWf6S+J/7/FtipGZsH9YgdeP1cIcezjz9N37hVCTHzmUf/oXjYuq8PqdU1CUN8+u//5WlV+oa1rAeQTMTx+5J23qisr973+7/JLOW7+voF9ekeNH2vrugDYjG+PCOm3qVNffZeyaZtobJz4zKO2LgpAB9Y5g2hX5hkSLL0oy75k20rayp6X37Rh75l79mXu2WfDAjqcvjOn1lZUZCX9YutC5GMPQ27zt0mfaZOEEEWp6SUZWUKIqvzCqvxC3Rht+65EVyPP+cZZ3SLfHt2lF6WZ2aKxUQix47mXLWqBSQag7/8BcRCO++FPfMkAAAAASUVORK5CYII=","cap":"La pratique pas à pas — 4 étapes numérotées à rejouer chez vous, dans l'ordre."}]},{"num":"02","title":"n8n avancé","icon":"⚙️","sub":"HTTP Request en profondeur, manipulation des données et binaires, sous-workflows, et les trois mécanismes de gestion d'erreur.","concepts":[{"t":"HTTP Request en profondeur","d":"Les deux causes d'échec les plus fréquentes : <strong>l'authentification mal configurée</strong> (vérifiez le nom ET la valeur du secret) et <strong>la pagination non gérée</strong>. Prévention : lire la documentation, utiliser la credential dédiée."},{"t":"Manipuler les données","d":"Les expressions entre doubles accolades <strong>{{ }}</strong> référencent dynamiquement une donnée produite par un autre nœud, plutôt qu'une valeur fixe. Quand la mise en forme demande de la logique, faites-la là où vous pouvez la tester."},{"t":"Les données binaires","d":"Un <strong>Merge mal configuré</strong> peut garder le JSON des deux branches mais perdre le binaire de l'une. Si une option change la forme de la donnée, vérifiez ce que les nœuds suivants lisent."},{"t":"Sous-workflows et organisation","d":"<strong>each</strong> appelle le sous-workflow une fois par élément, <strong>all</strong> une seule fois avec la liste entière. Définissez des <strong>entrées typées</strong> plutôt que de supposer la structure reçue. Et renommez ou archivez tout de suite ce que vous dupliquez pour un essai."},{"t":"Gestion des erreurs","d":"Trois mécanismes : <strong>Continue on Fail</strong> (continuer malgré l'échec), <strong>Retry on Fail</strong> (erreur transitoire — un retry n'aurait pas corrigé un défaut de fond), <strong>Error Trigger</strong> (workflow séparé, notification centralisée). Créer une alerte ne suffit pas : rattachez-la, puis vérifiez-la avec une vraie erreur."}],"key":"Une alerte non rattachée ne protège rien : rattachez-la à chaque workflow surveillé.","cas":{"t":"Cas réel : 35 échecs sur 35","ctx":"Workflow de confirmation de paiement de la plateforme Vivier IA, septembre 2026.","d1":"Le workflow avait échoué 35 fois sur 35 — empêchant d'activer l'accès d'élèves qui avaient payé. Trois défauts de fond : une option à activer, une lecture au mauvais endroit, un secret qui ne correspondait pas.","d2":"Un retry aurait simplement répété les 35 échecs. Et au 25 septembre 2026, l'alerte n'était rattachée qu'à un des trois workflows concernés.","lecon":"Un retry ne corrige pas un défaut de fond. Et créer une alerte ne suffit pas : il faut la rattacher, puis la vérifier avec une vraie erreur."},"act":{"type":"err","title":"🛟 Le bon mécanisme d'erreur","sub":"4 situations de panne. Pour chacune, choisissez le bon réflexe : Continue on Fail, Retry on Fail ou Error Trigger.","icon":"🛟"},"prompts":[{"t":"Premier essai du nœud HTTP Request","use":"Pour réussir un premier appel d'API gratuit, sans compte ni clé, avec le nœud HTTP Request. Aide pour l'étape 1 de l'exercice.","txt":"Je suis débutant complet avec l'outil d'automatisation visuel appelé n8n. Je veux faire mon premier appel d'API avec le nœud HTTP Request, sans compte ni clé secrète.\nExpliquez-moi avec des mots simples ce qu'est une API, une méthode GET et une adresse d'API (endpoint). Guidez-moi ensuite : ajouter le nœud, choisir la méthode GET, coller l'adresse publique jsonplaceholder.typicode.com/users, exécuter le nœud et lire le résultat affiché. Dites ce que je dois voir si tout marche.\nExpliquez chaque terme technique en une phrase simple. Ajoutez un conseil pour tester sur un seul appel avant [CE QUE VOUS VOULEZ AUTOMATISER ENSUITE].","att":"Les étapes pour exécuter un GET sur l'adresse publique et lire le résultat affiché, sans authentification à gérer. *Source : 02-n8n-avance.md, l.5-23, l.36-42.*"},{"t":"Créer un workflow d'alerte d'erreur","use":"Pour mettre en place un workflow d'erreurs avec un Error Trigger et le rattacher à un autre workflow. Aide pour l'étape 2 de l'exercice.","txt":"Je suis débutant. Dans l'outil d'automatisation visuel appelé n8n, mon workflow [NOM DE VOTRE WORKFLOW] peut échouer sans que personne le sache. Expliquez-moi avec des mots simples pourquoi une erreur silencieuse coûte plus cher qu'une erreur visible.\nGuidez-moi pour créer un workflow séparé dédié aux erreurs, avec un nœud Error Trigger suivi d'une notification, puis pour le choisir dans le champ Error Workflow des réglages du workflow surveillé. Dites comment vérifier que l'alerte est bien rattachée.\nExpliquez chaque terme technique en une phrase simple.","att":"Les étapes pour créer le workflow d'alerte et le rattacher au workflow surveillé, avec une façon de vérifier le résultat. *Source : 02-n8n-avance.md, l.168-182, l.201-214.*"},{"t":"Éviter qu'un sous-workflow casse","use":"Pour comprendre pourquoi définir des entrées précises évite qu'un sous-workflow casse sans bruit. Aide pour l'étape 4 de l'exercice.","txt":"Je suis débutant. J'ai un sous-workflow dans l'outil d'automatisation visuel appelé n8n : [DÉCRIVEZ CE QU'IL FAIT]. Il marchait bien, puis il a cassé quand un nouveau workflow l'a appelé avec une donnée un peu différente.\nExpliquez-moi avec des mots simples ce qu'est un sous-workflow et le principe qui aurait évité ce problème : définir des entrées typées au lieu de supposer la structure reçue. Proposez une liste des champs attendus et de leur format pour mon cas, avec des exemples fictifs.\nExpliquez chaque terme technique en une phrase simple (sous-workflow, entrée typée, each et all).","att":"Une explication du principe des entrées typées et une liste de champs attendus pour mon sous-workflow, avec exemples fictifs. *Source : 02-n8n-avance.md, l.131-147, l.160-164.* ## Questions de vérification **1. Quelles sont les deux causes les plus fréquentes d'échec d'un HTTP Request ?** *Corrigé :* L'authentification mal configurée et la pagination non gérée. On les prévient en lisant la documentation et en utilisant la credential dédiée. **2. À quoi servent les expressions entre doubles accolades ?** *Corrigé :* À référencer dynamiquement une donnée produite par un autre nœud, plutôt que de taper une valeur fixe. **3. Pourquoi un fichier binaire peut-il disparaître après un Merge ?** *Corrigé :* Un Merge mal configuré peut garder le JSON des deux branches mais perdre le binaire de l'une. **4. Quelle différence entre each et all pour un sous-workflow ?** *Corrigé :* Each l'appelle une fois par élément, all une seule fois avec la liste entière. **5. Citez les 3 mécanismes de gestion d'erreur.** *Corrigé :* Continue on Fail, Retry on Fail (erreur transitoire), Error Trigger (workflow séparé, notification centralisée). ## Projet [À COMPLÉTER] : le texte source ne décrit pas de projet distinct de l'atelier."}],"exercice":[{"e":"Ajoutez un nœud HTTP Request, méthode GET, collez l'adresse jsonplaceholder.typicode.com/users et exécutez-le.","s":"le résultat s'affiche dans n8n, sans authentification à gérer."},{"e":"Créez un workflow d'erreurs avec un nœud Error Trigger suivi d'une notification, puis choisissez-le dans « Error Workflow » d'un autre workflow.","s":"tout échec non rattrapé dans le workflow surveillé déclenche le workflow d'alerte."},{"e":"Citez les 3 mécanismes de gestion d'erreur et leur usage respectif.","s":"Continue on Fail, Retry on Fail, Error Trigger."},{"e":"Un sous-workflow casse quand un nouveau workflow l'appelle avec une donnée différente : quel principe l'aurait évité ?","s":"définir des entrées typées plutôt que supposer la structure reçue."}],"quiz":[{"q":"Quelles sont les deux causes les plus fréquentes d'échec d'un HTTP Request ?","x":"L'authentification mal configurée et la pagination non gérée. On les prévient en lisant la documentation et en utilisant la credential dédiée.","o":["L'authentification mal configurée et la pagination non gérée","Le wifi trop lent et les fichiers trop gros","n8n en maintenance et le VPN coupé","Le navigateur mal configuré"],"c":0},{"q":"À quoi servent les expressions entre doubles accolades ?","x":"À référencer dynamiquement une donnée produite par un autre nœud, plutôt que de taper une valeur fixe.","o":["À référencer dynamiquement une donnée produite par un autre nœud","À écrire un commentaire dans le workflow","À définir la couleur d'un nœud","À bloquer l'exécution conditionnellement"],"c":0},{"q":"Pourquoi un fichier binaire peut-il disparaître après un Merge ?","x":"Un Merge mal configuré peut garder le JSON des deux branches mais perdre le binaire de l'une.","o":["Un Merge mal configuré garde le JSON des deux branches mais perd le binaire de l'une","Le fichier était trop volumineux pour n8n","Les binaires sont interdits en auto-hébergé","Le webhook a expiré pendant le transfert"],"c":0},{"q":"Quelle différence entre each et all pour un sous-workflow ?","x":"Each l'appelle une fois par élément, all une seule fois avec la liste entière.","o":["Each : une fois par élément. All : une seule fois avec la liste entière","Each : une seule fois. All : en boucle","Each est gratuit, all est payant","Ce sont deux noms pour la même option"],"c":0},{"q":"Citez les 3 mécanismes de gestion d'erreur.","x":"Continue on Fail, Retry on Fail (erreur transitoire), Error Trigger (workflow séparé, notification centralisée).","o":["Continue on Fail, Retry on Fail, Error Trigger","Stop, Pause, Replay","Try, Catch, Finally","Email, SMS, Slack"],"c":0}],"ana":"La gestion d'erreurs, c'est la ceinture de sécurité : Retry pour un nid-de-poule (transitoire), Error Trigger pour appeler les secours, Continue pour rouler malgré une bosse.","expert":"Un retry sur un défaut de fond, c'est recommencer 35 fois la même erreur. du modèle","d":"Classer, résumer, extraire, décider : le modèle se choisit selon la tâche, en arbitrant coût, vitesse et qualité. Une erreur qui coûte de l'argent appelle une <strong>règle fixe</strong>, pas une opinion."},{"t":"Prompts et messages système","d":"La façon de répondre et les limites <strong>sont écrites une fois pour tous</strong> dans le message système : ils ne dépendent pas de la chance."},{"t":"Les agents : mémoire et contexte","d":"Un agent n'a pas de mémoire d'une exécution à l'autre sans mécanisme dédié. Une mémoire et une chaîne qui marchent séparément <strong>doivent être testées ensemble</strong>."},{"t":"Tools et prompt engineering","d":"<strong>Limitez les capacités par les outils</strong>, pas seulement par des phrases. Un périmètre clair réduit la dérive et simplifie la maintenance. Un agent qui ne peut pas tester quelque chose écrit « non testé »."},{"t":"Le RAG et le multimodal","d":"Charger un fichier au bon moment n'est pas un RAG : <strong>sans recherche par le sens</strong>, c'est une simple lecture."}],"key":"Quand une erreur coûte de l'argent, vous voulez une règle, pas une opinion.","cas":{"t":"Cas réel : là où il y a de l'argent, une règle fixe","ctx":"Plateforme Vivier IA et équipe d'agents du fondateur, septembre-octobre 2026.","d1":"Un paiement n'est confirmé que par un message vérifié : signature contrôlée, doublons ignorés, type d'événement précis. Jamais par le navigateur.","d2":"Un agent de supervision relit le travail des autres et rend un verdict : CONFORME, NON CONFORME ou NON VÉRIFIABLE, avec ses preuves.","lecon":"Le troisième verdict compte : quand l'agent ne peut pas vérifier, il le dit. Il ne devine pas."},"act":{"type":"verdict","title":"⚖️ Le verdict de l'agent superviseur","sub":"Vous êtes l'agent de supervision. Pour chaque situation, rendez le bon verdict : CONFORME, NON CONFORME ou NON VÉRIFIABLE. Attention : deviner est interdit.","icon":"⚖️"},"prompts":[{"t":"Ajouter ma clé d'IA en toute sécurité","use":"Pour créer une clé API chez un fournisseur et l'ajouter comme credential, sans jamais la coller ici. Aide pour l'étape 1 de l'exercice.","txt":"Je suis débutant complet. Je veux relier un modèle d'IA cloud à l'outil d'automatisation visuel appelé n8n, chez le fournisseur [NOM DU FOURNISSEUR DE MODÈLE].\nExpliquez-moi avec des mots simples ce qu'est une clé API, une credential et un modèle cloud. Guidez-moi dans l'ordre : créer la clé sur le site du fournisseur, ouvrir Credentials puis Add Credential dans l'outil, choisir le bon type et coller la clé là-bas. Dites comment vérifier que la credential est réutilisable dans un nœud IA.\nImportant : je ne collerai jamais ma vraie clé dans cette conversation. Rappelez-moi pourquoi, et utilisez seulement des exemples fictifs.","att":"Les étapes pour créer une clé et l'ajouter comme credential réutilisable, avec le rappel de ne jamais la coller dans un chat. *Source : 03-ia-agents-n8n.md, l.33-39, l.56-64.*"},{"t":"Décrire un tool pour un agent de support","use":"Pour rédiger un tool d'agent avec un nom clair et une condition d'usage explicite. Aide pour l'étape 2 de l'exercice.","txt":"Je suis débutant. Je prépare un agent IA de support client pour [VOTRE ACTIVITÉ]. Expliquez-moi avec des mots simples ce qu'est un tool et pourquoi l'agent le choisit d'après son nom et sa description.\nProposez un exemple concret de tool que cet agent devrait avoir. Donnez un nom clair, puis une description précise qui dit quand l'utiliser, quel format de données il attend et ce qu'il renvoie. Montrez aussi un mauvais exemple de nom et de description, pour comparer.\nExpliquez chaque terme technique en une phrase simple (agent, tool, description). Utilisez des exemples fictifs, sans donnée de client.","att":"Un tool avec un nom clair et une description précise (quand l'utiliser, format attendu, retour), comparé à un mauvais exemple. *Source : 03-ia-agents-n8n.md, l.213-225, l.152-167.*"},{"t":"Corriger un agent avec trop de tools","use":"Pour comprendre pourquoi un agent avec beaucoup de tools vagues répond à côté et comment le corriger. Aide pour l'étape 3 de l'exercice.","txt":"Je suis débutant. Mon agent IA a beaucoup de tools mal décrits : [LISTEZ QUELQUES TOOLS ET LEUR DESCRIPTION ACTUELLE]. Il répond souvent à côté de la question.\nExpliquez-moi avec des mots simples pourquoi un petit nombre de tools bien décrits vaut mieux que beaucoup de tools vagues. Proposez ensuite une correction : quels tools garder ou retirer, et une nouvelle description précise pour chacun. Rappelez aussi qu'on limite les capacités d'un agent par la liste de ses outils, pas seulement par des phrases.\nExpliquez chaque terme technique en une phrase simple.","att":"Une liste réduite de tools, chacun avec une description précise, et l'explication simple du problème de départ. *Source : 03-ia-agents-n8n.md, l.213-242.* ## Questions de vérification **1. Quelle différence l'IA introduit-elle par rapport à un IF ou un Switch ?** *Corrigé :* Un jugement contextuel sur des cas non prévus, là où IF et Switch suivent une règle fixe écrite d'avance. **2. Donnez deux critères pour choisir entre un modèle cloud et un modèle local.** *Corrigé :* Sensibilité des données, volume et budget, qualité et latence. **3. Quelle différence entre le prompt utilisateur et le message système ?** *Corrigé :* Le prompt varie à chaque exécution ; le message système reste constant (rôle, contraintes, format attendu). **4. Pourquoi le nom et la description d'un tool font-ils partie du prompt ?** *Corrigé :* L'agent choisit un tool d'après son nom et sa description, pas d'après son fonctionnement interne qu'il ne voit pas. **5. Citez les trois briques qui déterminent la qualité d'un RAG.** *Corrigé :* Chunking, base vectorielle, query expansion. ## Projet [À COMPLÉTER] : le texte source ne décrit pas de projet."}],"exercice":[{"e":"Créez une clé API chez un fournisseur de modèle et ajoutez-la comme credential dans n8n.","s":"la credential est réutilisable dans n'importe quel nœud IA du workflow."},{"e":"Pour un agent de support, donnez un exemple de tool avec une description précise (nom et quand l'utiliser).","s":"pas de réponse unique : nom clair et condition d'usage explicite."},{"e":"Un agent avec 15 tools vaguement décrits répond à côté : quel chapitre l'explique, et quelle correction ?","s":"tools et prompt engineering ; réduire le nombre de tools et rédiger des descriptions précises."}],"quiz":[{"q":"Quelle différence l'IA introduit-elle par rapport à un IF ou un Switch ?","x":"Un jugement contextuel sur des cas non prévus, là où IF et Switch suivent une règle fixe écrite d'avance.","o":["Un jugement contextuel sur des cas non prévus, là où IF et Switch suivent une règle fixe écrite d'avance","L'IA est toujours plus rapide qu'un IF","Un IF peut lire des images, pas l'IA","Aucune différence : c'est du marketing"],"c":0},{"q":"Donnez deux critères pour choisir entre un modèle cloud et un modèle local.","x":"Sensibilité des données, volume et budget, qualité et latence.","o":["Sensibilité des données, volume et budget, qualité et latence","La couleur du tableau de bord et le prix du VPS","Le nombre de nœuds et la version de n8n","Le nom du modèle et sa date de sortie"],"c":0},{"q":"Quelle différence entre le prompt utilisateur et le message système ?","x":"Le prompt varie à chaque exécution ; le message système reste constant (rôle, contraintes, format attendu).","o":["Le prompt varie à chaque exécution ; le message système reste constant (rôle, contraintes, format)","Le système s'écrit à chaque fois, le prompt une seule fois","Le prompt est secret, le système est public","Ils sont identiques en tout point"],"c":0},{"q":"Pourquoi le nom et la description d'un tool font-ils partie du prompt ?","x":"L'agent choisit un tool d'après son nom et sa description, pas d'après son fonctionnement interne qu'il ne voit pas.","o":["L'agent choisit un tool d'après son nom et sa description, pas d'après son code interne qu'il ne voit pas","Parce que c'est plus joli dans l'interface","Pour que le tool tourne plus vite","Pour éviter de payer la licence tool"],"c":0},{"q":"Citez les trois briques qui déterminent la qualité d'un RAG.","x":"Chunking, base vectorielle, query expansion.","o":["Chunking, base vectorielle, query expansion","Webhook, credential, schedule","Prompt, modèle, mémoire","Merge, IF, Set"],"c":0}],"ana":"Limiter un agent par les outils, c'est donner à un employé un badge qui n'ouvre que certaines portes : peu importe ce qu'on lui dit dans le couloir, il ne peut pas entrer ailleurs.","expert":"Un agent ne doit jamais deviner. Le verdict NON VÉRIFIABLE est votre meilleur ami : il vous dit ce que l'agent ne sait pas — et c'est souvent ce qui compte le plus.","erreurs":["Limiter l'agent par des phrases alors que les outils le permettraient","Confondre chargement de fichier et vrai RAG","Choisir le modèle le plus cher pour une tâche simple"],"check":["Les outils de l'agent correspondent exactement à sa mission","Le message système écrit une fois pour tous","Verdict NON VÉRIFIABLE accepté comme réponse valable","Modèle choisi selon la tâche (coût, latence, qualité)"],"action":"Listez ce que votre agent actuel a le droit de faire. Retirez tout ce qui dépasse sa mission.","glossaire":[["Message système","Le cadre constant : rôle, limites, façon de répondre"],["Tool","Une capacité d'action donnée à l'agent"],["RAG","Recherche par le sens dans une base de connaissances"],["Verdict","CONFORME, NON CONFORME ou NON VÉRIFIABLE — jamais un devinage"]],"shots":[{"img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABNgAAAL4CAIAAAAmqN0nAACZm0lEQVR4nOzdd3xT9f7H8e/JaJp0L7poadl7DwWKCk5QQBnq9bpx4N56rwv33vPnRtQroOIeiKwKguy9aUv3nkmz8/sjUGKbpGnanpLyej74o03O+X4/53tCvn3njEhRpwwXAAAAAADIRdHRBQAAAAAATi4EUQAAAACArAiiAAAAAABZEUQBAAAAALIiiAIAAAAAZEUQBQAAAADIiiAKAAAAAJAVQRQAAAAAICuCKAAAAABAVqpWrp+U0rVN6gAAAAAABJCC3Dy/1/UziJI/AQAAAOBk1pAK/Uik/pyaSwoFAAAAADj5kRBbdkSUCAoAAAAAaMQZFX0/NNqCI6KkUAAAAACAJ75nRl+D ,{"t":"Trois destinations, trois besoins","d":"Support, vente, prise de rendez-vous : chaque destination a ses propres outils. Un créneau inventé est pire qu'un créneau refusé : <strong>le tool RDV lit un vrai agenda</strong>."},{"t":"Assembler sans supposer","d":"Chaque agent testé seul ne suffit pas : <strong>tant que le test en chaîne n'a pas eu lieu, l'assemblage n'est pas validé</strong>."},{"t":"La checklist de livraison","d":"Un bon handoff permet à quelqu'un d'autre de reprendre <strong>sans tout redemander</strong> : documentation, limites, et ce qui n'est pas prouvé."}],"key":"Un routeur oriente, il ne fait pas. Le reste appartient aux destinations.","cas":{"t":"Cas réel : une équipe d'agents, un chef qui oriente","ctx":"Équipe d'agents du fondateur de Vivier IA : un chef et dix agents spécialisés, au 8 octobre 2026.","d1":"Le chef reçoit un projet, le découpe en tâches et choisit l'agent d'après sa description. Il ne fait jamais le travail lui-même. Chaque agent ne reçoit que sa part de la liste des fichiers autorisés.","d2":"Chaque agent a été testé seul. Le chef n'a pas encore été testé en chaîne sur un vrai projet.","lecon":"Tant que le test en chaîne n'a pas eu lieu, l'assemblage n'est pas validé."},"act":{"type":"routeur","title":"🔀 Les décisions du routeur","sub":"3 décisions d'architecture pour votre équipe d'agents. Le routeur oriente, il ne fait pas… mais que fait-on quand tout le monde veut tout faire ?","icon":"🔀"},"prompts":[{"t":"Comprendre ce que le tool RDV récupère","use":"Pour savoir quelle donnée le tool de rendez-vous récupère pour proposer de vrais créneaux. Aide pour l'étape 1 de l'exercice.","txt":"Je suis débutant. Je construis un agent de support pour [VOTRE ACTIVITÉ] avec trois destinations : commercial, contact et rendez-vous. Expliquez-moi avec des mots simples ce qu'est un agent routeur, puis ce que fait le tool de rendez-vous.\nDites quelle donnée ce tool doit obligatoirement récupérer pour bien fonctionner, et pourquoi proposer des créneaux vraiment libres et non inventés. Précisez ce que récupèrent le tool commercial et le tool contact, en une phrase chacun.\nExpliquez chaque terme technique en une phrase simple (routeur, tool, agenda, base de connaissances). N'utilisez que des exemples fictifs.","att":"La réponse claire : le tool de rendez-vous a besoin d'un agenda réel pour proposer des créneaux effectivement disponibles. *Source : 04-agent-ia-complet.md, l.36-46, l.69-73.*"},{"t":"Inventer une quatrième destination","use":"Pour imaginer une quatrième destination utile et l'information qu'elle devrait récupérer. Aide pour l'étape 2 de l'exercice.","txt":"Je suis débutant. Mon système de support pour [VOTRE ACTIVITÉ] a trois destinations : commercial, contact et rendez-vous. Je veux en imaginer une quatrième.\nProposez deux idées de destination utiles pour mon cas. Pour chacune, dites quelle information elle aurait besoin de récupérer (base de connaissances, système de suivi, agenda ou autre), en vérifiant que la destination et l'information sont cohérentes. Indiquez aussi comment la documenter pour qu'une autre personne puisse l'ajouter plus tard.\nExpliquez chaque terme technique en une phrase simple. Utilisez des exemples fictifs.","att":"Une destination proposée pour mon cas, avec l'information à récupérer et une note pour la documenter. *Source : 04-agent-ia-complet.md, l.69-84.*"},{"t":"Trouver pourquoi le routeur se trompe","use":"Pour savoir où chercher en premier quand le routeur envoie une demande vers le mauvais tool. Aide pour l'étape 3 de l'exercice.","txt":"Je suis débutant. Mon agent routeur envoie parfois une demande commerciale claire vers le tool contact par erreur. Voici le message type concerné, avec des données fictives : [UN MESSAGE D'EXEMPLE]. Et voici la description actuelle de mes tools : [LES DESCRIPTIONS ACTUELLES].\nExpliquez-moi avec des mots simples où chercher la cause en priorité et pourquoi, avant de soupçonner le modèle lui-même. Proposez ensuite une description plus précise pour le tool commercial, qui dit quand l'appeler et quand ne pas l'appeler, puis trois messages de test (direct, vague, ambigu).\nExpliquez chaque terme technique en une phrase simple.","att":"La cause cherchée d'abord dans la description du tool commercial, une version améliorée et trois messages de test variés. *Source : 04-agent-ia-complet.md, l.48-63, l.75-78.* ## Questions de vérification **1. Quelle est la seule responsabilité d'un agent routeur ?** *Corrigé :* Comprendre l'intention d'un message entrant et l'orienter vers le bon agent ou tool, sans jamais traiter la demande lui-même. **2. Pourquoi un message système qui grossit au fil du temps devient-il un problème ?** *Corrigé :* Il devient contradictoire ou trop vague pour être suivi, et plus difficile à corriger qu'un message court et ciblé. **3. Pourquoi le tool RDV doit-il accéder à un agenda réel ?** *Corrigé :* Pour proposer des créneaux effectivement disponibles plutôt qu'inventés. **4. Où chercher en premier quand un routeur envoie une demande commerciale vers le tool contact ?** *Corrigé :* Dans la description du tool commercial côté routeur (trop vague ou mal formulée), avant de soupçonner le modèle. **5. Que contient la checklist de livraison d'un système d'agents ?** *Corrigé :* Fonctionnel, sécurité (pas plus d'accès que le périmètre n'exige) et handoff (documenter pour qu'un autre puisse maintenir). ## Projet [À COMPLÉTER] : le texte source ne décrit pas de projet."}],"exercice":[{"e":"Donnez un exemple de donnée dont le tool RDV a besoin pour fonctionner correctement.","s":"l'accès à un agenda réel, pour proposer des créneaux effectivement disponibles."},{"e":"Imaginez une 4e destination utile pour un système de support. Quelle information devrait-elle récupérer ?","s":"pas de réponse unique : la destination et l'information doivent être cohérentes."},{"e":"Un routeur envoie parfois une demande commerciale claire vers le tool contact. Où cherchez-vous la cause en premier ?","s":"la description du tool commercial côté routeur, avant de soupçonner le modèle."}],"quiz":[{"q":"Quelle est la seule responsabilité d'un agent routeur ?","x":"Comprendre l'intention d'un message entrant et l'orienter vers le bon agent ou tool, sans jamais traiter la demande lui-même.","o":["Comprendre l'intention d'un message entrant et l'orienter vers le bon agent ou tool, sans jamais traiter la demande lui-même","Répondre lui-même aux questions simples","Superviser les credentials de l'équipe","Corriger les erreurs des autres agents"],"c":0},{"q":"Pourquoi un message système qui grossit au fil du temps devient-il un problème ?","x":"Il devient contradictoire ou trop vague pour être suivi, et plus difficile à corriger qu'un message court et ciblé.","o":["Il devient contradictoire ou trop vague pour être suivi, et plus difficile à corriger qu'un message court et ciblé","Il devient plus intelligent à chaque ligne ajoutée","Il consomme plus d'électricité","Ce n'est pas un problème, c'est la norme"],"c":0},{"q":"Pourquoi le tool RDV doit-il accéder à un agenda réel ?","x":"Pour proposer des créneaux effectivement disponibles plutôt qu'inventés.","o":["Pour proposer des créneaux effectivement disponibles plutôt qu'inventés","Pour que le tool soit plus rapide","Pour économiser des appels API","Parce que les agendas fictifs sont payants"],"c":0},{"q":"Où chercher en premier quand un routeur envoie une demande commerciale vers le tool contact ?","x":"Dans la description du tool commercial côté routeur (trop vague ou mal formulée), avant de soupçonner le modèle.","o":["Dans la description du tool commercial côté routeur (trop vague ou mal formulée), avant de soupçonner le modèle","Dans la version du modèle d'IA utilisé","Dans la couleur du nœud routeur","Chez le fournisseur d'accès internet"],"c":0},{"q":"Que contient la checklist de livraison d'un système d'agents ?","x":"Fonctionnel, sécurité (pas plus d'accès que le périmètre n'exige) et handoff (documenter pour qu'un autre puisse maintenir).","o":["Fonctionnel, sécurité (pas plus d'accès que le périmètre n'exige) et handoff","Design, vitesse, prix","Rouge, orange, vert","Dev, test, production"],"c":0}],"ana":"Le routeur, c'est le standard téléphonique : il écoute, comprend, transfère au bon service. Il ne répond jamais lui-même aux questions.","expert":"Un créneau inventé est pire qu'un créneau refusé : le client déçu part, celui à qui on a dit « je vérifie et je confirme » reste. Le tool lit un vrai agenda ou il ne promet rien.","erreurs":["Laisser le routeur traiter les demandes lui-même","Une description de tool vague qui déroute le choix","Assembler les agents sans test en chaîne"],"check":["Le routeur oriente uniquement, ne traite rien","Chaque tool a un nom et une description précis","Le test en chaîne réalisé sur un cas réel","Checklist de livraison complétée (fonctionnel, sécurité, handoff)"],"action":"Écrivez la description de votre tool le plus important comme vous l'expliqueriez à un nouveau collaborateur.","glossaire":[["Routeur","L'agent qui comprend l'intention et l'oriente, sans rien exécuter"],["Destination","L'agent spécialisé qui reçoit la demande du routeur"],["Test en chaîne","Tester l'assemblage complet, pas seulement chaque agent"],["Créneau refusé","Mieux vaut dire non que d'inventer un rendez-vous"]],"shots":[{"img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABNgAAAL4CAIAAAAmqN0nAACfAUlEQVR4nOzddXxT9/7H8e+JNFI3alCKu+uAwgYbdxsbsMHc7vwy9+03d+7cXZjeDcbGfIMxrLDh7taWUndL4/n9EQhZm5ymwikpr+eDP0LOOd/zOd+c5pt3jkSKHj1UAAAAAACgFFVbFwAAAAAAOLkQRAEAAAAAiiKIAgAAAAAURRAFAAAAACiKIAoAAAAAUBRBFAAAAACgKIIoAAAAAEBRBFEAAAAAgKIIogAAAAAARWlauHxyp46tUgcAAAAAIIjk5Rxu9rLNDKLkTwAAAAA4mXlSYTMSaXNOzSWFAgAAAADcmpEQm3ZElAgKAAAAAKjHHRUDPzTahCOipFAAAAAAgD+BZ8ZAgygpFAAAAAAgL8DkyM+3AAAAAAAUFVAQ5XAoAAAAACAQgeTHxoMoKRQAAAAAELhGUySn5gIAAAAAFNW0n29pkkXVLu//Tg6XmtrC9ocTvf/b/+mCpragv2ew93/NL25uagsAAAAAgNbVyBHRZp+XWy+F+nxGXr0U6vMZefVSqM9nAAAAAACtTj5LStGjhzZ7YX9kMmeAx0VlMmeAx0VlMifHRQE cker et l'installer correctement selon mon système. Aide pour l'étape 1 de l'exercice.","txt":"Je suis débutant complet. Je veux installer Docker pour héberger moi-même l'outil d'automatisation visuel appelé n8n. Mon système est [VOTRE SYSTÈME : Windows, Mac ou Linux].\nExpliquez-moi avec des mots simples ce qu'est Docker et pourquoi il évite le problème du « ça marche chez moi mais pas en production ». Guidez-moi ensuite pour l'installer : Docker Desktop depuis le site officiel sous Windows et Mac, ou le script d'installation officiel sous Linux. Dites ce que je dois voir pour savoir que l'installation a réussi.\nExpliquez chaque terme technique en une phrase simple (conteneur, environnement, production). Ne me demandez aucun mot de passe.","att":"Une explication simple de Docker et les étapes d'installation pour mon système, avec un signe visible que l'installation a réussi. *Source : 05-deploiement-observabilite.md, l.5-9, l.22-26.*"},{"t":"Préparer une sauvegarde hors serveur","use":"Pour comprendre l'export des workflows et credentials, puis où ranger les fichiers. Aide pour l'étape 2 de l'exercice.","txt":"Je suis débutant. Mon instance de l'outil d'automatisation visuel appelé n8n tourne sur [VOTRE HÉBERGEMENT : mon ordinateur ou un serveur]. Je veux faire une sauvegarde complète.\nExpliquez-moi avec des mots simples ce qu'une sauvegarde complète doit couvrir (workflows, credentials, données d'exécution si besoin) et pourquoi sauvegarder seulement les workflows ne suffit pas. Guidez-moi pour l'export en ligne de commande depuis l'instance, qui produit deux fichiers, puis pour les ranger ailleurs que sur le même serveur.\nRappelez que ces fichiers contiennent des accès sensibles et qu'une sauvegarde jamais restaurée n'est qu'une promesse. Expliquez chaque terme technique en une phrase simple.","att":"Les étapes pour produire deux fichiers de sauvegarde et les garder hors du serveur, avec le rappel de tester la restauration. *Source : 05-deploiement-observabilite.md, l.107-126, l.134-138.*"},{"t":"Savoir quand passer en mode queue","use":"Pour reconnaître le signal concret qui justifie plusieurs workers plutôt qu'une seule instance. Aide pour l'étape 4 de l'exercice.","txt":"Je suis débutant. Mon automatisation pour [VOTRE ACTIVITÉ] tourne sur une seule instance de l'outil d'automatisation visuel appelé n8n. Expliquez-moi avec des mots simples ce que sont le mode queue, les workers et Redis, et comment ils se répartissent le travail.\nDites à quel signal concret je saurai qu'il est temps de passer au mode queue, plutôt que d'anticiper un besoin théorique. Proposez trois questions à me poser et une façon de mesurer le retard avant de changer quoi que ce soit.\nExpliquez chaque terme technique en une phrase simple. Concluez par une règle courte : mesurer d'abord, construire ensuite.","att":"Le signal à surveiller : un retard visible et croissant aux heures de pointe, avec une façon simple de le mesurer. *Source : 05-deploiement-observabilite.md, l.111-117, l.140-141, l.153-163.* ## Questions de vérification **1. Pourquoi une configuration permissive acceptable en développement devient-elle une faille en production ?** *Corrigé :* En production, des données et systèmes réels sont exposés : la permissivité devient un vecteur d'attaque ou de fuite. **2. Qu'est-ce qu'un health check, et à quoi sert-il ?** *Corrigé :* Une vérification automatique et régulière que l'instance répond, reliée à une alerte pour transformer une panne silencieuse en signal immédiat. **3. Que doit couvrir une sauvegarde complète, au-delà des workflows ?** *Corrigé :* Les credentials, et les données d'exécution si elles doivent être conservées. **4. Quel rôle joue Redis en mode queue ?** *Corrigé :* Il porte la file d'attente entre l'instance principale et les workers, sans bloquer la réception de nouveaux déclenchements. **5. À quel signal passer en mode queue avec plusieurs workers ?** *Corrigé :* Un retard visible et croissant lors des pics d'activité, pas une anticipation sans volume réel. ## Projet [À COMPLÉTER] : le texte source ne décrit pas de projet."}],"exercice":[{"e":"Installez Docker (Docker Desktop sous Windows et Mac, script officiel sous Linux).","s":"[À COMPLÉTER] : le texte ne donne pas de signal de réussite pour l'installation."},{"e":"Depuis l'instance n8n, exportez les workflows et les credentials en ligne de commande, puis rangez les fichiers hors du serveur.","s":"deux fichiers produits (backup-workflows.json et backup-credentials.json), gardés ailleurs que sur le serveur."},{"e":"Une instance tourne depuis 6 mois sans sauvegarde et le serveur tombe. Qu'a-t-on probablement perdu ?","s":"les workflows, les credentials (donc toutes les connexions à reconfigurer) et l'historique des exécutions."},{"e":"À quel signal concret passer en mode queue avec plusieurs workers ?","s":"un retard visible et croissant lors des pics d'activité, pas une anticipation théorique."}],"quiz":[{"q":"Pourquoi une configuration permissive acceptable en développement devient-elle une faille en production ?","x":"En production, des données et systèmes réels sont exposés : la permissivité devient un vecteur d'attaque ou de fuite.","o":["En production, des données et systèmes réels sont exposés : la permissivité devient un vecteur d'attaque ou de fuite","Parce que les développeurs sont moins compétents en production","La configuration ralentit les serveurs","C'est interdit par la licence n8n"],"c":0},{"q":"Qu'est-ce qu'un health check, et à quoi sert-il ?","x":"Une vérification automatique et régulière que l'instance répond, reliée à une alerte pour transformer une panne silencieuse en signal immédiat.","o":["Une vérification automatique et régulière que l'instance répond, reliée à une alerte pour transformer une panne silencieuse en signal immédiat","Un nœud n8n qui vérifie les e-mails","Un antivirus pour serveur","Un workflow de sauvegarde nocturne"],"c":0},{"q":"Que doit couvrir une sauvegarde complète, au-delà des workflows ?","x":"Les credentials, et les données d'exécution si elles doivent être conservées.","o":["Les credentials, et les données d'exécution si elles doivent être conservées","Uniquement les workflows exportés en JSON","Uniquement les images Docker","Seulement la liste des utilisateurs"],"c":0},{"q":"Quel rôle joue Redis en mode queue ?","x":"Il porte la file d'attente entre l'instance principale et les workers, sans bloquer la réception de nouveaux déclenchements.","o":["Il porte la file d'attente entre l'instance principale et les workers, sans bloquer la réception des déclenchements","Il stocke les credentials chiffrées","Il remplace la base de données des workflows","Il sert à envoyer les alertes e-mail"],"c":0},{"q":"À quel signal passer en mode queue avec plusieurs workers ?","x":"Un retard visible et croissant lors des pics d'activité, pas une anticipation sans volume réel.","o":["Un retard visible et croissant lors des pics d'activité, pas une anticipation sans volume réel","Dès le premier jour, par principe","Quand le disque dur est plein","Uniquement après une panne totale"],"c":0}],"ana":"L'instance de production, c'est la voiture sur l'autoroute : ce qui est permis sur le parking d'essai (local) ne l'est pas sur la route, où tout va plus vite et où l'accident coûte cher.","expert":"La règle des deux environnements : tout ce qui est vrai en local doit être re-dit en production. La variable manquante du cas réel a coûté des jours ; un export/import en aurait pris des minutes.","erreurs":["Suivre une capture d'écran figée pendant l'installation","Un webhook public sans secret","Ajouter Redis « au cas où » avant d'avoir un retard mesuré"],"check":["Variables d'environnement vérifiées dans LES deux environnements","Health check relié à une alerte","Webhook protégé par un secret","Sauvegarde testée (on ne sauvegarde bien que ce qu'on a restauré)"],"action":"Comparez vos variables locales et de production une par une. Notez les différences.","glossaire":[["V us en premier","d":"Pour une première automatisation, choisissez un processus <strong>dont l'erreur se voit et se corrige</strong> — pas la chaîne de paiement."},{"t":"Écrire le brief","d":"Un bon brief écrit aussi <strong>ce qui peut mal tourner</strong>, pas seulement ce qui doit marcher : contexte, objectif, périmètre, autonomie."},{"t":"Construire le chemin principal","d":"Chemin principal prouvé ne veut pas dire parcours complet prouvé : <strong>notez ce qui reste à refaire</strong>."},{"t":"Données et tests réalistes","d":"Testez avec une valeur <strong>que le système accepterait vraiment</strong>, pas une valeur « pratique pour l'essai »."},{"t":"Assembler les briques du module","d":"Chaque maillon d'une chaîne utilise une brique du module : <strong>webhook, credential, logique, route, alerte</strong>."},{"t":"Livrer : checklist, handoff, starter","d":"Vous ne décidez pas de capitaliser après coup : vous le facilitez <strong>en documentant dès la construction</strong>."}],"key":"Pour une première automatisation, choisissez un processus dont l'erreur se voit et se corrige.","cas":{"t":"Cas réel : un premier pilote à faible risque","ctx":"Plateforme Vivier IA, septembre 2026 : première automatisation d'un service de diagnostic.","d1":"Le choix : notifier le fondateur par e-mail à chaque diagnostic terminé. Besoin confirmé le 17 septembre 2026. Si l'e-mail échoue, aucune donnée n'est perdue : la réponse du visiteur est déjà enregistrée.","d2":"La chaîne de paiement, elle, coûte de l'argent en cas d'erreur : signature vérifiée, montant de test minimal, alerte. Pas une première automatisation.","lecon":"Pour un premier pilote, choisissez un processus dont l'erreur se voit et se corrige."},"act":{"type":"pilote","title":"🧪 Choisissez votre premier pilote","sub":"4 scénarios de première automatisation. Lesquels font de bons pilotes — et lesquels sont des piégess ?","icon":"🧪"},"prompts":[{"t":"Choisir ma première automatisation","use":"Pour choisir un processus récurrent et à faible risque, et savoir pourquoi éviter un processus critique. Aide pour l'étape 1 de l'exercice.","txt":"Je suis débutant. Je veux choisir ma première automatisation avec l'outil d'automatisation visuel appelé n8n. Voici quelques processus de mon activité [VOTRE ACTIVITÉ] : [LISTEZ DEUX OU TROIS PROCESSUS].\nAidez-moi à choisir un pilote qui revient souvent, prend du temps et dont une erreur se voit et se corrige facilement. Comparez mes processus avec ces critères, puis recommandez-en un. Expliquez pourquoi un processus critique, où une erreur passerait inaperçue longtemps, ne doit pas être le premier.\nExpliquez chaque terme technique en une phrase simple (pilote, automatisation, processus critique).","att":"Un processus recommandé pour sa fréquence et son faible risque, avec la raison d'éviter un processus critique. *Source : 06-projet-complet.md, l.7-9, l.36-45.*"},{"t":"Les briques d'un projet complet","use":"Pour repérer trois briques du module qu'un projet complet peut mobiliser pour mon cas. Aide pour l'étape 3 de l'exercice.","txt":"Je suis débutant. Mon projet d'automatisation est : [DÉCRIVEZ VOTRE PROJET EN UNE PHRASE]. Expliquez-moi avec des mots simples ce qu'est un projet complet de bout en bout.\nParmi ces briques, choisissez-en trois utiles pour mon projet et dites à quoi chacune servirait : un trigger adapté à l'événement réel, une gestion d'erreur qui prévient vraiment, un agent IA pour les décisions qui dépendent du contexte, une architecture multi-agents, un déploiement sécurisé et observable. Rappelez la checklist de livraison : fonctionnel, sécurité, handoff.\nExpliquez chaque terme technique en une phrase simple.","att":"Trois briques choisies pour mon projet avec leur rôle, et un rappel de la checklist fonctionnel, sécurité, handoff. *Source : 06-projet-complet.md, l.94-109.*"},{"t":"Rédiger le brief en quatre éléments","use":"Pour rédiger le brief d'un processus réel avec contexte, objectif, périmètre et autonomie. Aide pour l'étape 4 de l'exercice.","txt":"Je suis débutant. Je veux automatiser ce processus de mon activité : [DÉCRIVEZ LE PROCESSUS ACTUEL, souvent manuel]. Aidez-moi à rédiger son brief avec le gabarit à quatre éléments.\nContexte : le processus actuel. Objectif : ce que le workflow doit produire, avec un succès mesurable. Périmètre : les cas couverts par cette première version, et ce qui reste hors périmètre. Autonomie : ce qui peut être décidé seul et ce qui doit être validé avant la mise en service. Ajoutez une courte section sur les risques.\nPosez-moi d'abord les questions qui vous manquent. Expliquez chaque terme technique en une phrase simple. Utilisez des exemples fictifs, sans donnée de client.","att":"Un brief en quatre parties pour mon processus, avec un succès mesurable, un hors périmètre clair et les risques notés. *Source : 06-projet-complet.md, l.11-34, l.44-51.* ## Questions de vérification **1. Pourquoi choisir un processus à faible risque d'erreur pour une première automatisation ?** *Corrigé :* Une erreur y est détectée et corrigée facilement, contrairement à un processus critique où elle passerait inaperçue. **2. Que doit préciser un brief, au-delà de l'objectif à atteindre ?** *Corrigé :* Ce qui définit un succès mesurable, et ce qui reste explicitement hors périmètre. **3. Pourquoi construire le chemin principal avant les cas particuliers ?** *Corrigé :* Pour valider la logique de base avant d'ajouter la complexité, sur un socle déjà éprouvé. **4. Quels sont les quatre éléments du gabarit de brief du Module 1 ?** *Corrigé :* Contexte, objectif, périmètre, autonomie. **5. Que précise le handoff d'un projet n8n livré ?** *Corrigé :* Comment reprendre le workflow, où sont les credentials, et quoi faire quand le monitoring envoie une alerte. ## Projet [À COMPLÉTER] : le texte source ne décrit pas de projet distinct. Il propose de rédiger le brief d'un processus réel (question 5)."}],"exercice":[{"e":"Pourquoi choisir un processus à faible risque d'erreur pour une première automatisation ?","s":"une erreur se détecte et se corrige facilement, contrairement à un processus critique."},{"e":"Que doit préciser un brief, au-delà de l'objectif ?","s":"un succès mesurable et ce qui reste explicitement hors périmètre pour cette première version."},{"e":"Citez trois briques des sections précédentes qu'un projet complet peut mobiliser.","s":"trigger adapté, gestion d'erreur, agent IA, multi-agents, déploiement sécurisé (trois au choix)."},{"e":"Choisissez un processus réel de votre activité et rédigez son brief avec le gabarit à quatre éléments.","s":"pas de réponse unique : cohérence et pertinence pour le cas choisi."}],"quiz":[{"q":"Pourquoi choisir un processus à faible risque d'erreur pour une première automatisation ?","x":"Une erreur y est détectée et corrigée facilement, contrairement à un processus critique où elle passerait inaperçue.","o":["Parce qu'une erreur y est détectée et corrigée facilement, contrairement à un processus critique où elle passerait inaperçue","Parce que les clients préfèrent les petits projets","Les processus critiques sont réservés aux experts","Pour éviter de payer les webhooks"],"c":0},{"q":"Que doit préciser un brief, au-delà de l'objectif à atteindre ?","x":"Ce qui définit un succès mesurable, et ce qui reste explicitement hors périmètre.","o":["Ce qui définit un succès mesurable, et ce qui reste explicitement hors périmètre","La couleur des nœuds et le nom du workflow","Les prix négociés avec le client","La liste des bugs connus du client"],"c":0},{"q":"Pourquoi construire le chemin principal avant les cas particuliers ?","x":"Pour valider la logique de base avant d'ajouter la complexité, sur un socle déjà éprouvé.","o":["Pour valider la logique de base avant d'ajouter la complexité, sur un socle déjà éprouvé","Parce que les cas particuliers sont ennuyeux","Le chemin principal se construit toujours en dernier","Cela n'a aucune importance"],"c":0},{"q":"Quels sont les quatre éléments du gabarit de brief du Module 1 ?","x":"Contexte, objectif, périmètre, autonomie.","o":["Contexte, objectif, périmètre, autonomie","Titre, image, prix, délai","Webhook, credential, route, alerte","Budget, équipe, outil, délai"],"c":0},{"q":"Que précise le handoff d'un projet n8n livré ?","x":"Comment reprendre le workflow, où sont les credentials, et quoi faire quand le monitoring envoie une alerte.","o":["Comment reprendre le workflow, où sont les credentials, et quoi faire quand le monitoring envoie une alerte","Le code source complet de n8n","Les identifiants bancaires du client","Uniquement une capture d'écran de la dernière exécution"],"c":0}],"ana":"Le premier pilote, c'est apprendre à conduire sur un parking vide, pas sur l'autoroute : l'erreur se voit, se corrige, et ne coûte rien à personne.","expert":"Le premier projet est une école, pas une rente. Choisissez-le pour ce qu'il vous apprendra, pas pour ce qu'il vous rapportera. La chaîne de paiement viendra, une fois vos réflexes acquis.","erreurs":["Choisir la chaîne de paiement comme premier projet","Tester avec des valeurs fictives que le système refuserait","Ne rien documenter « parce que c'est un test »"],"check":["Brief écrit avec les 4 éléments + ce qui peut mal tourner","Chemin principal prouvé avant les cas particuliers","Tests avec des valeurs réalistes","Handoff documenté dès la construction"],"action":"Écrivez en 5 lignes le brief de votre première automatisation : contexte, objectif, périmètre, autonomie, et ce qui peut mal tourner.","glossaire":[["Pilote","Une première automatisation à faible risque pour apprendre"],["Chemin principal","Le parcours nominal, avant les cas particuliers"],["Brief","Le cadrage écrit avant de construire"],["Handoff","La passation qui permet de reprendre sans vous"]],"shots":[{"img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABNgAAAL4CAIAAAAmqN0nAACUcUlEQVR4nOzddXwT9x/H8W+Stql7qUBLi7s7FAbb+CFDNmQ+xnzM3QdsgzFh7s4cGGPMkDFgdLhDcWmhUHdvGvn9EQhdmlyudmna1/PBH23u7nuf+36PfPvOXRJV
