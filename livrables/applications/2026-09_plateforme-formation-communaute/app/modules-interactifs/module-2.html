flows sans dossiers, sans tags, sans convention de nommage sont <strong>impossibles à parcourir</strong>."},{"t":"Archiver plutôt que laisser traîner","d":"Archivez vos copies dès que l'essai est terminé. Un workflow peut être <strong>« en service » et cassé</strong> en même temps."},{"t":"La sécurité, une habitude continue","d":"Une mise en ligne qui marche n'est pas une mise en ligne <strong>auditée</strong>. Les habitudes comptent plus que les outils."},{"t":"La revue périodique","d":"Retestez après la mise en service, et faites une revue régulière des <strong>erreurs qui reviennent</strong> sans avoir été traitées."},{"t":"La communauté et les templates","d":"Avant d'installer un template, posez la question : <strong>« qu'est-ce que cela va faire ? »</strong>"}],"key":"Une mise en ligne qui marche n'est pas une mise en ligne auditée.","cas":{"t":"Cas réel : un workflow qui casse sans bruit","ctx":"Plateforme Vivier IA, septembre-octobre 2026 : le workflow de confirmation de paiement.","d1":"Il avait échoué 35 fois sur 35. Il était « en service » et ne faisait rien. Un simple regard sur la liste des workflows ne l'aurait jamais montré.","d2":"Ce qui l'a révélé : un test de bout en bout, répété dans le temps.","lecon":"Retestez après la mise en service, et faites une revue régulière des erreurs qui reviennent sans avoir été traitées."},"act":{"type":"revue","title":"🔍 La revue qui sauve","sub":"3 situations de maintenance. Faites les bons choix : la réponse qui « marche » n'est pas toujours la réponse qui protège.","icon":"🔍"},"prompts":[{"t":"Tester une mise à jour sans risque","use":"Pour comprendre pourquoi tester une mise à jour hors production et comment s'y prendre. Aide pour l'étape 1 de l'exercice.","txt":"Je suis débutant. J'utilise l'outil d'automatisation visuel appelé n8n pour [VOTRE ACTIVITÉ]. Une mise à jour est disponible. Expliquez-moi avec des mots simples pourquoi il faut la tester ailleurs qu'en production avant de l'appliquer partout, en parlant des correctifs de sécurité, des nouveaux nœuds et du changement possible de comportement des nœuds existants.\nProposez une courte marche à suivre en étapes : où tester, quoi vérifier, quand appliquer en production. Ajoutez une règle pour archiver ou désactiver explicitement ce qui ne sert plus.\nExpliquez chaque terme technique en une phrase simple (production, mise à jour, archiver).","att":"Une marche à suivre simple : tester hors production, vérifier le comportement des nœuds, puis appliquer partout. *Source : 07-hacks-astuces.md, l.5-15, l.29-33.*"},{"t":"Préparer ma revue de sécurité","use":"Pour préparer une revue périodique : credentials utilisées, workflows inactifs et erreurs qui reviennent. Aide pour l'étape 2 de l'exercice.","txt":"Je suis débutant. Je veux faire une revue de sécurité régulière de mes workflows pour [VOTRE ACTIVITÉ]. Expliquez-moi avec des mots simples pourquoi la sécurité est une habitude continue et pas une étape au lancement.\nCréez une checklist de revue périodique avec trois points : quelles credentials sont encore réellement utilisées, quels workflows n'ont pas tourné depuis longtemps, quelles erreurs reviennent sans avoir été traitées. Pour chaque point, donnez une question à me poser et une action possible, par exemple désactiver ce qui n'a plus de raison d'exister.\nExpliquez chaque terme technique en une phrase simple. Ne me demandez aucune clé ni aucun mot de passe.","att":"Une checklist de revue en trois points avec une question et une action pour chacun, utilisable à intervalle régulier. *Source : 07-hacks-astuces.md, l.39-58, l.71-75.*"},{"t":"Inspecter un template avant usage","use":"Pour savoir quoi vérifier dans un template de la communauté avant de l'importer et de l'activer. Aide pour l'étape 3 de l'exercice.","txt":"Je suis débutant. Je veux utiliser un template de workflow trouvé dans la communauté pour [CE QUE VOUS VOULEZ AUTOMATISER]. Expliquez-moi avec des mots simples pourquoi je ne dois jamais l'importer à l'aveugle ni l'activer tout de suite.\nDonnez-moi une liste de vérification : quelles credentials il demande, quelles actions il fait vraiment, et si cela correspond à ce qu'il prétend faire. Dites aussi comment savoir s'il demande des permissions trop larges ou une logique qui ne correspond pas à mon besoin.\nExpliquez chaque terme technique en une phrase simple. Précisez qu'il vaut mieux savoir chercher et évaluer que tout mémoriser.","att":"Une liste de vérification en trois points : credentials demandées, actions réelles et cohérence avec son objectif. *Source : 07-hacks-astuces.md, l.81-96.* ## Questions de vérification **1. Pourquoi tester une mise à jour n8n ailleurs qu'en production ?** *Corrigé :* Elle peut changer le comportement de nœuds existants : la tester ailleurs évite de casser la production. **2. Que vérifie une revue de sécurité périodique ?** *Corrigé :* Les credentials réellement utilisées, les workflows qui n'ont pas tourné depuis longtemps, les erreurs qui reviennent sans traitement. **3. Pourquoi archiver ou désactiver un workflow inutile ?** *Corrigé :* Il fait du bruit, peut consommer des ressources ou cacher un risque, comme une credential encore active. **4. Pourquoi inspecter un template avant de l'importer ?** *Corrigé :* Pour vérifier les permissions demandées et sa cohérence avec ce qu'il prétend faire. **5. Qu'avait de particulier le workflow qui avait échoué 35 fois sur 35 ?** *Corrigé :* Il était en service mais ne faisait rien ; seul un test de bout en bout répété dans le temps le montre. ## Projet [À COMPLÉTER] : le texte source ne décrit pas de projet."}],"exercice":[{"e":"Pourquoi tester une mise à jour n8n ailleurs qu'en production avant de l'appliquer partout ?","s":"une mise à jour peut changer le comportement de nœuds existants."},{"e":"Donnez un exemple concret de ce qu'on vérifie dans une revue de sécurité périodique.","s":"credentials réellement utilisées, workflows qui n'ont pas tourné depuis longtemps, erreurs qui reviennent sans traitement."},{"e":"Pourquoi inspecter un template communautaire avant de l'utiliser ?","s":"vérifier les permissions demandées et la cohérence entre ce qu'il prétend faire et ce qu'il fait."},{"e":"En une phrase, expliquez le module 2 à un futur apprenant de Vivier IA.","s":"pas de réponse unique : pertinence et appropriation personnelle."}],"quiz":[{"q":"Pourquoi tester une mise à jour n8n ailleurs qu'en production ?","x":"Elle peut changer le comportement de nœuds existants : la tester ailleurs évite de casser la production.","o":["Parce qu'elle peut changer le comportement de nœuds existants : la tester ailleurs évite de casser la production","Les mises à jour n8n ne changent jamais rien","Parce que la production n'a pas internet","Pour économiser de l'électricité"],"c":0},{"q":"Que vérifie une revue de sécurité périodique ?","x":"Les credentials réellement utilisées, les workflows qui n'ont pas tourné depuis longtemps, les erreurs qui reviennent sans traitement.","o":["Les credentials réellement utilisées, les workflows inactifs depuis longtemps, les erreurs qui reviennent sans traitement","La décoration du tableau de bord et les couleurs","Le nombre de likes sur la communauté","La vitesse de la connexion Wi-Fi"],"c":0},{"q":"Pourquoi archiver ou désactiver un workflow inutile ?","x":"Il fait du bruit, peut consommer des ressources ou cacher un risque, comme une credential encore active.","o":["Il fait du bruit, peut consommer des ressources ou cacher un risque, comme une credential encore active","Un workflow inactif est totalement inoffensif","Archiver supprime définitivement les données clients","C'est impossible dans n8n"],"c":0},{"q":"Pourquoi inspecter un template avant de l'importer ?","x":"Pour vérifier les permissions demandées et sa cohérence avec ce qu'il prétend faire.","o":["Pour vérifier les permissions demandées et sa cohérence avec ce qu'il prétend faire","Pour compter les nœuds et estimer le prix","Pour regarder seulement la note sur 5 étoiles","Tous les templates sont sûrs par défaut"],"c":0},{"q":"Qu'avait de particulier le workflow qui avait échoué 35 fois sur 35 ?","x":"Il était en service mais ne faisait rien ; seul un test de bout en bout répété dans le temps le montre.","o":["Il était en service mais ne faisait rien ; seul un test de bout en bout répété dans le temps le montre","Il était désactivé, donc sans danger","Il envoyait trop d'alertes","Il tournait trop vite pour être suivi"],"c":0}],"ana":"La maintenance, c'est l'entretien de la voiture : pas quand elle est en panne sur l'autoroute, mais régulièrement, au garage, quand tout roule.","expert":"Le workflow de 35 échecs était « en service ». La liste des workflows ne montre que leur existence, pas leur santé. Seul un test répété dans le temps révèle un mourant silencieux.","erreurs":["Mettre à jour en production sans test ailleurs","Laisser des workflows inactifs avec des credentials actives","Installer un template sans lire ce qu'il fait"],"check":["Mises à jour testées sur une copie avant production","Workflows inactifs archivés, credentials révoquées","Revue des erreurs récurrentes planifiée (mensuelle)","Avant chaque template : « que va-t-il faire ? » posée"],"action":"Planifiez 30 minutes ce vendredi : revue des workflows inactifs et de leurs credentials.","glossaire":[["Revue périodique","Un rendez-vous régulier avec la santé de vos workflows"],["Archiver","Retirer proprement ce qui ne sert plus, sans détruire"],["Template","Un workflow prêt à l'emploi, à inspecter avant d'installer"],["Credential active","Une clé qui fonctionne encore : un risque tant qu'elle existe"]],"shots":[{"img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABNgAAAL4CAIAAAAmqN0nAACGWUlEQVR4nOzdd3QbVd7G8Tvqcrfc7dhxepxeSCHByUKooUNoC2yWXnfpS2fpWXovSw9tIaF38gYIhEBCEtJ7cYp7l4t6ef9QIowsjWXZGVnO93M4HEWaufObO+O5ejSjkZQ6eZwAAAAAAEApqmgXAAAAAAA4uBBEAQAAAACKIogCAAAAABRFEAUAAAAAKIogCgAAAABQFEEUAAAAAKAogigAAAAAQFEEUQAAAACAogiiAAAAAABFabo4f25+n26pAwAAAAAQQ8r3lkY8b4RBl      h += '<figure style="margin:0 0 14px"><img src="' + sh.img + '" style="width:100%;border-radius:14px;border:1px solid var(--line);display:block" alt="Capture guidee">'
        + '<figcaption style="font-size:13px;color:var(--muted);padding:9px 4px 0"><b style="color:var(--teal2)">📸 La pratique en image —</b> ' + sh.cap + '</figcaption></figure>';
   }
   h += '</div>';
 }
 if (s.shots && s.shots.length) {
   h += '<div style="margin-top:16px">';
   for (const sh of s.shots) {
     h += '<figure style="margin:0 0 14px"><img src="' + sh.img + '" style="width:100%;border-radius:14px;border:1px solid var(--line);display:block" alt="Capture guidee">'

/* ---- Notes personnelles ---- */
function notesHTML(s){return '<div class="card" style="margin-top:16px"><h3><span class="ico">📝</span>Mes notes personnelles</h3><div class="hintline">✍️ Vos idées, sauvegardées automatiquement sur cet appareil.</div><textarea id="note-'+s.num+'" class="note-area" placeholder="Ex. : vérifier la pagination tarifs avant la suite, idée d\u2019automatisation pour le client X..."></textarea><div style="display:flex;gap:10px;margin-top:8px;align-items:center"><button class="btn ghost" id="notesave-'+s.num+'">💾 Sauvegarder</button><span id="notemsg-'+s.num+'" style="color:var(--ok);font-size:13px"></span></div></div>'}
function loadNote(num){try{return localStorage.getItem(LS+"_note_"+num)||""}catch(e){return""}}
function saveNote(num,val){try{localStorage.setItem(LS+"_note_"+num,val)}catch(e){}}
function initNotes(v,s){const ta=v.querySelector("#note-"+s.num);if(!ta)return;ta.value=loadNote(s.num);const btn=v.querySelector("#notesave-"+s.num),msg=v.querySelector("#notemsg-"+s.num);const doSave=()=>{saveNote(s.num,ta.value);if(msg){msg.textContent="✓ Sauvegardé";setTimeout(()=>{msg.textContent=""},1500)}};if(btn)btn.onclick=doSave;ta.addEventListener("input",()=>{clearTimeout(ta._t);ta._t=setTimeout(doSave,800)})}
/* ---- Stats ---- */

function initQuiz(v,s){
 const box=v.querySelector("#quiz-"+s.num),sc=v.querySelector("#qs-"+s.num);
 box.innerHTML=s.quiz.map((q,i)=>`<div class="quiz-q"><div class="qq"><span class="qn">${i+1}</span>${q.q}</div>${q.o.map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${o}</button>`).join("")}<div class="q-expl" id="ex-${s.num}-${i}">💡 ${q.x}</div></div>`).join("")+`<button class="btn" id="qb-${s.num}" style="display:none">Valider ma note</button>`;
 const answers={};let locked=false;
 box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  if(locked)return;const i=+b.dataset.q;answers[i]=+b.dataset.j;
  box.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>x.classList.remove("good","bad"));
  b.classList.add("good");
  box.querySelector("#ex-"+s.num+"-"+i).classList.add("show");
  if(Object.keys(answers).length===s.quiz.length){const btn=box.querySelector("#qb-"+s.num);btn.style.display="inline-block";btn.onclick=()=>{
   locked=true;let n=0;s.quiz.forEach((q,i)=>{if(answers[i]===q.c)n++;recordStat(s.num,i,answers[i]===q.c);box.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>{x.disabled=true;if(+x.dataset.j===q.c)x.classList.add("good");else if(answers[i]===+x.dataset.j)x.classList.add("bad")})});
   const win=n>=4;sc.className="quiz-score show "+(win?"win":"retry");
   sc.innerHTML=win?`🎉 Score : ${n}/5 — Section validée ! ${n===5?"Score parfait, bravo.":"Relisez la question ratée pour viser le 5/5."}`:`Score : ${n}/5 — Il faut 4/5 pour valider. Relisez les explications et réessayez.`;
   if(win){state.done[s.num]=true;save();progUpdate()}
  }}
 });
}

function gameLoop(box,steps,endMsg){
 let i=0,score=0;box.innerHTML='<div id="gz"></div>';const z=box.querySelector("#gz");
 function step(){if(i>=steps.length){z.innerHTML=`<div class="final-hero"><div class="big-emoji">${score>=steps.length-1?"🏆":"📝"}</div><h3>Score : ${score}/${steps.length}</h3><p style="color:var(--muted);margin-top:8px">${endMsg(score,steps.length)}</p></div>`;return}
  const S=steps[i];z.innerHTML=`<div class="hintline">Situation ${i+1}/${steps.length}</div><div class="card" style="background:var(--bg2)"><strong>${S.q}</strong><br><br>${S.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}<div class="feedback" id="gfb"></div></div>`;
  z.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const win=+b.dataset.j===S.c;if(win)score++;z.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.j===S.c)x.classList.add("good");else if(x===b)x.classList.add("bad")});
   const fb=z.querySelector("#gfb");fb.className="feedback show "+(win?"ok":"ko");fb.innerHTML=(win?"✅ ":"⚠️ ")+S.x;setTimeout(()=>{i++;step()},2300)})}
 step();
}

  {q:"À chaque paiement confirmé sur le site, activer l'accès de l'élève.",o:["🌐 Webhook","⏰ Schedule","⚡ App Trigger","👆 Manual"],c:0,x:"Le site est l'événement externe : il appelle n8n au moment du paiement. Un Schedule ne saurait pas quand ; un App Trigger ne voit pas dans votre site."},
  {q:"Tous les jours à 8h, envoyer le récapitulatif des diagnostics de la veille.",o:["🌐 Webhook","⏰ Schedule","⚡ App Trigger","👆 Manual"],c:1,x:"Un rythme horaire régulier, sans événement externe : c'est exactement le travail du trigger Schedule."},
  {q:"Quand un visiteur soumet le formulaire Tally, créer automatiquement sa fiche.",o:["🌐 Webhook","⏰ Schedule","⚡ App Trigger","👆 Manual"],c:2,x:"Tally a un trigger natif : l'événement arrive de l'application elle-même, sans webhook à construire. Partez de l'événement réel du besoin, pas du trigger le plus facile."},
  {q:"Vérifier, pendant la construction, qu'un workflow répond bien.",o:["🌐 Webhook","⏰ Schedule","⚡ App Trigger","👆 Manual"],c:3,x:"Le trigger Manual sert à tester : il ne se déclenche que quand VOUS cliquez. Tout workflow se lit ainsi : un déclencheur, des nœuds, une sortie."}],

  {q:"Une API distante renvoie parfois un 502 pendant quelques secondes, puis répond normalement.",o:["Continue on Fail","Retry on Fail","Error Trigger"],c:1,x:"Une erreur transitoire se traite avec Retry on Fail : la nouvelle tentative a des chances de réussir."},
  {q:"Un workflow de facturation échoue : vous voulez être alerté immédiatement et garder une trace.",o:["Continue on Fail","Retry on Fail","Error Trigger"],c:2,x:"L'Error Trigger déclenche un workflow séparé de notification : centralisé, rattaché, alerte immédiate."},
  {q:"Une étape d'enrichissement non bloquante échoue souvent, mais le reste du workflow doit continuer.",o:["Continue on Fail","Retry on Fail","Error Trigger"],c:0,x:"Continue on Fail laisse le workflow finir son travail malgré l'échec de cette étape non critique."},
  {q:"35 échecs sur 35 : le secret ne correspond pas. Premier réflexe ?",o:["Retry on Fail","Continue on Fail","Diagnostiquer la cause réelle avant tout","Error Trigger"],c:2,x:"Un retry aurait répété les 35 échecs : le défaut est de fond. On diagnostique d'abord — puis on rattache une alerte et on la vérifie avec une vraie erreur."}],
 (s,t)=>s>=t-1?"Parfait : vous distinguez erreur transitoire, erreur de fond et notification. Une alerte non rattachée ne protège rien.":"Le trio magique : Continue on Fail (continuer), Retry on Fail (transitoire), Error Trigger (alerter). Et le défaut de fond se diagnostique, il ne se retente pas.");
}

  {q:"La fiche affirme que le bouton a été testé, mais aucune capture, aucun log n'est fourni.",o:["CONFORME","NON CONFORME","NON VÉRIFIABLE"],c:2,x:"L'agent ne peut pas vérifier l'affirmation : il le dit. Le troisième verdict compte — quand il ne peut pas vérifier, il ne devine pas."},
  {q:"Le prix annoncé dans la fiche ne correspond pas au document source joint.",o:["CONFORME","NON CONFORME","NON VÉRIFIABLE"],c:1,x:"Une contradiction vérifiée contre la source : NON CONFORME. Là où il y a de l'argent, vous voulez une règle, pas une opinion."}],

function actRouteur(box){
 gameLoop(box,[
  {q:"Une demande commerciale arrive (« quel est votre prix ? »). Que fait le routeur ?",o:["Il répond lui-même, c'est rapide","Il transmet à l'agent vente, sans jamais traiter la demande","Il ignore la demande"],c:1,x:"Un routeur oriente, il ne fait pas. S'il traite la demande, il n'est plus un routeur — et le message système qui grossit devient contradictoire."},
  {q:"On demande un créneau de rendez-vous, mais aucun agenda n'est branché au tool RDV.",o:["Inventer un créneau plausible","Répondre « demain 14h » au hasard","Proposer de brancher l'agenda ou refuser — jamais inventer"],c:2,x:"Un créneau inventé est pire qu'un créneau refusé : le tool RDV lit un vrai agenda, ou il ne promet rien."},
  {q:"Les demandes commerciales aboutissent au mauvais tool. Où chercher en PREMIER ?",o:["Dans la description du tool commercial côté routeur","Dans la version du modèle d'IA","Dans les credentials de l'équipe"],c:0,x:"L'agent choisit un tool d'après son nom et sa description. Une description trop vague côté routeur déroute le choix — avant toute suspicion sur le modèle."}],
 (s,t)=>s>=t-1?"Votre routeur est un chef d'orchestre : il comprend, il oriente, il ne fait rien lui-même.":"Le routeur orchestre : comprendre l'intention, la transmettre à la bonne destination. Le reste appartient aux destinations.");
}
/* 05 — Local ou production */
function actEnviro(box){
 const items=[["Webhook public, protégé par un secret partagé","prod","Un point d'entrée exposé au public n'existe qu'en production — et il doit être protégé."],
  ["Mot de passe d'application Gmail, utilisé par la credential SMTP","both","Une credential sert dans les deux environnements ; elle est centralisée et se met à jour en un seul endroit."],
  ["Option « autoriser les certificats non vérifiés », pour un test local","local","À réserver au développement : en production, c'est une faille de sécurité."],
  ["Health check relié à une alerte","prod","Le rôle de l'Error Trigger, mais pour l'infrastructure : ça n'a de sens que sur l'instance en service."],
  ["Tentatives de Retry on Fail sur un appel API","both","Réglage du workflow : il s'applique partout où le workflow tourne."],
  ["Variable d'environnement : l'adresse du webhook de paiement","both","Le cas réel du module : définie en local pour le test, elle manquait en production. Deux environnements, deux tests."]];
 const L={local:"💻 Local uniquement",prod:"🚀 Production",both:"🌍 Les deux"};
 box.innerHTML=items.map((it,i)=>`<div class="match-row"><span class="m-lab">${it[0]}</span><select data-i="${i}"><option value="">— Choisir —</option>${Object.keys(L).map(k=>`<option value="${k}">${L[k]}</option>`).join("")}</select><span id="ev-${i}"></span></div>`).join("")+`<button class="btn" id="evval" style="margin-top:10px">Vérifier mes choix</button><div class="feedback" id="evfb"></div>
 <div id="evq" style="display:none;margin-top:14px"><div class="card" style="background:var(--bg2)"><strong>Question : quel signal justifie d'ajouter le mode queue (Redis) ?</strong><br><br><button class="opt" data-q="0">Dès le premier jour, par principe</button><button class="opt" data-q="1">Un retard visible et croissant lors des pics d'activité</button><button class="opt" data-q="2">Quand le disque dur est plein</button><div class="feedback" id="evqfb"></div></div></div>`;
 box.querySelector("#evval").onclick=()=>{let n=0;items.forEach((it,i)=>{const s=box.querySelector(`select[data-i="${i}"]`),ok=s.value===it[1],mark=box.querySelector("#ev-"+i);s.disabled=true;if(ok){n++;mark.innerHTML="<span style='color:var(--ok)'>✓</span>";s.style.borderColor="var(--ok)"}else{mark.innerHTML="<span style='color:var(--ko)'>✗</span>";s.style.borderColor="var(--ko)"}});
  const fb=box.querySelector("#evfb");fb.className="feedback show "+(n===6?"ok":"ko");
  fb.innerHTML=n===6?"🏆 Parfait. Et n'oubliez pas la règle d'or : une configuration qui marche en local n'existe pas encore en production. Deux environnements, deux tests.":`Score : ${n}/6. La variable d'environnement du cas réel est piégeuse : elle doit exister dans LES DEUX environnements.`;
  box.querySelector("#evq").style.display="block"};
 box.querySelectorAll("#evq .opt").forEach(b=>b.onclick=()=>{box.querySelectorAll("#evq .opt").forEach(x=>{x.disabled=true;if(+x.dataset.q===1)x.classList.add("good");else if(x===b)x.classList.add("bad")});
  const fb=box.querySelector("#evqfb");fb.className="feedback show ok";fb.innerHTML="✅ Le mode queue est un changement d'infrastructure, pas de construction : construisez-le quand un retard mesurable apparaît, pas avant."});
}
/* 06 — Choisissez votre premier pilote */
function actPilote(box){
 gameLoop(box,[
  {q:"Notifier le fondateur par e-mail à chaque diagnostic terminé.",o:["✅ Bon premier pilote","⚠️ Piège"],c:0,x:"Erreur visible (l'e-mail n'arrive pas) et sans conséquence irréversible : la réponse du visiteur est déjà enregistrée. C'est exactement le pilote du cas réel."},
  {q:"Activer l'accès des élèves sur la chaîne de paiement.",o:["✅ Bon premier pilote","⚠️ Piège"],c:1,x:"Là, une erreur coûte de l'argent et bloque des clients qui ont payé. Ce n'est pas une première automatisation — c'est une chaîne critique à sécuriser d'abord."},
  {q:"Formatter chaque semaine un rapport interne à partir d'une feuille de calcul.",o:["✅ Bon premier pilote","⚠️ Piège"],c:0,x:"Public interne, erreur facile à repérer et à corriger, aucune donnée client exposée : parfait pour apprendre."},
  {q:"Envoyer un code promo à toute la base d'e-mails en une seule exécution.",o:["✅ Bon premier pilote","⚠️ Piège"],c:1,x:"Un envoi massif est irréversible et public : impossible de « corriger » un mail parti. À réserver à une chaîne déjà éprouvée."}],
 (s,t)=>s>=t-1?"Vous avez l'instinct du pilote : erreur qui se voit, qui se corrige, sans irréversibilité.":"Pour un premier pilote, choisissez un processus dont l'erreur se voit et se corrige — jamais la chaîne de paiement.");
}
/* 07 — La revue qui sauve */
function actRevue(box){
 gameLoop(box,[
  {q:"Une mise à jour n8n est disponible sur votre instance en production.",o:["L'appliquer immédiatement partout","La tester ailleurs, puis l'appliquer partout","Ne jamais mettre à jour"],c:1,x:"Une mise à jour peut changer le comportement de nœuds existants : testez-la ailleurs d'abord. Les habitudes comptent plus que les outils."},
  {q:"Un workflow n'a pas tourné depuis 3 mois, mais sa credential est encore active.",o:["Le laisser, il ne fait rien","L'archiver ou le désactiver, et révoquer la credential","Le supprimer sans toucher à la credential"],c:1,x:"Un workflow peut être « en service » et cassé — ou inactif et dangereux. Archivez, et révoquez la credential inutilisée : elle cache un risque."},
  {q:"Un template trouvé sur la communauté semble parfait pour votre besoin.",o:["L'installer tel quel, la communauté vérifie","Inspecter ses permissions et sa cohérence avant d'importer","Le recopier à la main pour être sûr"],c:1,x:"« Qu'est-ce que cela va faire ? » : vérifiez les permissions demandées et la cohérence avec ce qu'il prétend faire. Pas lu, pas installé."}],
 (s,t)=>s>=t-1?"Vous faites de la maintenance une habitude continue. Une mise en ligne qui marche n'est pas une mise en ligne auditée.":"Revue périodique : mises à jour testées ailleurs, workflows inactifs archivés, templates inspectés.");
}
/* ---- Évaluation finale ---- */
function finalHTML(){
 const n=Object.keys(state.done).length;
 return `<div class="sec-head"><div class="sec-num">🏆</div><div><h2>Évaluation finale du module</h2><div class="sub">10 questions mélangées tirées des 7 sections. 8 bonnes réponses pour valider le module. ${state.final!==null?`<strong style="color:var(--orange2)">Dernière tentative : ${state.final}/10</strong>`:""}</div></div></div>
 ${n<7?`<div class="safe-note">📌 <div>Vous avez validé ${n}/7 sections. L'évaluation est disponible à tout moment, mais les sections non validées comptent aussi pour finir le module.</div></div>`:""}
 ${state.final>=8?'<div class="card" style="margin-bottom:16px;border-color:var(--gold)"><h3><span class="ico">🎓</span>Votre certificat est prêt</h3><p style="color:var(--muted);font-size:14px;margin-bottom:12px">Score final : <b style="color:var(--gold)">'+(state.final)+'/10</b> — générez votre certificat nominatif, imprimable ou enregistrable en PDF.</p><button class="btn" onclick="showCertPrompt(state.final)">🎓 Générer mon certificat</button></div>':''}<div class="card" id="finalbox"></div>`;
}
function initFinal(v){
 const box=v.querySelector("#finalbox");
 box.innerHTML=FINAL.map((q,i)=>`<div class="quiz-q"><div class="qq"><span class="qn">${i+1}</span>${q.q} <span style="color:var(--dim);font-size:12px">(section ${q.s})</span></div>${q.o.map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${o}</button>`).join("")}<div class="q-expl" id="fx-${i}"></div></div>`).join("")+`<button class="btn" id="fgo" style="display:none;margin-top:6px">Valider l'évaluation</button><div class="quiz-score" id="fres"></div>`;
 const ans={};let locked=false;
 box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(locked)return;const i=+b.dataset.q;ans[i]=+b.dataset.j;box.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>x.classList.remove("good","bad"));b.classList.add("good");
  if(Object.keys(ans).length===FINAL.length){const g=box.querySelector("#fgo");g.style.display="inline-block";g.onclick=()=>{
   locked=true;let n=0;FINAL.forEach((q,i)=>{if(ans[i]===q.c)n++;box.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>{x.disabled=true;if(+x.dataset.j===q.c)x.classList.add("good");else if(ans[i]===+x.dataset.j)x.classList.add("bad")});const ex=box.querySelector("#fx-"+i);ex.textContent="💡 Réponse liée à la section "+q.s+" — voir la section correspondante pour réviser.";ex.classList.add("show")});
   state.final=n;save();const r=box.querySelector("#fres");const win=n>=8;r.className="quiz-score show "+(win?"win":"retry");
   r.innerHTML=win?`🏆 ${n}/10 — Module validé ! Vous êtes prêt·e à passer au module 3. Idée centrale à emporter : on apprend à diriger un agent qui code, en cadrant, en vérifiant et en choisissant les outils selon le besoin plutôt que par habitude.`:`${n}/10 — Il faut 8/10. Les questions ratées sont signalées avec leur section : retournez y jeter un œil, puis recommencez.`;
   if(win){setTimeout(()=>showCertPrompt(n),1200);const em=["🎉","🌟","🚀","🎊","🏆","💜","🧡"];for(let k=0;k<40;k++){const c=document.createElement("div");c.className="confetti";c.textContent=em[k%em.length];c.style.left=Math.random()*100+"vw";c.style.animationDuration=(2+Math.random()*2)+"s";c.style.animationDelay=(Math.random()*1.2)+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),5000)}}}}});
}

progUpdate();show("accueil");
