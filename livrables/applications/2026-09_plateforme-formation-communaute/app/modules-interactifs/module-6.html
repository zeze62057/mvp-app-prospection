<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivier IA — Module 6 interactif : Cybersécurité IA en 5 points</title>
<style>
:root{
  --bg:#113832; --bg2:#163e37; --panel:#1d4a43; --panel2:#2b554e;
  --line:#3d635d; --txt:#ffffff; --muted:#bcd8d2; --dim:#8fb5ad;
  --orange:#e16139; --orange2:#ec987e; --violet:#5fc7b8; --violet2:#8fe0d3;
  --ok:#33c97e; --okbg:rgba(51,201,126,.12); --ko:#e5484d; --kobg:rgba(229,72,77,.12);
  --gold:#ffd166;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(95,199,184,.14),transparent),radial-gradient(900px 500px at -10% 10%,rgba(225,97,57,.10),transparent),var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.6;min-height:100vh}
h1,h2,h3,h4{font-family:"Unbounded","Segoe UI",system-ui,sans-serif;line-height:1.25}
code,pre,.mono{font-family:"Cascadia Code","Fira Code",Consolas,monospace}
a{color:var(--violet2)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* ---------- Header ---------- */
header.top{position:sticky;top:0;z-index:50;background:rgba(17,56,50,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding:12px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:"Unbounded",sans-serif;font-weight:700;letter-spacing:.5px}
.logo-badge{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--orange),var(--violet));display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 4px 18px rgba(255,138,61,.35)}
.logo small{display:block;font-size:10px;color:var(--muted);font-weight:400;letter-spacing:2px;text-transform:uppercase}
.prog-wrap{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:210px;flex:1;max-width:340px}
.prog{flex:1;height:9px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog>div{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--violet));transition:width .5s ease}
.prog-txt{font-size:12px;color:var(--muted);white-space:nowrap}
/* ---------- Nav ---------- */
nav.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 14px;border-radius:99px;cursor:pointer;font-size:13.5px;font-weight:600;transition:.2s;display:flex;align-items:center;gap:7px}
.tab:hover{border-color:var(--violet);color:var(--txt)}
.tab.on{background:linear-gradient(135deg,rgba(225,97,57,.25),rgba(95,199,184,.22));border-color:var(--orange);color:var(--txt)}
.tab .dot{width:16px;height:16px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim)}
.tab.done .dot{background:var(--ok);border-color:var(--ok);color:#062b18}
/* ---------- Layout ---------- */
main{padding:26px 0 60px}
.view{display:none;animation:fadein .35s ease}
.view.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,rgba(225,97,57,.16),rgba(95,199,184,.14)),var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px 30px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(24px,4vw,38px);margin:10px 0 8px}
.hero .kicker{display:inline-block;background:rgba(225,97,57,.18);border:1px solid rgba(225,97,57,.45);color:var(--orange2);padding:4px 14px;border-radius:99px;font-size:12.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.hero p{color:var(--muted);max-width:760px;font-size:16px}
.sec-head{display:flex;align-items:flex-start;gap:18px;margin:6px 0 22px;flex-wrap:wrap}
.sec-num{font-family:"Unbounded";font-size:44px;font-weight:800;background:linear-gradient(135deg,var(--orange),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.sec-head h2{font-size:clamp(22px,3vw,30px)}
.sec-head .sub{color:var(--muted);margin-top:4px;max-width:720px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
/* ---------- Cards / concepts ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.card h3{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.card h3 .ico{width:28px;height:28px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.concept{cursor:pointer;transition:.2s;border-left:3px solid var(--line)}
.concept:hover{border-left-color:var(--orange);transform:translateX(3px)}
.concept .c-t{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.concept .plus{margin-left:auto;width:22px;height:22px;border-radius:6px;background:var(--panel2);color:var(--orange2);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;transition:.25s}
.concept.open .plus{transform:rotate(45deg);background:rgba(225,97,57,.22)}
.concept .c-body{display:none;margin-top:12px;color:var(--muted);font-size:14.5px}
.concept.open .c-body{display:block;animation:fadein .3s}
.concept .c-body strong{color:var(--txt)}
.hintline{font-size:12.5px;color:var(--dim);margin:4px 0 12px;display:flex;gap:7px;align-items:center}
.key-banner{margin:22px 0;border-radius:16px;padding:18px 22px;background:linear-gradient(120deg,rgba(225,97,57,.18),rgba(95,199,184,.16));border:1px solid rgba(225,97,57,.5);display:flex;gap:14px;align-items:flex-start}
.key-banner .kb-ico{font-size:24px;flex:none}
.key-banner .kb-l{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--orange2)}
.key-banner p{font-size:16.5px;font-weight:600;margin-top:2px}
/* ---------- Flip cas réel ---------- */
.flip{perspective:1200px;min-height:250px}
.flip-in{position:relative;width:100%;min-height:250px;transition:transform .6s;transform-style:preserve-3d;cursor:pointer}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:22px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.flip-front{background:linear-gradient(150deg,rgba(95,199,184,.22),var(--panel))}
.flip-back{background:linear-gradient(150deg,rgba(225,97,57,.22),var(--panel));transform:rotateY(180deg)}
.flip-face .tag{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--violet2)}
.flip-back .tag{color:var(--orange2)}
.flip-face h4{font-size:17px}
.flip-face p{color:var(--muted);font-size:14px}
.flip-face .cta{margin-top:auto;font-size:12.5px;color:var(--dim)}
/* ---------- Quiz ---------- */
.quiz-q{margin-bottom:16px}
.quiz-q .qq{font-weight:700;margin-bottom:10px;display:flex;gap:10px}
.quiz-q .qq .qn{flex:none;width:26px;height:26px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--orange2)}
.opt{display:block;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:11px 14px;border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:14.5px;transition:.15s}
.opt:hover{border-color:var(--violet)}
.opt.good{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--kobg);border-color:var(--ko)}
.opt:disabled{cursor:default;opacity:.9}
.q-expl{display:none;background:var(--bg2);border-left:3px solid var(--orange);border-radius:0 10px 10px 0;padding:10px 14px;font-size:13.5px;color:var(--muted);margin-top:6px}
.q-expl.show{display:block;animation:fadein .3s}
.quiz-score{display:none;text-align:center;padding:18px;border-radius:16px;font-size:17px;font-weight:700;margin-top:8px}
.quiz-score.show{display:block}
.quiz-score.win{background:var(--okbg);border:1px solid var(--ok);color:var(--ok)}
.quiz-score.retry{background:var(--kobg);border:1px solid var(--ko);color:var(--ko)}
.btn{background:linear-gradient(135deg,var(--orange),#c24d28);color:#fff;border:none;padding:11px 22px;border-radius:12px;font-size:14.5px;font-weight:700;cursor:pointer;transition:.2s;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,138,61,.35)}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
.btn.violet{background:linear-gradient(135deg,var(--violet),#3ba898)}
/* ---------- Prompts ---------- */
.prompt{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.prompt .p-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.prompt .p-title{font-weight:700;font-size:15px}
.prompt .p-use{font-size:12.5px;color:var(--dim)}
.prompt pre{background:#0a2620;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:12.8px;white-space:pre-wrap;color:#d9d5f5;max-height:230px;overflow:auto}
.copy-btn{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:6px 13px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;transition:.15s}
.copy-btn:hover{border-color:var(--orange);color:var(--orange2)}
.p-expected{margin-top:10px;font-size:13px;color:var(--muted);background:rgba(95,199,184,.12);border:1px solid rgba(95,199,184,.4);border-radius:10px;padding:9px 12px}
.p-expected b{color:var(--violet2)}
.safe-note{display:flex;gap:10px;background:var(--kobg);border:1px solid rgba(229,72,77,.4);border-radius:12px;padding:12px 15px;font-size:13.5px;color:#f0b9bb;margin-bottom:14px}
/* ---------- Exercices ---------- */
.step{display:flex;gap:14px;padding:13px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border:none}
.step .sn{flex:none;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--violet));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.step .sig{display:inline-block;margin-top:6px;font-size:12.5px;background:var(--okbg);border:1px solid rgba(51,201,126,.4);color:var(--ok);padding:4px 11px;border-radius:99px}
/* ---------- Activities ---------- */
.act{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:24px;margin:22px 0}
.act-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.act-h .a-ico{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,rgba(225,97,57,.32),rgba(95,199,184,.3));display:flex;align-items:center;justify-content:center;font-size:19px}
.act-h h3{font-size:18px}
.act-sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.feedback{display:none;margin-top:14px;padding:13px 16px;border-radius:12px;font-size:14px;animation:fadein .3s}
.feedback.show{display:block}
.feedback.ok{display:block;background:var(--okbg);border:1px solid var(--ok);color:#bff0d6}
.feedback.ko{display:block;background:var(--kobg);border:1px solid var(--ko);color:#f3c2c4}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:8px 15px;cursor:pointer;font-size:13.5px;transition:.15s;color:var(--txt)}
.chip:hover{border-color:var(--violet)}
.chip.sel{background:rgba(225,97,57,.2);border-color:var(--orange);color:var(--orange2)}
.chip.okc{background:var(--okbg);border-color:var(--ok)}
.chip.koc{background:var(--kobg);border-color:var(--ko)}
/* terminal */
.term{background:#0a2620;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:8px}
.term-bar{display:flex;gap:7px;align-items:center;padding:9px 13px;background:#14352f;border-bottom:1px solid var(--line)}
.term-bar i{width:11px;height:11px;border-radius:50%;display:inline-block}
.term-bar span{margin-left:8px;font-size:12px;color:var(--dim)}
.term-out{padding:14px;height:280px;overflow-y:auto;font-size:13.3px;line-height:1.65}
.term-out .cmd{color:var(--orange2)}
.term-out .okl{color:var(--ok)}
.term-out .err{color:var(--ko)}
.term-out .info{color:var(--violet2)}
.term-out .warn{color:var(--gold)}
.term-line{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:#0d2c26}
.term-line .ps{color:var(--ok);font-size:13.3px;flex:none}
.term-line input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:13.3px;font-family:inherit}
.term-side{font-size:13px;color:var(--muted)}
.term-side ul{margin:8px 0 14px 18px}
.term-side li{margin-bottom:4px}
/* sortable */
.sortable{display:flex;flex-direction:column;gap:9px;margin:10px 0}
.sort-item{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:11px;font-size:14px;cursor:grab;user-select:none}
.sort-item .ord{flex:none;width:26px;height:26px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--muted)}
.sort-item .mv{margin-left:auto;color:var(--dim);cursor:pointer;font-size:15px;padding:2px 8px}
.sort-item .mv:hover{color:var(--orange2)}
/* dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:22px}
.dash-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.dash-card:hover{transform:translateY(-4px);border-color:var(--violet);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.dash-card .dc-num{font-family:"Unbounded";font-size:13px;font-weight:800;color:var(--orange2);letter-spacing:1px}
.dash-card h3{font-size:18px;margin:6px 0 8px}
.dash-card p{font-size:13.5px;color:var(--muted)}
.dash-card .dc-foot{margin-top:14px;display:flex;align-items:center;gap:10px}
.dc-prog{flex:1;height:7px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.dc-prog>div{height:100%;background:linear-gradient(90deg,var(--orange),var(--violet));width:0%;transition:width .5s}
.dc-state{font-size:12px;font-weight:700;color:var(--dim)}
.dc-state.ok{color:var(--ok)}
.dash-hero-stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 18px;flex:1;min-width:150px}
.stat b{font-family:"Unbounded";font-size:22px;display:block;color:var(--orange2)}
.stat span{font-size:12px;color:var(--muted)}
.rulette{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:16px}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;font-size:13.5px;color:var(--muted)}
.rule b{color:var(--txt);display:block;margin-bottom:5px;font-size:14.5px}
.match-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
.match-row .m-lab{font-weight:700;font-size:14.5px;min-width:190px}
.match-row select{background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px;font-family:inherit;min-width:230px}
.final-hero{text-align:center;padding:40px 20px;border-radius:22px;background:linear-gradient(135deg,rgba(225,97,57,.2),rgba(95,199,184,.18)),var(--panel);border:1px solid var(--line)}
.big-emoji{font-size:56px}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--dim);font-size:13px;text-align:center}
.confetti{position:fixed;top:-10px;font-size:22px;animation:fall linear forwards;z-index:99;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
.tool-flex{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.mini{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13px;color:var(--muted);transition:.15s}
.mini:hover{border-color:var(--orange);color:var(--orange2)}
.vs-panel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
@media(max-width:700px){.vs-panel{grid-template-columns:1fr}}
.vs-col{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:110px}
.vs-col h5{font-size:13px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.vs-col.a h5{color:var(--orange2)}.vs-col.b h5{color:var(--violet2)}
.vs-item{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px;margin-bottom:7px;cursor:pointer;transition:.15s}
.vs-item:hover{border-color:var(--gold);color:var(--gold)}
.vs-item.placed{opacity:.45;cursor:default}

/* ---- Panneaux Expert ---- */
.exp-panel{margin:22px 0;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:24px}
.exp-panel .ep-k{display:inline-block;background:rgba(225,97,57,.18);border:1px solid rgba(225,97,57,.45);color:var(--orange2);padding:4px 14px;border-radius:99px;font-size:11.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px}
.ana-box{background:var(--bg2);border-left:3px solid var(--teal);border-radius:0 12px 12px 0;padding:13px 16px;font-size:15px;margin-bottom:12px}
.ana-box .lab{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal2);display:block;margin-bottom:4px}
.exp-box{background:linear-gradient(120deg,rgba(225,97,57,.14),rgba(95,199,184,.10));border:1px solid rgba(225,97,57,.4);border-radius:14px;padding:15px 18px;font-size:15px;margin-bottom:14px}
.exp-box .lab{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--orange2);display:block;margin-bottom:5px}
.exp-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:800px){.exp-grid2{grid-template-columns:1fr}}
.exp-col{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
.exp-col h4{font-size:14px;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.exp-col ul{list-style:none}
.exp-col li{font-size:13.5px;color:var(--muted);padding:5px 0 5px 24px;position:relative;border-bottom:1px dashed var(--line)}
.exp-col li:last-child{border:none}
.exp-col li::before{position:absolute;left:0;top:5px}
.exp-col.err li::before{content:"✗";color:var(--ko)}
.exp-col.chk li::before{content:"✓";color:var(--ok)}
.act-box{background:linear-gradient(120deg,rgba(95,199,184,.14),transparent);border:1px solid rgba(95,199,184,.4);border-radius:14px;padding:14px 17px;font-size:14.5px;margin-bottom:14px}
.act-box .lab{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal2);display:block;margin-bottom:5px}
.gloss{background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.gloss h4{font-size:14px;padding:12px 17px 8px}
.gloss .g-row{display:flex;gap:14px;padding:9px 17px;border-top:1px solid var(--line);font-size:13.5px;align-items:baseline}
.gloss .g-row b{color:var(--orange2);min-width:150px;flex:none}
.gloss .g-row span{color:var(--muted)}


/* ---- Améliorations V2 ---- */
.note-area{width:100%;min-height:110px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:13px 15px;font-size:14.5px;font-family:inherit;resize:vertical;outline:none;box-sizing:border-box}
.note-area:focus{border-color:var(--teal)}
@media print{body>*{display:none!important}#cert{display:flex!important}#certinner{-webkit-print-color-adjust:exact;print-color-adjust:exact}#certbar{display:none!important}}

</style>
</head>
<body>
<header class="top"><div class="wrap top-in">
  <div class="logo"><div class="logo-badge">🌱</div><div>Vivier IA<small>Module 6 · Cybersécurité</small></div></div>
  <div class="prog-wrap"><div class="prog"><div id="progBar"></div></div><span class="prog-txt" id="progTxt">0 / 7 sections</span></div>
</div></header>

const DATA=[{"num":"01","title":"Comptes, rôles et élévation de privilèges","concepts":[{"t":"Ouverture","d":"Bonjour, je suis Zézé, fondateur de Vivier IA. Imaginez un élève qui, en une seule commande, se déclare administrateur de votre application. Cela arrive quand le rôle est rangé au mauvais endroit. Dans ce chapitre, vous verrez ce qu'est un rôle, comment fonctionne l'élévation de privilèges, et où ranger l'information « administrateur"},{"t":"Compte, rôle, privilège","d":"Compte : qui. Rôle : ce qu'il peut faire. Privilège : un droit précis. Trois mots à ne pas confondre. Le compte est l'identité d'une personne dans votre application. Elle se connecte, elle est reconnue par le système. À ce stade, on sait qui elle est, mais pas encore ce qu'elle peut faire. Le rôle dit ce que le compte a le droit de faire : visiteur, élève, administrateur. C'est le rôle qui décide de ce que la personne voit et "},{"t":"L'élévation de privilèges","d":"Refusez par défaut. Chaque accès doit être autorisé, pas seulement non interdit. Un compte ordinaire obtient les droits d'un compte plus puissant. Une élévation de privilèges, c'est par exemple un élève qui devient administrateur sans que personne ne lui ait donné ce droit. L'élève n'a rien piraté de compliqué : une règle mal écrite lui a ouvert la porte. L'OWASP, dans sa page A01:2021, place le contrôle d'accès défaillant en "},{"t":"Où Supabase range les rôles","d":"Le rôle d'administrateur se range dans app_metadata, jamais dans user_metadata. Trois rôles de connexion, et deux endroits pour les métadonnées. Chaque requête arrive avec l'un de trois rôles : anon pour une requête non connectée, authenticated pour un utilisateur connecté, service_role pour le serveur, avec les droits d'administration. Ce dernier reste côté serveur seulement. L'utilisateur peut modifier user_metadata lui-même"},{"t":"Les pièges de la documentation","d":"Un fichier de règles sans alerte n'est pas prouvé sûr : il faut tester avec de vrais comptes. Deux pièges de plus, tirés de la documentation de Supabase. Si vous retirez un droit dans app_metadata, l'utilisateur garde l'ancien droit tant que son jeton n'est pas renouvelé. Quand personne n'est connecté, auth.uid() renvoie une valeur vide. Une règle qui compare cette valeur échoue sans bruit : vérifiez-le explicitement. Le contr"},{"t":"Trois erreurs à chercher chez vous","d":"Vérifiez ces trois points avant d'ouvrir l'application à de vrais utilisateurs. À rechercher dans vos propres règles d'accès. Cherchez le mot user_metadata dans toutes vos règles, votre code et vos fonctions : aucune décision d'accès ne doit en dépendre. Une règle sans rôle indiqué, ou en écriture avec « toujours vrai Une table sans RLS est ouverte à qui a la clé publique. Vérifiez que toutes vos tables de données l'ont activé"},{"t":"Pas de cas réel : l'exemple d'école","d":"Pourquoi pas de cas réel : Aucun audit de votre plateforme n'a servi à écrire ce chapitre. Le premier exercice est justement cet audit. L'exemple de la documentation : Un élève exécute une mise à jour de son propre compte avec is_admin à vrai, et il passe administrateur. Pourquoi ça marche : La règle d'accès lisait user_metadata, que l'utilisateur modifie lui-même. L'outil de contrôle de Supabase classe cette règle en ERREUR. "}],"icon":"👤","sub":"Compte, rôle, privilège : trois mots qui décident de tout, et pourquoi app_metadata est le seul endroit sûr.","key":"Compte : qui. Rôle : ce qu'il peut faire. Privilège : un droit précis.","cas":{"t":"La clé de service dans le navigateur","ctx":"Cas réel — plateforme Vivier IA, octobre 2026.","d1":"Une clé de service placée dans le code du navigateur donne à tout visiteur les droits d'administration : lire, modifier, supprimer n'importe quelle ligne.","d2":"La clé de service vit uniquement côté serveur. Elle ne traverse jamais le navigateur.","lecon":"La clé de service ne va jamais dans le navigateur. Compte : qui. Rôle : ce qu'il peut faire. Privilège : un droit précis."},"prompts":[{"t":"Ma fiche des rôles","use":"Dresser la liste des rôles de mon application et l'endroit où chacun est enregistré. Aide pour l'étape 1 de l'exercice.","txt":"Je suis débutant complet en sécurité. Mon application s'appelle [NOM DE MON APPLICATION] et elle sert à [CE QUE FAIT MON APPLICATION]. Aidez-moi à remplir une fiche des rôles. Expliquez d'abord la différence entre un compte, un rôle et un privilège. Posez-moi ensuite des questions simples, une à la fois, pour trouver mes rôles (par exemple visiteur, élève, administrateur). Pour chaque rôle, je veux une phrase sur ce qu'il peut faire, l'endroit où il est enregistré, qui peut le changer et comment on retire un droit. Terminez par un tableau. Expliquez chaque terme technique en une phrase simple. Rappel : utilisez uniquement des exemples fictifs, jamais de vraie clé, de mot de passe, de jeton ni de donnée d'élève.","att":"Un tableau où chaque rôle a une phrase, un lieu d'enregistrement, une personne qui peut le changer. *Source : Module-6-2.1-2026-09-29.md, l.12-18, l.39-47, l.51-58, l.93.*"},{"t":"Comprendre user_metadata","use":"Savoir pourquoi un rôle ne se lit jamais dans user_metadata et où le ranger à la place. Aide pour l'étape 3 de l'exercice.","txt":"Je suis débutant. Expliquez-moi, avec une histoire simple, pourquoi une règle d'accès ne doit jamais s'appuyer sur user_metadata pour savoir si quelqu'un est administrateur, alors que app_metadata convient. Montrez ce qui se passe quand un élève modifie son propre compte pour écrire is_admin avec la valeur vrai. Puis relisez cet extrait de règle FICTIF ou non sensible et dites-moi s'il est fragile : [COLLER ICI UN EXTRAIT DE RÈGLE SANS SECRET]. Donnez enfin la liste des endroits où chercher ce mot (règles, code, fonctions). Expliquez chaque terme technique en une phrase simple. Rappel : utilisez uniquement des exemples fictifs, jamais de vraie clé, de mot de passe, de jeton ni de donnée d'élève.","att":"Une explication claire du risque et un verdict sur mon extrait : aucune décision d'accès ne dépend de user_metadata. *Source : Module-6-2.1-2026-09-29.md, l.51-72, l.81, l.95.*"},{"t":"Vérifier le RLS de mes tables","use":"Comprendre le contrôle par ligne et préparer ma vérification table par table. Aide pour l'étape 4 de l'exercice.","txt":"Je suis débutant. Expliquez ce qu'est le RLS (contrôle d'accès ligne par ligne) et pourquoi une table créée en SQL peut rester ouverte à quiconque possède la clé publique. Voici la liste FICTIVE de mes tables : [NOMS DE MES TABLES]. Préparez-moi une liste de contrôle à remplir : pour chaque table, la question à me poser, la réponse attendue, et ce que je note si le RLS n'est pas activé. Rappelez-moi de faire la vérification sur un projet de test, jamais en production. Expliquez chaque terme technique en une phrase simple. Rappel : utilisez uniquement des exemples fictifs, jamais de vraie clé, de mot de passe, de jeton ni de donnée d'élève.","att":"Une liste de contrôle par table : aucune table sans RLS, sauf si je sais pourquoi. *Source : Module-6-2.1-2026-09-29.md, l.49, l.79-83, l.96.* ## Questions de vérification **1. Quelle différence entre un compte, un rôle et un privilège ?** *Corrigé :* Le compte est l'identité, le rôle l'ensemble des droits, le privilège un droit précis. **2. Pourquoi ne faut-il jamais décider d'un accès avec user_metadata ?** *Corrigé :* L'utilisateur peut le modifier lui-même, sans limite. **3. Où ranger l'information « cette personne est administrateur » ?** *Corrigé :* Dans app_metadata, que l'utilisateur ne peut pas modifier. **4. Quelle clé ne doit jamais aller dans le navigateur ?** *Corrigé :* La clé de service (rôle service_role). **5. Vous retirez un droit dans app_metadata. Pourquoi l'utilisateur l'a-t-il encore un moment ?** *Corrigé :* Son jeton n'est pas encore renouvelé. ## Projet Remplir la fiche des rôles pour votre projet principal : les rôles, où chacun est enregistré, qui peut le changer, comment un droit se retire."}],"exercice":[{"e":"Faites la liste des rôles de votre application sur une feuille : qui existe, ce que chacun peut faire.","s":"chaque rôle a une phrase, et vous savez où il est enregistré."},{"e":"Exportez vos règles d'accès dans un fichier SQL et lancez le script d'audit.","s":"vous avez la liste des lignes ERREUR et ATTENTION, ou l'absence de lignes."},{"e":"Cherchez le mot user_metadata dans vos règles, votre code et vos fonctions.","s":"aucune décision d'accès n'en dépend."},{"e":"Vérifiez que vos tables de données ont le RLS activé.","s":"aucune table sans RLS, sauf si vous savez pourquoi."}],"quiz":[{"q":"Quelle différence entre un compte, un rôle et un privilège ?","x":"Le compte est l'identité, le rôle l'ensemble des droits, le privilège un droit précis.","o":["Le compte est l'identité, le rôle l'ensemble des droits, le privilège un droit précis","Le compte et le rôle sont identiques, le privilège est un mot de passe","Le compte est un droit, le rôle une identité, le privilège un ensemble","Ce sont trois noms pour la même chose"],"c":0},{"q":"Pourquoi ne faut-il jamais décider d'un accès avec user_metadata ?","x":"L'utilisateur peut le modifier lui-même, sans limite.","o":["L'utilisateur peut modifier user_metadata lui-même, sans limite","user_metadata est chiffré","user_metadata n'existe pas","Le serveur refuse toujours user_metadata"],"c":0},{"q":"Où ranger l'information « cette personne est administrateur » ?","x":"Dans app_metadata, que l'utilisateur ne peut pas modifier.","o":["Dans app_metadata, que l'utilisateur ne peut pas modifier","Dans user_metadata, pour être visible","Dans le navigateur, pour être rapide","Dans le localStorage du poste"],"c":0},{"q":"Quelle clé ne doit jamais aller dans le navigateur ?","x":"La clé de service (rôle service_role).","o":["La clé de service (rôle service_role)","La clé anon (publique)","L'URL du projet","Le nom de la base"],"c":0},{"q":"Vous retirez un droit dans app_metadata. Pourquoi l'utilisateur l'a-t-il encore un moment ?","x":"Son jeton n'est pas encore renouvelé.","o":["Son jeton n'est pas encore renouvelé","Le rôle est supprimé","La base est en cache navigateur","Le droit est devenu permanent"],"c":0}],"act":{"type":"steps","icon":"👤","title":"Le contrôle des accès","sub":"5 situations de comptes et rôles. Compte, rôle, privilège : le vocabulaire qui décide de la sécurité.","steps":[{"q":"Quelle différence entre un compte, un rôle et un privilège ?","o":["Le compte est l'identité, le rôle l'ensemble des droits, le privilège un droit précis","Le compte et le rôle sont identiques, le privilège est un mot de passe","Le compte est un droit, le rôle une identité, le privilège un ensemble","Ce sont trois noms pour la même chose"],"c":0,"x":"Le compte est l'identité, le rôle l'ensemble des droits, le privilège un droit précis."},{"q":"Pourquoi ne faut-il jamais décider d'un accès avec user_metadata ?","o":["L'utilisateur peut modifier user_metadata lui-même, sans limite","user_metadata est chiffré","user_metadata n'existe pas","Le serveur refuse toujours user_metadata"],"c":0,"x":"L'utilisateur peut le modifier lui-même, sans limite."},{"q":"Où ranger l'information « cette personne est administrateur » ?","o":["Dans app_metadata, que l'utilisateur ne peut pas modifier","Dans user_metadata, pour être visible","Dans le navigateur, pour être rapide","Dans le localStorage du poste"],"c":0,"x":"Dans app_metadata, que l'utilisateur ne peut pas modifier."},{"q":"Quelle clé ne doit jamais aller dans le navigateur ?","o":["La clé de service (rôle service_role)","La clé anon (publique)","L'URL du projet","Le nom de la base"],"c":0,"x":"La clé de service (rôle service_role)."},{"q":"Vous retirez un droit dans app_metadata. Pourquoi l'utilisateur l'a-t-il encore un moment ?","o":["Son jeton n'est pas encore renouvelé","Le rôle est supprimé","La base est en cache navigateur","Le droit est devenu permanent"],"c":0,"x":"Son jeton n'est pas encore renouvelé."}]},"ana":"Compte, rôle, privilège : l ur chaque table, essayez au minimum ces cinq rôles. Le visiteur, rôle anon, n'est pas connecté. Il ne doit rien lire de cette table, ni rien y écrire. L'élève A lit et modifie ce qui est à lui, rien de ce qui est à l'élève B. On utilise B pour comparer. Le faux administrateur est un élève qui a écrit is_admin dans user_metadata : il ne "},{"t":"Deux façons de rater un test","d":"Modification interdite : on attend zéro ligne touchée, pas une erreur. Deux erreurs de test laissent passer une faille. Quand une règle interdit d'ajouter une ligne, la base répond par une erreur. Quand elle interdit de modifier ou de lire, la ligne devient invisible : la modification touche zéro ligne, sans erreur. Un test qui attend une erreur laisse donc passer une modification interdite. La bonne méthode est de compter les"},{"t":"Écrire un test dans Supabase","d":"La commande supabase test db lance les fichiers de test d'un projet local. pgTAP est une extension de test qui vit dans la base. Un fichier de test commence par begin et plan, contient les tests, puis finish et rollback. Le rollback final annule tout ce que le test a écrit. results_eq compare des résultats, lives_ok vérifie qu'une commande passe, throws_ok qu'elle échoue avec un code précis, is_empty qu'une requête ne renvoie "},{"t":"Le test qui vérifie le RLS partout","d":"Un test qui réussit prouve une chose précise, pas que tout est sûr. Un seul test attrape la deuxième erreur classique du chapitre 2.1. Ce test demande la liste des tables du schéma public dont le RLS n'est pas activé, et vérifie qu'elle est vide. Il échoue dès qu'une table est créée en SQL sans RLS. L'erreur est attrapée automatiquement, à chaque lancement. La documentation présente un paquet d'aide écrit par basejump, pas par"},{"t":"Pas de cas réel : le résultat de la démo","d":"Pourquoi pas de cas réel : Aucun audit de votre plateforme n'a servi à écrire ce chapitre. Le premier exercice est de la tester. Règles fragiles : Sur 14 tests, 6 échouent : lecture de toutes les notes, ajout au nom d'un autre, faux administrateur qui modifie 2 cours. Règles corrigées : Les 14 tests sur 14 réussissent. Résultat obtenu sur Postgres local avec des données factices, pas sur Supabase. Votre cas : [À COMPLÉTER] : s"}],"icon":"🛡️","sub":"Row Level Security : une règle se prouve avec de vrais rôles, et se teste jamais en production.","key":"Une règle est correcte quand un test avec chaque rôle le prouve.","cas":{"t":"La règle qui avait l'air juste","ctx":"Cas réel — table des notes de la plateforme Vivier IA.","d1":"Une règle RLS écrite avec soin semblait correcte à la lecture. Seul un test avec de vrais rôles a montré qu'un élève voyait la note d'un autre.","d2":"Le test a révélé la faille ; la relecture du texte ne l'avait pas vue.","lecon":"Une règle est correcte quand un test avec chaque rôle le prouve. Jamais sur la production."},"prompts":[{"t":"Ma matrice de tests","use":"Préparer une matrice rôle, action, résultat attendu pour une table. Aide pour l'étape 1 de l'exercice.","txt":"Je suis débutant. Expliquez pourquoi une règle d'accès qui a l'air juste peut être fausse et pourquoi seul un test avec de vrais rôles le prouve. Ma table FICTIVE s'appelle [NOM DE MA TABLE] et contient [CE QU'ELLE CONTIENT]. Construisez une matrice de tests sous forme de tableau : rôle, action, résultat attendu. Utilisez le visiteur, l'élève A, l'élève B, le faux administrateur, le vrai administrateur et le serveur. Prévoyez au moins huit lignes, dont une écriture interdite pour chaque rôle. Expliquez chaque terme technique en une phrase simple. Rappel : utilisez uniquement des exemples fictifs, jamais de vraie clé, de mot de passe, de jeton ni de donnée d'élève.","att":"Un tableau d'au moins huit lignes, avec une écriture interdite pour chaque rôle. *Source : Module-6-2.2-2026-09-29.md, l.12-18, l.20-28, l.101.*"},{"t":"Mes tests sur le modèle de la démo","use":"Transformer chaque ligne de ma matrice en un test, sur le modèle du chapitre. Aide pour l'étape 2 de l'exercice.","txt":"Je suis débutant. Voici ma matrice de tests FICTIVE : [COLLER ICI MA MATRICE]. Expliquez la forme d'un fichier de test pgTAP (begin, plan, finish, rollback) et à quoi sert chaque mot. Rappelez que refuser une modification ne fait pas d'erreur : elle touche zéro ligne, donc il faut compter les lignes touchées. Écrivez ensuite un test par ligne de la matrice, avec une phrase claire qui dit quel rôle essaie quelle action. Précisez que je lance ces tests sur une base locale ou de test, jamais sur la production. Expliquez chaque terme technique en une phrase simple. Rappel : utilisez uniquement des exemples fictifs, jamais de vraie clé, de mot de passe, de jeton ni de donnée d'élève.","att":"Un fichier de test avec un test par ligne de la matrice, chacun nommé par rôle et action. *Source : Module-6-2.2-2026-09-29.md, l.30-34, l.40-52, l.70-80, l.102.*"},{"t":"Comprendre mes échecs de tests","use":"Lire la liste des tests échoués et corriger la règle, pas le test. Aide pour l'étape 4 de l'exercice.","txt":"Je suis débutant. J'ai lancé mes tests sur ma base locale de test. Voici les résultats FICTIFS ou non sensibles : [COLLER ICI LA LISTE DES TESTS RÉUSSIS ET ÉCHOUÉS]. Pour chaque échec, expliquez en langage simple ce qui s'est passé, proposez une correction de la règle (et non du test), puis dites comment relancer. Rappelez-moi la différence entre une erreur et une ligne invisible. Terminez par une phrase par correction que je pourrai expliquer à voix haute. Expliquez chaque terme technique en une phrase simple. Rappel : utilisez uniquement des exemples fictifs, jamais de vraie clé, de mot de passe, de jeton ni de donnée d'élève.","att":"Une explication par échec, une correction de règle, et une phrase par correction que je sais redire. *Source : Module-6-2.2-2026-09-29.md, l.32, l.103-104, l.118.* ## Questions de vérification **1. Pourquoi une règle qui a l'air juste peut-elle être fausse ?** *Corrigé :* Le script ou l'œil lisent du texte. Seul un test avec de vrais rôles montre ce que la règle fait. **2. Quels rôles faut-il essayer pour chaque table ?** *Corrigé :* Visiteur, élève A (et B pour comparer), faux administrateur, vrai administrateur, serveur. **3. Un élève tente de modifier la note d'un autre. Pourquoi ne pas attendre une erreur ?** *Corrigé :* Une modification interdite touche zéro ligne sans erreur : on compte les lignes touchées. **4. Que fait le rollback à la fin d'un fichier de test ?** *Corrigé :* Il annule tout ce que le test a écrit. **5. Où lancer ces tests, et où jamais ?** *Corrigé :* Sur une base locale ou de test. Jamais sur la production. ## Projet La matrice des tests de votre projet principal, avec les résultats observés."}],"exercice":[{"e":"Remplissez la matrice des tests pour une table : rôle, action, résultat attendu.","s":"au moins huit lignes, dont une écriture interdite pour chaque rôle."},{"e":"Écrivez les tests dans un fichier, sur le modèle de la démo.","s":"un test par ligne de la matrice."},{"e":"Lancez-les sur une base locale ou de test.","s":"vous avez la liste des tests réussis et échoués."},{"e":"Pour chaque échec, corrigez la règle (pas le test), puis relancez.","s":"tous les tests réussissent, et vous expliquez chaque correction."}],"quiz":[{"q":"Pourquoi une règle qui a l'air juste peut-elle être fausse ?","x":"Le script ou l'œil lisent du texte. Seul un test avec de vrais rôles montre ce que la règle fait.","o":["Le script ou l'œil lisent du texte ; seul un test avec de vrais rôles montre ce que la règle fait","Les règles RLS ne peuvent pas être fausses","Un test coûte trop cher","Le texte suffit toujours"],"c":0},{"q":"Quels rôles faut-il essayer pour chaque table ?","x":"Visiteur, élève A (et B pour comparer), faux administrateur, vrai administrateur, serveur.","o":["Visiteur, élève A (et B pour comparer), faux administrateur, vrai administrateur, serveur","Uniquement le rôle admin","Uniquement le rôle visiteur","Le rôle service_role seulement"],"c":0},{"q":"Un élève tente de modifier la note d'un autre. Pourquoi ne pas attendre une erreur ?","x":"Une modification interdite touche zéro ligne sans erreur : on compte les lignes touchées.","o":["Une modification interdite touche zéro ligne sans erreur : on compte les lignes touchées","Une erreur est attendue à chaque fois","Les lignes sont toujours modifiées","Le test échoue toujours"],"c":0},{"q":"Que fait le rollback à la fin d'un fichier de test ?","x":"Il annule tout ce que le test a écrit.","o":["Il annule tout ce que le test a écrit","Il supprime la table","Il crée les rôles","Il valide la production"],"c":0},{"q":"Où lancer ces tests, et où jamais ?","x":"Sur une base locale ou de test. Jamais sur la production.","o":["Sur une base locale ou de test ; jamais sur la production","Sur la production, pour être réaliste","Uniquement sur la base distante","N'importe où"],"c":0}],"act":{"type":"steps","icon":"🛡️","title":"Le banc d'essai RLS","sub":"5 règles à éprouver. Un texte qui a l'air juste ne suffit pas : seul un test avec de vrais rôles prouve ce que la règle fait.","steps":[{"q":"Pourquoi une règle qui a l'air juste peut-elle être fausse ?","o":["Le script ou l'œil lisent du texte ; seul un test avec de vrais rôles montre ce que la règle fait","Les règles RLS ne peuvent pas être fausses","Un test coûte trop cher","Le texte suffit toujours"],"c":0,"x":"Le script ou l'œil lisent du texte. Seul un test avec de vrais rôles montre ce que la règle fait."},{"q":"Quels rôles faut-il essayer pour chaque table ?","o":["Visiteur, élève A (et B pour comparer), faux administrateur, vrai administrateur, serveur","Uniquement le rôle admin","Uniquement le rôle visiteur","Le rôle service_role seulement"],"c":0,"x":"Visiteur, élève A (et B pour comparer), faux administrateur, vrai administrateur, serveur."},{"q":"Un élève tente de modifier la note d'un autre. Pourquoi ne pas attendre une erreur ?","o":["Une modification interdite touche zéro ligne sans erreur : on co n Supabase le dit ainsi : le RLS contrôle les lignes, pas les colonnes. Une table profils contient le prénom, l'e-mail, le téléphone et le statut. Une règle laisse tous les élèves connectés la lire, parce que le prénom est public. Chacun lit aussi l'e-mail et le téléphone des autres. Une règle laisse l'élève modifier sa ligne. Il pe"},{"t":"Séparer les tables : la solution préférée","d":"Préférez deux tables avec leurs règles à une seule table avec des exceptions. Le public dans une table, le privé dans une autre. Rangez ce qui est public dans une table, ce qui est privé dans une autre, et donnez à chacune ses règles. La table profils garde l'identifiant, le prénom et le statut. La table contacts_prives garde l'e-mail et le téléphone, et chacun n'y voit que sa ligne. La documentation conseille le RLS avec une "},{"t":"Les droits par colonne, pour les cas avancés","d":"Pour la plupart des projets, séparez les tables avant de penser aux droits par colonne. Un droit peut s'appliquer à une colonne précise. Dans la démo, on retire d'abord le droit de modifier toute la table, puis on donne seulement le droit de modifier la colonne prénom. Un droit de table et un droit de colonne s'additionnent. S'il reste le droit de table, la colonne reste modifiable : d'où le retrait sur la table d'abord. La do"},{"t":"Les vues : le piège du créateur","d":"Une vue sans security_invoker contourne le RLS de la table dessous. Une vue montre seulement certaines colonnes, mais elle peut ouvrir une porte. Par défaut, une vue contrôle les droits avec son créateur, pas avec la personne qui la lit. Elle ignore donc le RLS de la table dessous. Avec security_invoker, la vue applique les droits et le RLS de la personne qui la lit. Supabase classe l'oubli en ERREUR, règle 0010. La table auth"},{"t":"Les droits : la couche qu'on oublie","d":"Un fichier sans alerte n'est pas prouvé sûr : le script d'audit ne voit ni colonnes ni vues. Deux couches travaillent ensemble : les droits et le RLS. Les droits disent quel rôle (anon, authenticated, service_role) peut toucher quel objet. Le RLS dit quelles lignes ce rôle voit ou modifie. Sur les projets existants, une table créée dans public reçoit automatiquement les droits. Elle est donc joignable dès sa création. À vérifi"},{"t":"Pas de cas réel : le résultat de la démo","d":"Pourquoi pas de cas réel : Aucun audit de votre plateforme n'a servi à écrire ce chapitre. Le premier exercice est l'inventaire de vos données. Données fragiles : Sur 10 tests, 5 échouent : vue sans security_invoker, annuaire lu par un visiteur, contact d'un autre lu, statut modifiable. Données corrigées : Les 10 tests sur 10 réussissent. Le script d'audit du chapitre 2.1 ne signalait rien sur le fichier fragile. Votre cas : ["}],"icon":"📦","sub":"Donner le minimum : lignes ET colonnes, tables séparées, et la vue qui contourne le RLS.","key":"Donner le minimum de lignes ne suffit pas : donnez aussi le minimum de colonnes.","cas":{"t":"La vue qui doublait les droits","ctx":"Cas réel — vue sans security_invoker.","d1":"Une vue créée pour simplifier la lecture contrôlait les droits avec son créateur : les élèves voyaient plus que prévu.","d2":"L'option security_invoker applique les droits de la personne qui lit, pas du créateur.","lecon":"Une vue sans security_invoker contourne le RLS de la table dessous."},"prompts":[{"t":"Inventaire des colonnes d'une table","use":"Lister chaque colonne, son niveau de sensibilité, qui la voit et qui la modifie. Aide pour l'étape 1 de l'exercice.","txt":"Je suis débutant. Expliquez pourquoi le RLS décide quelles lignes on voit mais pas quelles colonnes. Ma table FICTIVE s'appelle [NOM DE MA TABLE] et ses colonnes sont : [LISTE DES COLONNES]. Faites-moi un tableau d'inventaire avec une ligne par colonne : sensible ou non, qui la voit, qui la modifie. N'utilisez aucune vraie donnée d'élève, seulement des exemples inventés. Signalez ce que vous ne pouvez pas deviner et posez-moi la question. Expliquez chaque terme technique en une phrase simple. Rappel : utilisez uniquement des exemples fictifs, jamais de vraie clé, de mot de passe, de jeton ni de donnée d'élève.","att":"Un tableau avec une ligne par colonne, sans vraie donnée d'élève. *Source : Module-6-2.3-2026-09-29.md, l.14-20, l.106.*"},{"t":"Colonnes qui donnent un droit","use":"Repérer les colonnes à ne pas modifier et celles à ne pas lire chez les autres. Aide pour l'étape 2 de l'exercice.","txt":"Je suis débutant. Voici mon inventaire FICTIF : [COLLER ICI L'INVENTAIRE]. Repérez les colonnes qui donnent un droit (statut, rôle, abonnement, prix) et celles qui sont privées (contact). Expliquez pourquoi une règle qui laisse l'élève modifier sa ligne lui laisse aussi modifier ces colonnes. Présentez les trois solutions du chapitre dans l'ordre de préférence : tables séparées, droits par colonne, vues. Donnez la liste des colonnes que l'élève ne doit ni modifier ni lire chez les autres. Expliquez chaque terme technique en une phrase simple. Rappel : utilisez uniquement des exemples fictifs, jamais de vraie clé, de mot de passe, de jeton ni de donnée d'élève.","att":"La liste des colonnes à protéger, avec la solution préférée : ranger le privé dans une table séparée. *Source : Module-6-2.3-2026-09-29.md, l.16-20, l.22-43, l.107.*"},{"t":"Mes vues et security_invoker","use":"Comprendre pourquoi une vue peut contourner mes règles et noter une réponse par vue. Aide pour l'étape 3 de l'exercice.","txt":"Je suis débutant. Expliquez ce qu'est une vue et pourquoi, par défaut, elle contrôle les droits avec son créateur et ignore donc le RLS de la table dessous. Expliquez ce que change l'option security_invoker. Voici la liste FICTIVE de mes vues : [NOMS DE MES VUES]. Préparez un tableau avec une ligne par vue : la question à vérifier, la réponse à écrire, et la correction si l'option manque. Précisez que je teste sur une base locale, jamais sur la production. Expliquez chaque terme technique en une phrase simple. Rappel : utilisez uniquement des exemples fictifs, jamais de vraie clé, de mot de passe, de jeton ni de donnée d'élève.","att":"Un tableau où chaque vue a une réponse écrite sur security_invoker. *Source : Module-6-2.3-2026-09-29.md, l.51-62, l.108.* ## Questions de vérification **1. Que décide le RLS, et que ne décide-t-il pas ?** *Corrigé :* Il décide quelles lignes on voit ou modifie, pas quelles colonnes. **2. Une règle laisse l'élève modifier sa ligne. Que peut-il modifier de trop ?** *Corrigé :* Toutes les colonnes de sa ligne, par exemple son statut. **3. Pourquoi une vue peut-elle contourner le RLS, et quelle option l'évite ?** *Corrigé :* Par défaut, la vue contrôle les droits avec son créateur. security_invoker applique ceux de la personne qui lit. **4. Quelle est la solution préférée pour ranger l'e-mail et le téléphone ?** *Corrigé :* Une table séparée, avec ses propres règles. **5. Un droit manque, ou le RLS refuse : quelle différence dans la réponse ?** *Corrigé :* Droit manquant : erreur 42501. Refus du RLS : zéro ligne, sans erreur. ## Projet L'inventaire des données de votre projet principal, avec pour chaque colonne sensible le test qui la protège."}],"exercice":[{"e":"Faites l'inventaire de vos données pour une table : chaque colonne, sensible ou non, qui la voit, qui la modifie.","s":"chaque colonne a une ligne, sans vraie donnée d'élève."},{"e":"Repérez les colonnes qui donnent un droit (statut, rôle, abonnement, prix) et celles qui sont privées (contact).","s":"la liste des colonnes que l'élève ne doit ni modifier ni lire chez les autres."},{"e":"Cherchez les vues de votre schéma exposé : ont-elles security_invoker ?","s":"chaque vue a une réponse écrite."},{"e":"Écrivez un test pour chaque colonne sensible, sur le modèle du chapitre 2.2, et lancez-le en local.","s":"chaque échec est expliqué, puis corrigé par la règle ou la structure, pas par le test."}],"quiz":[{"q":"Que décide le RLS, et que ne décide-t-il pas ?","x":"Il décide quelles lignes on voit ou modifie, gement. On lit un fichier avec la preuve de connexion de la personne, ou avec un lien temporaire. Toute personne qui a l'adresse du fichier le l"},{"t":"Les règles sur storage.objects","d":"Le script d'audit ne donne aucune alerte sur cette faille : seul un test la révèle. Sans règle, aucun envoi n'est possible. Vous autorisez chaque opération. Vous autorisez chaque opération avec une règle sur la table storage.objects. La fonction storage.foldername lit les dossiers dans le chemin du fichier. Le chemin identifiant-de-l-élève/cv.pdf est lisible par cet élève et par personne d'autre. L'identifiant dans le chemin s"},{"t":"Trois règles de plus qu'on oublie","d":"Sans with check, un élève peut déplacer son fichier chez un autre. Le déplacement, la suppression, le serveur. Une règle de modification a deux parties : using (quel fichier je touche) et with check (où il atterrit). Sans with check, l'élève déplace son fichier dans le dossier d'un autre. Une suppression refusée par une règle ne fait pas d'erreur : elle touche zéro fichier. Le test doit compter les lignes touchées. La clé serv"},{"t":"Les liens temporaires","d":"Un lien temporaire est un droit de lecture que vous donnez et que vous ne reprenez pas. Un lien temporaire permet de lire un seul fichier d'un dossier privé, sans connexion. Vous choisissez la durée. La documentation recommande de créer le lien côté serveur, par exemple avec une fonction serveur. Ces liens sont signés avec une clé propre au stockage. Changer les clés de connexion ne les annule pas. Pour annuler un lien, il fau"},{"t":"Limites et ce que la démo ne teste pas","d":"Le test « dossier privé Réglez les limites du dossier et gardez en tête ce qui n'est pas testé. Ces réglages se font au niveau du dossier. Un dossier d'attestations n'a pas besoin d'accepter un fichier de 2 Go ni un programme. Réglez-les. La démo garde la trace des liens donnés, avec un plafond d'une heure. Cela montre que la base peut refuser une durée absurde. Ce n'est pas obligatoire. Elle ne lit pas un dossier public par s"},{"t":"Pas de cas réel : le résultat de la démo","d":"Pourquoi pas de cas réel : Aucun audit de votre plateforme n'a servi à écrire ce chapitre. Le premier exercice est l'inventaire de vos fichiers. Fichiers fragiles : Sur 11 tests, 6 échouent : dossier public, lecture, ajout, suppression et déplacement chez l'élève 2, lien de 10 ans accepté. Fichiers corrigés : Les 11 tests sur 11 réussissent. Le script d'audit du chapitre 2.1 ne signalait rien sur le fichier fragile. Votre cas "}],"icon":"📁","sub":"Fichiers privés, with check et liens temporaires : le bucket public contourne tout.","key":"Un document personnel va dans un dossier privé. Le public est réservé à ce que tout le monde peut voir.","cas":{"t":"Le fichier déplacé chez un autre","ctx":"Cas réel — bucket sans with check.","d1":"Une règle vérifiait seulement le nom du dossier : un élève a déplacé son fichier chez un autre, sans erreur.","d2":"Le with check contrôle où le fichier atterrit. Sans lui, le déplacement est libre.","lecon":"Sans with check, un élève peut déplacer son fichier chez un autre. Un document personnel va dans un dossier privé."},"prompts":[{"t":"Inventaire de mes dossiers de fichiers","use":"Lister chaque dossier de fichiers : type, public ou privé, qui lit, qui écrit. Aide pour l'étape 1 de l'exercice.","txt":"Je suis débutant. Expliquez ce qu'est un dossier de fichiers (bucket) et la différence entre public et privé pour la lecture. Voici mes dossiers FICTIFS : [NOMS ET USAGE DE MES DOSSIERS]. Faites un tableau d'inventaire, une ligne par dossier : type de fichier, public ou privé, qui lit, qui écrit. N'utilisez aucun vrai nom de fichier d'élève. Appliquez la règle : un document personnel va dans un dossier privé, le public est réservé à ce que tout le monde peut voir. Expliquez chaque terme technique en une phrase simple. Rappel : utilisez uniquement des exemples fictifs, jamais de vraie clé, de mot de passe, de jeton ni de donnée d'élève.","att":"Un tableau avec une ligne par dossier, sans vrai nom de fichier d'élève. *Source : Module-6-2.4-2026-09-29.md, l.16-27, l.108.*"},{"t":"Relire mes règles de stockage","use":"Vérifier si chaque règle contrôle le dossier de la personne et si la modification a un with check. Aide pour l'étape 3 de l'exercice.","txt":"Je suis débutant. Expliquez à quoi sert la table storage.objects, puis les mots using et with check dans une règle de modification. Voici une règle FICTIVE ou non sensible à relire : [COLLER ICI UNE RÈGLE]. Répondez par écrit à deux questions : vérifie-t-elle le dossier de la personne, et la modification a-t-elle un with check ? Montrez ce que pourrait faire un élève si la règle vérifie seulement le nom du dossier de fichiers. Proposez une version corrigée. Expliquez chaque terme technique en une phrase simple. Rappel : utilisez uniquement des exemples fictifs, jamais de vraie clé, de mot de passe, de jeton ni de donnée d'élève.","att":"Une réponse écrite pour chaque règle : dossier de la personne vérifié, with check présent ou à ajouter. *Source : Module-6-2.4-2026-09-29.md, l.29-49, l.110.*"},{"t":"Durée de mes liens temporaires","use":"Choisir et justifier en une phrase la durée de chaque lien temporaire. Aide pour l'étape 5 de l'exercice.","txt":"Je suis débutant. Expliquez ce qu'est un lien temporaire (signed URL) et pourquoi on ne peut pas l'annuler soi-même avant sa fin. Voici les liens temporaires FICTIFS de mon application : [USAGE DE CHAQUE LIEN ET DURÉE ACTUELLE]. Pour chacun, proposez la durée la plus courte qui suffit et rédigez une phrase de justification. Rappelez où l'on crée un lien (côté serveur) et où la clé du serveur ne doit jamais aller. Ne me demandez aucune vraie clé. Expliquez chaque terme technique en une phrase simple. Rappel : utilisez uniquement des exemples fictifs, jamais de vraie clé, de mot de passe, de jeton ni de donnée d'élève.","att":"Une durée justifiée en une phrase pour chaque lien, la plus courte qui suffit. *Source : Module-6-2.4-2026-09-29.md, l.53-72, l.112.* ## Questions de vérification **1. Que change un dossier public pour la lecture des fichiers ?** *Corrigé :* Il contourne les contrôles : toute personne qui a l'adresse lit le fichier. **2. Une règle vérifie seulement le nom du dossier. Que peut faire l'élève 1 ?** *Corrigé :* Lire, ajouter, modifier et supprimer chez tous les autres élèves du dossier. **3. À quoi sert le with check d'une règle de modification ?** *Corrigé :* Il contrôle où le fichier atterrit : sans lui, un élève déplace son fichier chez un autre. **4. Peut-on annuler soi-même un lien temporaire ? Que faut-il en déduire ?** *Corrigé :* Non, il faut contacter le support : on donne la durée la plus courte utile. **5. Où créer un lien temporaire, et où ne jamais mettre la clé service_role ?** *Corrigé :* Côté serveur. Jamais dans le navigateur ni dans l'application des élèves. ## Projet L'inventaire des fichiers de votre projet principal, avec pour chaque dossier privé le test qui le protège."}],"exercice":[{"e":"Faites l'inventaire de vos dossiers de fichiers : type de fichier, public ou privé, qui lit, qui écrit.","s":"chaque dossier a une ligne, sans vrai nom de fichier d'élève."},{"e":"Repérez tout dossier public qui contient un document personnel.","s":"la liste des dossiers à passer en privé, ou la preuve qu'il n'y en a pas."},{"e":"Relisez chaque règle sur storage.objects : vérifie-t-elle le dossier de la personne, et la modification a-t-elle un with check ?","s":"chaque règle a une réponse écrite."},{"e":"Écrivez un test par ligne sensible (lecture, ajout, suppression, déplacement chez un autre) et lancez-le en local.","s":"chaque échec est expliqué, puis corrigé par la règle, pas par le test."},{"e":"Notez la durée de chaque lien temporaire que votre application crée.","s":"chaque durée est justifiée en une phrase."}],"quiz":[{"q":"Que change un dossier public pour la lecture des fichiers ?","x":"Il contourne les contrôles : toute p  pas à pas — 4 étapes numérotées à rejouer chez vous, dans l'ordre."}]},{"num":"05","title":"Paiements : ne jamais croire le navigateur","concepts":[{"t":"Ouverture","d":"Bonjour, je suis Zézé, fondateur de Vivier IA. Un élève ouvre les outils de son navigateur et change le prix, ou le produit, avant de payer. Si votre application le croit, il reçoit un accès qu'il n'a pas payé. Dans ce chapitre, vous verrez ce qui appartient au serveur dans un paiement, pourquoi la page « merci"},{"t":"Le prix et le produit se décident sur le serveur","d":"Le prix et le produit se lisent côté serveur, jamais dans le navigateur. Tout ce que le navigateur envoie peut être modifié. Il suffit des outils de développement du navigateur, ou d'un envoi fait à la main. L'OWASP, une référence reconnue en sécurité web, le dit : la validation doit être faite sur le serveur, car un contrôle en JavaScript peut être contourné. L'appel qui crée un paiement reçoit l'identifiant du produit et les"},{"t":"La page « merci » ne prouve rien","d":"La page « merci Après le paiement, Chariow peut renvoyer l'élève vers votre page de remerciement. La documentation de Chariow recommande de ne pas se fier seulement à la redirection pour savoir qu'une vente est terminée. La page affiche un message. Elle n'ouvre rien. N'importe qui peut taper son adresse sans avoir payé, il n'y a donc rien à y croire. Ouvrez votre page « merci La page « merci"},{"t":"L'accès s'ouvre après confirmation","d":"Une route « activer mon accès Deux façons fiables de confirmer un paiement. Chariow envoie un Pulse successful.sale. Vous vérifiez sa signature, comme au chapitre 1.6, puis vous agissez. Votre serveur demande la vente à l'API Chariow avec son identifiant. La documentation recommande de garder cet identifiant. Chariow sépare le statut de la vente et celui du paiement : regardez les deux. Et aucune route appelable par un élève n"},{"t":"Vérifier ce qui a été payé","d":"Un paiement confirmé ne recule jamais, et on enregistre le montant facturé lu dans la vente. Une vente payée ne suffit pas. Le serveur vérifie quatre points. La vente est payée, vous le lisez dans les deux statuts. Et c'est le bon produit : celui de l'espace, pas un autre produit moins cher de la même boutique. Chariow permet d'attacher des métadonnées à la création, renvoyées dans les Pulses. Mettez-y l'identifiant de votre p"},{"t":"La démo : la boutique fragile marche","d":"Aucun vrai paiement, aucun appel à Chariow : la démo imite des principes, pas le format réel. Une boutique fragile et une boutique corrigée, les mêmes 11 tests, un faux prestataire. Prix modifié, produit échangé, paiement créé confirmé, page « merci Sur la boutique fragile, seul le parcours normal réussit. Sur la boutique corrigée, les 11 tests réussissent. Rien ne signale les dix failles : l'élève honnête paie et reçoit son a"},{"t":"Mode d'emploi d'un prompt","d":"Un prompt, c'est le message que vous écrivez à Claude pour lui demander quelque chose. Voici comment utiliser ceux de ce chapitre. D'abord, ouvrez Claude et démarrez une conversation neuve. Ensuite, copiez le prompt tel quel. Remplacez les mots entre crochets par vos propres informations, fictives ou non sensibles. Enfin, relisez la réponse et comparez-la avec le résultat attendu. Ne collez jamais une clé, un mot de passe ou u"}],"icon":"💳","sub":"Paiements : le prix se lit côté serveur, la page merci ne prouve rien, le Pulse à signature vérifiée décide.","key":"Le prix et le produit se lisent côté serveur, jamais dans le navigateur.","cas":{"t":"La page merci qui ne prouve rien","ctx":"Cas réel — paiement Chariow, plateforme Vivier IA.","d1":"Un élève arrivait sur la page « merci » sans avoir payé : n'importe qui peut ouvrir cette adresse.","d2":"La confirmation fiable : le Pulse successful.sale à signature vérifiée, ou la lecture de la vente par l'API, depuis le serveur.","lecon":"Le prix et le produit se lisent côté serveur. Le navigateur ne prouve jamais un paiement."},"prompts":[{"t":"Mes décisions côté serveur","use":"Dresser la liste des décisions de paiement qui appartiennent au serveur. Aide pour l'étape 1 de l'exercice.","txt":"Je suis débutant. Expliquez la règle : le navigateur demande, le serveur décide, et pourquoi tout ce que le navigateur envoie peut être modifié. Mon paiement FICTIF fonctionne ainsi : [DÉCRIRE EN QUELQUES PHRASES LE PARCOURS DE PAIEMENT]. Faites un tableau avec une ligne par décision : prix, produit, statut, confirmation, propriétaire, accès, montant facturé. Pour chaque ligne, une colonne pour savoir qui décide aujourd'hui et une colonne pour l'emplacement dans le code, que je remplirai. Expliquez chaque terme technique en une phrase simple. Rappel : utilisez uniquement des exemples fictifs, jamais de vraie clé, de mot de passe, de jeton ni de donnée d'élève.","att":"Un tableau des sept décisions, chacune avec qui décide et une case pour l'emplacement dans le code. *Source : Module-6-2.5-2026-09-29.md, l.14-18, l.20-27, l.107.*"},{"t":"Page merci et outils de développement","use":"Savoir quoi observer dans le navigateur et ce que la page merci prouve. Aide pour l'étape 2 de l'exercice.","txt":"Je suis débutant. Expliquez pourquoi la page « merci » ne prouve aucun paiement et pourquoi un accès ne s'ouvre jamais seulement parce qu'on la visite. Guidez-moi pas à pas pour ouvrir les outils de développement de mon navigateur sur ma page de paiement de test et regarder ce que le formulaire envoie. Donnez la liste de ce qui ne doit pas apparaître : prix, identifiant de produit du prestataire, statut. Précisez que je reste en local ou en test, sans vrai paiement. Mon projet FICTIF : [NOM DE MON PROJET]. Expliquez chaque terme technique en une phrase simple. Rappel : utilisez uniquement des exemples fictifs, jamais de vraie clé, de mot de passe, de jeton ni de donnée d'élève.","att":"Une marche à suivre et une liste de contrôle : aucun prix, produit ni statut envoyé, aucun accès sur la page merci. *Source : Module-6-2.5-2026-09-29.md, l.14-16, l.31-35, l.108-109.*"},{"t":"Les quatre points de ma confirmation","use":"Relire ma route de confirmation et noter une tâche pour chaque non. Aide pour l'étape 4 de l'exercice.","txt":"Je suis débutant. Voici le résumé FICTIF ou non sensible de ma route de confirmation : [DÉCRIRE CE QUE FAIT MA ROUTE, SANS CLÉ NI DONNÉE CLIENT]. Vérifiez avec moi quatre points : la vente est payée, c'est le bon produit, elle est reliée à un paiement de ma plateforme, l'accès va au bon propriétaire. Vérifiez aussi qu'un paiement confirmé ne recule jamais. Répondez par oui ou non pour chaque point, et pour chaque non, écrivez une tâche simple et un test à écrire. Aucun vrai paiement. Expliquez chaque terme technique en une phrase simple. Rappel : utilisez uniquement des exemples fictifs, jamais de vraie clé, de mot de passe, de jeton ni de donnée d'élève.","att":"Un oui ou non par point, et une tâche notée avec un test à écrire pour chaque non. *Source : Module-6-2.5-2026-09-29.md, l.48-60, l.110-111.* ## Questions de vérification **1. Pourquoi le navigateur ne doit-il jamais envoyer le prix ?** *Corrigé :* Tout ce qu'il envoie peut être modifié par l'élève. Le prix se lit côté serveur ou prestataire. **2. Un élève arrive sur votre page « merci ». Qu'est-ce que cela prouve ?** *Corrigé :* Rien : n'importe qui peut ouvrir cette adresse. **3. Quelles sont les deux façons fiables de confirmer un paiement Chariow ?** *Corrigé :* Le Pulse successful.sale à la signature vérifiée, ou la lecture de la vente par l'API, depuis le serveur. **4. Une vente est payée. Quels quatre points vérifiez-vous avant d'ouvrir l'accès ?** *Corrigé :* Payée (deux statuts), bon produit, reliée à un paiement de la plateforme, accès au propriétaire de ce paiement. **5. Un événement « échec » arrive après la confirmation. Que fait votre serveur ?** *Corrigé :* Rien : un paiement confirmé ne recule jamais. ## Projet La liste des décisions faites côté serveur dans votre paiement, avec pour chacune le test qui la prouve."}],"exercice":[{"e":"Remplissez la liste des décisions côté serveur : prix, produit, statut, confirmation, propriétaire, accès, montant facturé.","s":"chaque ligne a une réponse et un emplacement dans le code."},{"e":"Ouvrez les outils de développement sur votre page de paiement et regardez ce que le formulaire envoie.","s":"aucun prix, aucun identifiant de produit du prestataire, aucun statut."},{"e":"Ouvrez votre page « merci » dans une fenêtre privée, sans avoir payé.","s":"aucun accès ne s'ouvre."},{"e":"Relisez votre route de confirmation : quatre points vérifiés, et refus de faire reculer un paiement confirmé.","s":"des « oui », ou une tâche notée pour chaque « non »."},{"e":"Écrivez un test pour chaque « non », sur le modèle de la démo.","s":"le test échoue avant la correction et réussit après."}],"quiz":[{"q":"Pourquoi le navigateur ne doit-il jamais envoyer le prix ?","x":"Tout ce qu'il envoie peut être modifié par l'élève. Le prix se lit côté serveur ou prestataire.","o":["Tout ce qu'il envoie peut être modifié par l'élève ; le prix se lit côté serveur ou prestataire","Le navigateur est plus rapide","Le prix est secret","Le serveur ne sait pas lire"],"c":0},{"q":"Un élève arrive sur votre page « merci ». Qu'est-ce que cela prouve ?","x":"Rien : n'importe qui peut ouvrir cette adresse.","o":["Rien : n'importe qui peut ouvrir cette adresse","Que le paiement a réussi","Que l'élève est connecté","Que la commande est prête"],"c":0},{"q":"Quelles sont les deux façons fiables de confirmer un paiement Chariow ?","x":"Le Pulse successful.sale à la signature vérifiée, ou la lecture de la vente par l'API, depuis le serveur.","o":["Le Pulse successful.sale à la signature vérifiée, ou la lecture de la vente par l'API, depuis le serveur","L'URL de la page merci","Le clic sur un bouton","Le reçu affiché à l'écran"],"c":0},{"q":"Une vente est payée. Quels quatre points vérifiez-vous avant d'ouvrir l'accès ?","x":"Payée (deux statuts), bon produit, reliée à un paiement de la plateforme, accès au propriétaire de ce paiement.","o":["Payée (deux statuts), bon produit, reliée à un paiement de la plateforme, accès au propriétaire de ce paiement","La couleur du bouton et le logo","Le nom du navigateur et l'heure","La taille de la page et la langue"],"c":0},{"q":"Un événement « échec » arrive après la confirmation. Que fait votre serveur ?","x":"Rien : un paiement confirmé ne recule jamais.","o":["Rien : un paiement confirmé ne recule jamais","Annuler l'accès immédiatement","Rembourser automatiquement","Bloquer le compte"],"c":0}],"act":{"type":"steps","icon":"💳","title":"La preuve du paiement","sub":"5 situations de paiement. Le navigateur ne décide jamais ; le serveur vérifie signature, produit et propriétaire.","steps":[{"q":"Pourquoi le navigateur ne doit-il jamais envoyer le prix ?","o":["Tout ce qu'il envoie peut être modifié par l'élève ; le prix se lit côté serveur ou prestataire","Le navigateur est plus rapide","Le prix est secret","Le serveur ne sait pas lire"],"c":0,"x":"Tout ce qu'il envoie peut être modifié par l'élève. Le prix se lit côté serveur ou prestataire."},{"q":"Un élève arrive sur votre page « merci ». Qu'est-ce que cela prouve ?","o":["Rien : n'importe qui peut ouvrir cette adresse","Que le paiement a réussi","Que l'élève est connecté","Que la commande est prête"],"c":0,"x":"Rien : n'importe qui peut ouvrir cette adresse."},{"q":"Quelles sont les deux façons fiables de confirmer un paiement Chariow ?","o":["Le Pulse successful.sale à la signature vérifiée, ou la lecture de la vente par l'API, depuis le serveur","L'URL de la page merci","Le clic sur un bouton","Le reçu affiché à l'écran"],"c":0,"x":"Le Pulse successful.sale à la signature vérifiée, ou la lecture de la vente par l'API, depuis le serveur."},{"q":"Une vente est payée. Quels quatre points vérifiez-vous avant d'ouvrir l'accès ?","o":["Payée (deux statuts), bon produit, reliée à un paiement de la plateforme, accès au propriétaire de ce paiement","La couleur du bouton et le logo","Le nom du navigateur et l'heure","La taille de la page et la langue"],"c":0,"x":"Payée (deux statuts), bon produit, reliée à un paiement de la plateforme, accès au propriétaire de ce paiement."},{"q":"Un événement « échec » arrive après la confirmation. Que fait votre serveur ?","o":["Rien : un paiement confirmé ne recule jamais","Annuler l'accès immédiatement","Rembourser automatiquement","Bloquer le compte"],"c":0,"x":"Rien : un paiement confirmé ne recule jamais."}]},"ana":"Le navigateur, c'est le client qui dit « j'ai payé » à l'entrée du magasin : parfois vrai, parfois non — et on ne remet la marchandise qu'après avoir vu le reçu de la caisse, pas la parole du client.","expert":"La page « merci » est un décor, pas une preuve : quiconque connaît l'adresse peut l'ouvrir. La seule vérité arrive par le webhook signé (Pulse), vérifiée par le serveur — signature, type d'événement, propriétaire.","erreurs":["Activer l'accès depuis la page merci","Lire le prix côté navigateur","Un paiement « confirmé » jamais vérifié côté serveur"],"check":["La confirmation par Pulse à signature vérifiée ou lecture API","Le prix lu côté serveur uniquement","Les 4 vérifications (statut, produit, lien, propriétaire)","Une procédure d'annulation si le paiement recule"],"action":"Dessinez votre chaîne de confirmation : d'où vient le signal, qui le vérifie, qui décide. Si la réponse est « le navigateur », corrigez.","glossaire":[["Webhook signé","La notification de paiement accompagnée d'une preuve cryptographique"],["Pulse","L'événement Chariow envoyé à votre serveur"],["Page merci","La page affichée après achat : une déco, pas une preuve"],["Propriétaire","Le compte auquel la vente est reliée"]],"shots":[{"img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABNgAAALQCAIAAADNV1p8AADWBUlEQVR4nOzdd1wURxsH8Gf37jg6omDBAhZs2FtsxN7Fjkaj0aixxZLEmBhLjNEYW95EE1sSY4m9994itij2gggK2LAXOld23j9WLueV5e6Ag5Pf9+Mfx5aZZ2b25B5mdo/zrl+LAAAAAAAAAOyFz+0AAAAAAAAAIH
