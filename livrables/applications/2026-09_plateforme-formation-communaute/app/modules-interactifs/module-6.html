tH/fyoKidQ8+1vzWBsy9tv+ca4UQ6x98XFdQ2PwGIa9lL1874xcRPv3Fp4UQx77+/sT36xvtHb70ZmN9/faX/l1dWma1Kflxlu+oVTEBHMIZht0Z/rFtwbdYy2rmBTL9z7ektqq6sqAwY/e+sz9vNdTUqFCAHVqvx1a9jkqmsTO83QC0Oe0wiAohzm9NTvnws4Zb4m9d7KhiANinx1XjQ/r2/uWFVypy8x1dC9AOtY+32KanXyi+kBHar0/Cg/cMWjAnfPCAX15YIYxGR9elnvZxHQF0QO0ziLY/2/75mqNLANSWtm1H2rYdyo/nbYKGmA9W2foWc15GY97xk1kHj3QdMSykT6/gnjEFZ845uiYzWmlOtp/rCKCD+X8FbNKwz9rbuwAAAABJRU5ErkJggg==","cap":"La pratique pas à pas — 4 étapes numérotées à rejouer chez vous, dans l'ordre."}]},{"num":"06","title":"Protéger le dernier administrateur et journaliser","concepts":[{"t":"Ouverture","d":"Bonjour, je suis Zézé, fondateur de Vivier IA. Imaginez que votre dernier administrateur disparaisse par erreur : plus personne ne peut approuver, corriger ou retirer quoi que ce soit. Ou qu'un contenu disparaisse sans que personne sache qui l'a supprimé. Dans ce chapitre, vous verrez comment protéger le dernier administrateur, comment tenir un journal des actions sensibles, et pourquoi cela se vérifie dans la base. Tout se pr"},{"t":"Deux accidents qui coûtent très cher","d":"Ce qui doit toujours être vrai se vérifie dans la base, pas seulement dans l'écran. Une petite plateforme ne peut pas se payer ces deux accidents. Personne ne peut plus approuver, corriger ou retirer quoi que ce soit. Il faut alors intervenir à la main dans la base, sous pression. Un contenu disparaît, un rôle change, et personne ne sait qui l'a fait ni quand. Un script, une commande SQL à la main ou une erreur de code passent"},{"t":"Protéger le dernier administrateur","d":"Au moins deux comptes administrateurs, tenus par deux personnes différentes. La protection la plus solide est un déclencheur : un code que la base exécute toute seule. Le déclencheur refuse de retirer le rôle du dernier administrateur, quel que soit le chemin. Si on supprime le profil du dernier administrateur, il n'y a plus de rôle : le déclencheur doit surveiller aussi la suppression des profils. Si les profils sont reliés a"},{"t":"Journaliser les actions sensibles","d":"Jamais de mot de passe, de clé ni de jeton dans un journal. Un extrait court suffit. Un journal est une table où chaque action sensible laisse une ligne : qui, quoi, sur quoi, quand. Les droits sont retirés aux rôles anon et authenticated. Un membre ne peut ni lire le journal, ni y fabriquer une fausse ligne. Si seul le code de l'application écrit, une action faite par un script ou en SQL à la main ne laisse aucune trace. Dans"},{"t":"La démo : dix tests","d":"Un test réussi prouve une chose précise. Deux actions simultanées ne sont pas testées ici. Deux fichiers de règles, les mêmes 10 tests, tout est factice. RLS actif sur le journal, membre sans accès, promotion, retrait d'un admin quand il en reste un autre, refus de retirer le rôle du dernier. Suppression du profil, suppression du compte, trace d'un changement de rôle fait en SQL direct, et serveur qui peut modifier ou effacer "},{"t":"Mode d'emploi d'un prompt","d":"Un prompt, c'est le message que vous écrivez à Claude pour lui demander quelque chose. Voici comment utiliser ceux de ce chapitre. D'abord, ouvrez Claude et démarrez une conversation neuve. Ensuite, copiez le prompt tel quel. Remplacez les mots entre crochets par vos propres informations, fictives ou non sensibles. Enfin, relisez la réponse et comparez-la avec le résultat attendu. Ne collez jamais une clé, un mot de passe ou u"},{"t":"Prompt à copier : Mes administrateurs et mes chemins","d":"Première prompt à copier. Compter mes administrateurs et lister les chemins qui font perdre le dernier. Ce que vous devez obtenir : Un constat sur mes administrateurs et un tableau des chemins, chacun avec la protection à vérifier."}],"icon":"📜","sub":"Protéger le dernier administrateur, journaliser par la base, et ne jamais écrire un secret dans un journal.","key":"Ce qui doit toujours être vrai se vérifie dans la base, pas seulement dans l'écran.","cas":{"t":"Le journal sans secret","ctx":"Cas réel — journaux de la plateforme Vivier IA.","d1":"Un journal qui écrit les mots de passe en clair est une faille : le premier lecteur du journal devient administrateur.","d2":"Jamais de mot de passe, de clé ni de jeton dans un journal. Le serveur ajoute et lit, jamais modifie ni efface.","lecon":"Ce qui doit toujours être vrai se vérifie dans la base, pas seulement dans l'écran. Au moins deux administrateurs, tenus par deux personnes différentes."},"prompts":[{"t":"Mes administrateurs et mes chemins","use":"Compter mes administrateurs et lister les chemins qui font perdre le dernier. Aide pour l'étape 2 de l'exercice.","txt":"Je suis débutant. Expliquez pourquoi une application ne doit jamais se retrouver sans aucun administrateur. Mon application FICTIVE a [NOMBRE EN LETTRES] administrateurs, tenus par [NOMBRE EN LETTRES] personnes. Dites si c'est suffisant selon la règle des deux comptes tenus par deux personnes. Listez ensuite tous les chemins qui peuvent faire perdre le dernier administrateur (retirer son rôle, supprimer son profil, supprimer son compte) et, pour chacun, la protection à vérifier dans la base. Expliquez ce qu'est un déclencheur. Expliquez chaque terme technique en une phrase simple. Rappel : utilisez uniquement des exemples fictifs, jamais de vraie clé, de mot de passe, de jeton ni de donnée d'élève.","att":"Un constat sur mes administrateurs et un tableau des chemins, chacun avec la protection à vérifier. *Source : Module-6-2.7-2026-09-30.md, l.14-33, l.84-85.*"},{"t":"Mon journal des actions sensibles","use":"Remplir la liste des actions sensibles et qui les journalise. Aide pour l'étape 3 de l'exercice.","txt":"Je suis débutant. Expliquez ce qu'est un journal (qui, quoi, sur quoi, quand) et pourquoi il est utile. Les actions sensibles FICTIVES de mon application sont : [LISTE DES ACTIONS SENSIBLES]. Faites un tableau : action, qui la journalise (la base ou le code de l'application), et la trace attendue. Rappelez ce qu'on n'écrit jamais dans un journal : mot de passe, clé, jeton ou donnée personnelle inutile. Signalez les actions qui resteraient sans trace si elles étaient faites hors de l'application. Expliquez chaque terme technique en une phrase simple. Rappel : utilisez uniquement des exemples fictifs, jamais de vraie clé, de mot de passe, de jeton ni de donnée d'élève.","att":"Un tableau où chaque action sensible a une trace et un responsable de la journalisation. *Source : Module-6-2.7-2026-09-30.md, l.35-45, l.86.*"},{"t":"Droits du serveur sur le journal","use":"Vérifier que le serveur peut ajouter et lire, mais pas modifier ni effacer. Aide pour l'étape 4 de l'exercice.","txt":"Je suis débutant. Expliquez pourquoi le serveur doit pouvoir ajouter et lire des lignes du journal, mais ni les modifier ni les effacer, et ce que cela change si une clé serveur est volée. Ma table FICTIVE de journal s'appelle [NOM DE MA TABLE DE JOURNAL]. Préparez un petit plan de vérification en local ou en test : quels droits regarder, ce que j'attends pour chaque droit, et comment noter le résultat. Donnez aussi un modèle de phrase de test qui échoue si je retire la protection. Pas de production. Expliquez chaque terme technique en une phrase simple. Rappel : utilisez uniquement des exemples fictifs, jamais de vraie clé, de mot de passe, de jeton ni de donnée d'élève.","att":"Un plan de vérification : ajouter et lire permis, modifier et effacer refusés, avec un test qui échoue sans protection. *Source : Module-6-2.7-2026-09-30.md, l.39-44, l.87-88.* ## Questions de vérification **1. Pourquoi vérifier « il reste un admin » dans la base et pas seulement dans l'écran ?** *Corrigé :* Un script, une commande SQL ou une erreur de code passent à côté de l'écran. **2. Citez trois chemins qui peuvent faire perdre le dernier admin.** *Corrigé :* Lui retirer son rôle, supprimer son profil, supprimer son compte. **3. Pourquoi faire écrire le journal par la base plutôt que par l'application seule ?** *Corrigé :* Pour qu'une action faite hors de l'application laisse aussi une trace. **4. Quels droits donner au serveur sur le journal ?** *Corrigé :* Ajouter et lire, jamais modifier ni effacer. **5. Que ne faut-il jamais écrire dans un journal ?** *Corrigé :* Un mot de passe, une clé, un jeton, ou une donnée personnelle inutile. ## Projet Le journal des actions sensibles de votre application, avec pour chaque ligne le test qui la prouve."}],"exercice":[{"e":"Comptez vos comptes administrateurs et les personnes qui les tiennent.","s":"au moins deux, tenus par deux personnes."},{"e":"Listez tous les chemins qui peuvent faire perdre le dernier admin : rôle, profil, compte.","s":"chaque chemin a une protection dans la base."},{"e":"Remplissez le journal des actions sensibles : vos actions sensibles, et qui les journalise.","s":"aucune action sensible sans trace."},{"e":"Vérifiez les droits du serveur sur votre journal.","s":"il peut ajouter et lire, pas modifier ni effacer."},{"e":"Écrivez un test par ligne de l'étape 2, sur le modèle de la démo.","s":"chaque test échoue si vous retirez la protection."}],"quiz":[{"q":"Pourquoi vérifier « il reste un admin » dans la base et pas seulement dans l'écran ?","x":"Un script, une commande SQL ou une erreur de code passent à côté de l'écran.","o":["Un script, une commande SQL ou une erreur de code passent à côté de l'écran","L'écran est plus joli","La base est plus lente","L'écran est réservé au client"],"c":0},{"q":"Citez trois chemins qui peuvent faire perdre le dernier admin.","x":"Lui retirer son rôle, supprimer son profil, supprimer son compte.","o":["Lui retirer son rôle, supprimer son profil, supprimer son compte","Changer son mot de passe","Modifier son e-mail","Fermer son navigateur"],"c":0},{"q":"Pourquoi faire écrire le journal par la base plutôt que par l'application seule ?","x":"Pour qu'une action faite hors de l'application laisse aussi une trace.","o":["Pour qu'une action faite hors de l'application laisse aussi une trace","Pour accélérer l'application","Pour réduire les coûts","Pour éviter les erreurs"],"c":0},{"q":"Quels droits donner au serveur sur le journal ?","x":"Ajouter et lire, jamais modifier ni effacer.","o":["Ajouter et lire, jamais modifier ni effacer","Modifier et effacer","Uniquement ajouter","Tous les droits"],"c":0},{"q":"Que ne faut-il jamais écrire dans un journal ?","x":"Un mot de passe, une clé, un jeton, ou une donnée personnelle inutile.","o":["Un mot de passe, une clé, un jeton, ou une donnée personnelle inutile","L'heure de l'action","Le nom de la table","Le statut de la vente"],"c":0}],"act":{"type":"steps","icon":"📜","title":"Le journal et le dernier admin","sub":"5 situations de gouvernance. Deux admins, journal en base, jamais de secret dans un log.","steps":[{"q":"Pourquoi vérifier « il reste un admin » dans la base et pas seulement dans l'écran ?","o":["Un script, une commande SQL ou une erreur de code passent à côté de l'écran","L'écran est plus joli","La base est plus lente","L'écran est réservé au client"],"c":0,"x":"Un script, une commande SQL ou une erreur de code passent à côté de l'écran."},{"q":"Citez trois chemins qui peuvent faire perdre le dernier admin.","o":["Lui retirer son rôle, supprimer son profil, supprimer son compte","Changer son mot de passe","Modifier son e-mail","Fermer son navigateur"],"c":0,"x":"Lui retirer son rôle, supprimer son profil, supprimer son compte."},{"q":"Pourquoi faire écrire le journal par la base plutôt que par l'application seule ?","o":["Pour qu'une action faite hors de l'application laisse aussi une trace","Pour accélérer l'application","Pour réduire les coûts","Pour éviter les erreurs"],"c":0,"x":"Pour qu'une action faite hors de l'application laisse aussi une trace."},{"q":"Quels droits donner au serveur sur le journal ?","o":["Ajouter et lire, jamais modifier ni effacer","Modifier et effacer","Uniquement ajouter","Tous les droits"],"c":0,"x":"Ajouter et lire, jamais modifier ni effacer."},{"q":"Que ne faut-il jamais écrire dans un journal ?",  <div class="dash-grid">${DATA.map(d=>`<div class="dash-card" onclick="show('s${d.num}')">
   <div class="dc-num">SECTION ${d.num}</div><h3>${d.icon} ${d.title}</h3><p>${d.sub}</p>
   <div class="dc-foot"><div class="dc-prog"><div></div></div><span class="dc-state">À faire</span></div></div>`).join("")}
 </div>
 <div class="card" style="margin-top:24px"><h3><span class="ico">📜</span>Les 7 règles d'or du module</h3>
  <div class="rulette">${RULES.map(r=>`<div class="rule"><b>${r[0]} ${r[1]}</b>${r[2]}</div>`).join("")}</div>
  <div class="safe-note" style="margin-top:16px">🛡️ <div><strong>Règle de sécurité permanente :</strong> ne montrez jamais de vraie clé, mot de passe ou donnée de client. Travaillez sur vos propres projets, en local ou en test — jamais en production. Et aucune vraie musique ou donnée bancaire dans vos démonstrations.</div></div>
 </div>`;
}
function sectionHTML(s){
 return `<div class="sec-head"><div class="sec-num">${s.num}</div><div><h2>${s.icon} ${s.title}</h2><div class="sub">${s.sub}</div></div></div>
 <div class="grid2"><div>
  <div class="card"><h3><span class="ico">💡</span>Les concepts clés</h3>
   <div class="hintline">▶ Cliquez sur chaque concept pour le révéler (comme les diapositives animées).</div>
   ${s.concepts.map((c,i)=>`<div class="concept card" style="padding:14px 16px;margin-bottom:9px"><div class="c-t">${c.t}<span class="plus">+</span></div><div class="c-body">${c.d}</div></div>`).join("")}
  </div>
  <div class="key-banner"><span class="kb-ico">🔑</span><div><div class="kb-l">À retenir</div><p>${s.key}</p></div></div>
  <div class="flip"><div class="flip-in">
   <div class="flip-face flip-front"><span class="tag">📂 Cas réel</span><h4>${s.cas.t}</h4><p><strong>${s.cas.ctx}</strong></p><p>${s.cas.d1}</p><span class="cta">👉 Cliquez pour découvrir la suite et la leçon</span></div>
   <div class="flip-face flip-back"><span class="tag">🎓 La leçon</span><p>${s.cas.d2}</p><p style="color:var(--txt);font-weight:600">${s.cas.lecon}</p></div>
  </div></div>
 </div><div>
  <div class="card"><h3><span class="ico">🏋️</span>À vous de pratiquer</h3>
   ${s.exercice.map((e,i)=>`<div class="step"><div class="sn">${i+1}</div><div>${e.e}<br><span class="sig">✓ Signal de réussite : ${e.s}</span></div></div>`).join("")}
  </div>
  <div class="card" style="margin-top:16px"><h3><span class="ico">🧪</span>Quiz de validation</h3><div id="quiz-${s.num}"></div><div class="quiz-score" id="qs-${s.num}"></div></div>
 </div></div>
 ${notesHTML(s)}<div class="act"><div class="act-h"><div class="a-ico">${s.act.icon||"🧰"}</div><h3>${s.act.title}</h3></div><div class="act-sub">${s.act.sub}</div><div id="act-${s.num}"></div></div>
 <div class="card"><h3><span class="ico">📋</span>Prompts prêts à copier</h3>
  <div class="safe-note">🛡️ <div>Mode d'emploi : 1) ouvrez Claude et démarrez une conversation neuve ; 2) copiez le prompt et remplacez les <strong>[crochets]</strong> par vos informations fictives ou non sensibles ; 3) relisez la réponse et comparez-la au résultat attendu. <strong>Ne collez jamais une vraie clé, un mot de passe ou une donnée de client.</strong></div></div>
  ${s.prompts.map((p,i)=>`<div class="prompt"><div class="p-head"><span class="p-title">${i+1}. ${p.t}</span><span class="p-use">— ${p.use}</span><button class="copy-btn">📋 Copier</button></div><pre>${esc(p.txt)}</pre><div class="p-expected"><b>Résultat attendu :</b> ${p.att}</div></div>`).join("")}
 </div>
 ${expertHTML(s)}<div style="display:flex;gap:12px;margin-top:24px;flex-wrap:wrap"><button class="btn violet" onclick="show('accueil')">🏠 Retour à l'accueil</button>${DATA.findIndex(d=>d.num===s.num)<DATA.length-1?`<button class="btn" onclick="show('s${DATA[DATA.findIndex(d=>d.num===s.num)+1].num}')">Section suivante →</button>`:`<button class="btn" onclick="show('final')">🏆 Aller à l'évaluation finale →</button>`}</div>`;
}
function initSection(v,s){
 v.querySelector(".flip").onclick=e=>e.currentTarget.classList.toggle("flipped");
 v.querySelectorAll(".concept").forEach(c=>c.onclick=()=>c.classList.toggle("open"));
 initNotes(v,s);
 v.querySelectorAll(".copy-btn").forEach(b=>b.onclick=()=>copyText(b,b.closest(".prompt").querySelector("pre").textContent));
 initQuiz(v,s);initAct(v,s);
}
/* ---- Quiz ---- */
function initQuiz(v,s){
 const box=v.querySelector("#quiz-"+s.num),sc=v.querySelector("#qs-"+s.num);
 box.innerHTML=s.quiz.map((q,i)=>`<div class="quiz-q"><div class="qq"><span class="qn">${i+1}</span>${q.q}</div>${q.o.map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${o}</button>`).join("")}<div class="q-expl" id="ex-${s.num}-${i}">💡 ${q.x}</div></div>`).join("")+`<button class="btn" id="qb-${s.num}" style="display:none">Valider ma note</button>`;
 const answers={};let locked=false;
 box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  if(locked)return;const i=+b.dataset.q;answers[i]=+b.dataset.j;
  box.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>x.classList.remove("good","bad"));
  b.classList.add("good");
  box.querySelector("#ex-"+s.num+"-"+i).classList.add("show");
  if(Object.keys(answers).length===s.quiz.length){const btn=box.querySelector("#qb-"+s.num);btn.style.display="inline-block";btn.onclick=()=>{
   locked=true;let n=0;s.quiz.forEach((q,i)=>{if(answers[i]===q.c)n++;recordStat(s.num,i,answers[i]===q.c);box.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>{x.disabled=true;if(+x.dataset.j===q.c)x.classList.add("good");else if(answers[i]===+x.dataset.j)x.classList.add("bad")})});
   const win=n>=4;sc.className="quiz-score show "+(win?"win":"retry");
   sc.innerHTML=win?`🎉 Score : ${n}/5 — Section validée ! ${n===5?"Score parfait, bravo.":"Relisez la question ratée pour viser le 5/5."}`:`Score : ${n}/5 — Il faut 4/5 pour valider. Relisez les explications et réessayez.`;
   if(win){state.done[s.num]=true;save();progUpdate()}
  }}
 });
}
/* ---- Ateliers interactifs (atelier générique piloté par les données) ---- */
function initAct(v,s){ actSteps(v.querySelector("#act-"+s.num), s.act.steps); }
function actSteps(box,steps){
 let i=0,score=0;box.innerHTML='<div id="gz"></div>';const z=box.querySelector("#gz");
 function step(){if(i>=steps.length){z.innerHTML=`<div class="final-hero"><div class="big-emoji">${score>=steps.length-1?"🏆":"📝"}</div><h3>Score : ${score}/${steps.length}</h3><p style="color:var(--muted);margin-top:8px">${score>=steps.length-1?"Beau réflexe : la sécurité devient un réflexe, pas une contrainte.":"Relisez les explications, puis retentez : chaque situation est tirée du cours."}</p></div>`;return}
  const S=steps[i];z.innerHTML=`<div class="hintline">Situation ${i+1}/${steps.length}</div><div class="card" style="background:var(--bg2)"><strong>${S.q}</strong><br><br>${S.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}<div class="feedback" id="gfb"></div></div>`;
  z.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const win=+b.dataset.j===S.c;if(win)score++;z.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.j===S.c)x.classList.add("good");else if(x===b)x.classList.add("bad")});
   const fb=z.querySelector("#gfb");fb.className="feedback show "+(win?"ok":"ko");fb.innerHTML=(win?"✅ ":"⚠️ ")+S.x;setTimeout(()=>{i++;step()},2400)})}
 step();
}
/* ---- Évaluation finale ---- */
function finalHTML(){
 const n=Object.keys(state.done).length;
 return `<div class="sec-head"><div class="sec-num">🏆</div><div><h2>Évaluation finale du module</h2><div class="sub">10 questions mélangées tirées des 7 sections. 8 bonnes réponses pour valider le module. ${state.final!==null?`<strong style="color:var(--orange2)">Dernière tentative : ${state.final}/10</strong>`:""}</div></div></div>
 ${n<7?`<div class="safe-note">📌 <div>Vous avez validé ${n}/7 sections. L'évaluation est disponible à tout moment, mais les sections non validées comptent aussi pour finir le module.</div></div>`:""}
 ${state.final>=8?'<div class="card" style="margin-bottom:16px;border-color:var(--gold)"><h3><span class="ico">🎓</span>Votre certificat est prêt</h3><p style="color:var(--muted);font-size:14px;margin-bottom:12px">Score final : <b style="color:var(--gold)">'+(state.final)+'/10</b> — générez votre certificat nominatif, imprimable ou enregistrable en PDF.</p><button class="btn" onclick="showCertPrompt(state.final)">🎓 Générer mon certificat</button></div>':''}<div class="card" id="finalbox"></div>`;
}
function initFinal(v){
 const box=v.querySelector("#finalbox");
 box.innerHTML=FINAL.map((q,i)=>`<div class="quiz-q"><div class="qq"><span class="qn">${i+1}</span>${q.q} <span style="color:var(--dim);font-size:12px">(section ${q.s})</span></div>${q.o.map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${o}</button>`).join("")}<div class="q-expl" id="fx-${i}"></div></div>`).join("")+`<button class="btn" id="fgo" style="display:none;margin-top:6px">Valider l'évaluation</button><div class="quiz-score" id="fres"></div>`;
 const ans={};let locked=false;
 box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(locked)return;const i=+b.dataset.q;ans[i]=+b.dataset.j;box.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>x.classList.remove("good","bad"));b.classList.add("good");
  if(Object.keys(ans).length===FINAL.length){const g=box.querySelector("#fgo");g.style.display="inline-block";g.onclick=()=>{
   locked=true;let n=0;FINAL.forEach((q,i)=>{if(ans[i]===q.c)n++;box.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>{x.disabled=true;if(+x.dataset.j===q.c)x.classList.add("good");else if(ans[i]===+x.dataset.j)x.classList.add("bad")});const ex=box.querySelector("#fx-"+i);ex.textContent="💡 Réponse liée à la section "+q.s+" — voir la section correspondante pour réviser.";ex.classList.add("show")});
   state.final=n;save();const r=box.querySelector("#fres");const win=n>=8;r.className="quiz-score show "+(win?"win":"retry");
   r.innerHTML=win?`🏆 ${n}/10 — Module validé ! Vous avez terminé les six modules de la formation Vivier IA. Félicitations ! Idée centrale à emporter : on apprend à diriger un agent qui code, en cadrant, en vérifiant et en choisissant les outils selon le besoin plutôt que par habitude.`:`${n}/10 — Il faut 8/10. Les questions ratées sont signalées avec leur section : retournez y jeter un œil, puis recommencez.`;
   if(win){setTimeout(()=>showCertPrompt(n),1200);const em=["🎉","🌟","🚀","🎊","🏆","💜","🧡"];for(let k=0;k<40;k++){const c=document.createElement("div");c.className="confetti";c.textContent=em[k%em.length];c.style.left=Math.random()*100+"vw";c.style.animationDuration=(2+Math.random()*2)+"s";c.style.animationDelay=(Math.random()*1.2)+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),5000)}}}}});
}
/* ---- Init ---- */
progUpdate();show("accueil");

</script>
</body>
</html>
