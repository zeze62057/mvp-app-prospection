<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivier IA — Module 4 interactif : Sécurité et conformité IA</title>
<style>
:root{
  --bg:#113832; --bg2:#163e37; --panel:#1d4a43; --panel2:#2b554e;
  --line:#3d635d; --txt:#ffffff; --muted:#bcd8d2; --dim:#8fb5ad;
  --orange:#e16139; --orange2:#ec987e; --violet:#5fc7b8; --violet2:#8fe0d3;
  --ok:#33c97e; --okbg:rgba(51,201,126,.12); --ko:#e5484d; --kobg:rgba(229,72,77,.12);
  --gold:#ffd166;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(95,199,184,.14),transparent),radial-gradient(900px 500px at -10% 10%,rgba(225,97,57,.10),transparent),var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.6;min-height:100vh}
h1,h2,h3,h4{font-family:"Unbounded","Segoe UI",system-ui,sans-serif;line-height:1.25}
code,pre,.mono{font-family:"Cascadia Code","Fira Code",Consolas,monospace}
a{color:var(--violet2)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* ---------- Header ---------- */
header.top{position:sticky;top:0;z-index:50;background:rgba(17,56,50,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding:12px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:"Unbounded",sans-serif;font-weight:700;letter-spacing:.5px}
.logo-badge{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--orange),var(--violet));display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 4px 18px rgba(255,138,61,.35)}
.logo small{display:block;font-size:10px;color:var(--muted);font-weight:400;letter-spacing:2px;text-transform:uppercase}
.prog-wrap{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:210px;flex:1;max-width:340px}
.prog{flex:1;height:9px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog>div{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--violet));transition:width .5s ease}
.prog-txt{font-size:12px;color:var(--muted);white-space:nowrap}
/* ---------- Nav ---------- */
nav.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 14px;border-radius:99px;cursor:pointer;font-size:13.5px;font-weight:600;transition:.2s;display:flex;align-items:center;gap:7px}
.tab:hover{border-color:var(--violet);color:var(--txt)}
.tab.on{background:linear-gradient(135deg,rgba(225,97,57,.25),rgba(95,199,184,.22));border-color:var(--orange);color:var(--txt)}
.tab .dot{width:16px;height:16px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim)}
.tab.done .dot{background:var(--ok);border-color:var(--ok);color:#062b18}
/* ---------- Layout ---------- */
main{padding:26px 0 60px}
.view{display:none;animation:fadein .35s ease}
.view.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,rgba(225,97,57,.16),rgba(95,199,184,.14)),var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px 30px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(24px,4vw,38px);margin:10px 0 8px}
.hero .kicker{display:inline-block;background:rgba(225,97,57,.18);border:1px solid rgba(225,97,57,.45);color:var(--orange2);padding:4px 14px;border-radius:99px;font-size:12.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.hero p{color:var(--muted);max-width:760px;font-size:16px}
.sec-head{display:flex;align-items:flex-start;gap:18px;margin:6px 0 22px;flex-wrap:wrap}
.sec-num{font-family:"Unbounded";font-size:44px;font-weight:800;background:linear-gradient(135deg,var(--orange),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.sec-head h2{font-size:clamp(22px,3vw,30px)}
.sec-head .sub{color:var(--muted);margin-top:4px;max-width:720px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
/* ---------- Cards / concepts ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.card h3{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.card h3 .ico{width:28px;height:28px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.concept{cursor:pointer;transition:.2s;border-left:3px solid var(--line)}
.concept:hover{border-left-color:var(--orange);transform:translateX(3px)}
.concept .c-t{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.concept .plus{margin-left:auto;width:22px;height:22px;border-radius:6px;background:var(--panel2);color:var(--orange2);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;transition:.25s}
.concept.open .plus{transform:rotate(45deg);background:rgba(225,97,57,.22)}
.concept .c-body{display:none;margin-top:12px;color:var(--muted);font-size:14.5px}
.concept.open .c-body{display:block;animation:fadein .3s}
.concept .c-body strong{color:var(--txt)}
.hintline{font-size:12.5px;color:var(--dim);margin:4px 0 12px;display:flex;gap:7px;align-items:center}
.key-banner{margin:22px 0;border-radius:16px;padding:18px 22px;background:linear-gradient(120deg,rgba(225,97,57,.18),rgba(95,199,184,.16));border:1px solid rgba(225,97,57,.5);display:flex;gap:14px;align-items:flex-start}
.key-banner .kb-ico{font-size:24px;flex:none}
.key-banner .kb-l{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--orange2)}
.key-banner p{font-size:16.5px;font-weight:600;margin-top:2px}
/* ---------- Flip cas réel ---------- */
.flip{perspective:1200px;min-height:250px}
.flip-in{position:relative;width:100%;min-height:250px;transition:transform .6s;transform-style:preserve-3d;cursor:pointer}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:22px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.flip-front{background:linear-gradient(150deg,rgba(95,199,184,.22),var(--panel))}
.flip-back{background:linear-gradient(150deg,rgba(225,97,57,.22),var(--panel));transform:rotateY(180deg)}
.flip-face .tag{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--violet2)}
.flip-back .tag{color:var(--orange2)}
.flip-face h4{font-size:17px}
.flip-face p{color:var(--muted);font-size:14px}
.flip-face .cta{margin-top:auto;font-size:12.5px;color:var(--dim)}
/* ---------- Quiz ---------- */
.quiz-q{margin-bottom:16px}
.quiz-q .qq{font-weight:700;margin-bottom:10px;display:flex;gap:10px}
.quiz-q .qq .qn{flex:none;width:26px;height:26px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--orange2)}
.opt{display:block;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:11px 14px;border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:14.5px;transition:.15s}
.opt:hover{border-color:var(--violet)}
.opt.good{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--kobg);border-color:var(--ko)}
.opt:disabled{cursor:default;opacity:.9}
.q-expl{display:none;background:var(--bg2);border-left:3px solid var(--orange);border-radius:0 10px 10px 0;padding:10px 14px;font-size:13.5px;color:var(--muted);margin-top:6px}
.q-expl.show{display:block;animation:fadein .3s}
.quiz-score{display:none;text-align:center;padding:18px;border-radius:16px;font-size:17px;font-weight:700;margin-top:8px}
.quiz-score.show{display:block}
.quiz-score.win{background:var(--okbg);border:1px solid var(--ok);color:var(--ok)}
.quiz-score.retry{background:var(--kobg);border:1px solid var(--ko);color:var(--ko)}
.btn{background:linear-gradient(135deg,var(--orange),#c24d28);color:#fff;border:none;padding:11px 22px;border-radius:12px;font-size:14.5px;font-weight:700;cursor:pointer;transition:.2s;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,138,61,.35)}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
.btn.violet{background:linear-gradient(135deg,var(--violet),#3ba898)}
/* ---------- Prompts ---------- */
.prompt{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.prompt .p-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.prompt .p-title{font-weight:700;font-size:15px}
.prompt .p-use{font-size:12.5px;color:var(--dim)}
.prompt pre{background:#0a2620;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:12.8px;white-space:pre-wrap;color:#d9d5f5;max-height:230px;overflow:auto}
.copy-btn{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:6px 13px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;transition:.15s}
.copy-btn:hover{border-color:var(--orange);color:var(--orange2)}
.p-expected{margin-top:10px;font-size:13px;color:var(--muted);background:rgba(95,199,184,.12);border:1px solid rgba(95,199,184,.4);border-radius:10px;padding:9px 12px}
.p-expected b{color:var(--violet2)}
.safe-note{display:flex;gap:10px;background:var(--kobg);border:1px solid rgba(229,72,77,.4);border-radius:12px;padding:12px 15px;font-size:13.5px;color:#f0b9bb;margin-bottom:14px}
/* ---------- Exercices ---------- */
.step{display:flex;gap:14px;padding:13px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border:none}
.step .sn{flex:none;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--violet));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.step .sig{display:inline-block;margin-top:6px;font-size:12.5px;background:var(--okbg);border:1px solid rgba(51,201,126,.4);color:var(--ok);padding:4px 11px;border-radius:99px}
/* ---------- Activities ---------- */
.act{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:24px;margin:22px 0}
.act-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.act-h .a-ico{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,rgba(225,97,57,.32),rgba(95,199,184,.3));display:flex;align-items:center;justify-content:center;font-size:19px}
.act-h h3{font-size:18px}
.act-sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.feedback{display:none;margin-top:14px;padding:13px 16px;border-radius:12px;font-size:14px;animation:fadein .3s}
.feedback.show{display:block}
.feedback.ok{display:block;background:var(--okbg);border:1px solid var(--ok);color:#bff0d6}
.feedback.ko{display:block;background:var(--kobg);border:1px solid var(--ko);color:#f3c2c4}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:8px 15px;cursor:pointer;font-size:13.5px;transition:.15s;color:var(--txt)}
.chip:hover{border-color:var(--violet)}
.chip.sel{background:rgba(225,97,57,.2);border-color:var(--orange);color:var(--orange2)}
.chip.okc{background:var(--okbg);border-color:var(--ok)}
.chip.koc{background:var(--kobg);border-color:var(--ko)}
/* terminal */
.term{background:#0a2620;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:8px}
.term-bar{display:flex;gap:7px;align-items:center;padding:9px 13px;background:#14352f;border-bottom:1px solid var(--line)}
.term-bar i{width:11px;height:11px;border-radius:50%;display:inline-block}
.term-bar span{margin-left:8px;font-size:12px;color:var(--dim)}
.term-out{padding:14px;height:280px;overflow-y:auto;font-size:13.3px;line-height:1.65}
.term-out .cmd{color:var(--orange2)}
.term-out .okl{color:var(--ok)}
.term-out .err{color:var(--ko)}
.term-out .info{color:var(--violet2)}
.term-out .warn{color:var(--gold)}
.term-line{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:#0d2c26}
.term-line .ps{color:var(--ok);font-size:13.3px;flex:none}
.term-line input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:13.3px;font-family:inherit}
.term-side{font-size:13px;color:var(--muted)}
.term-side ul{margin:8px 0 14px 18px}
.term-side li{margin-bottom:4px}
/* sortable */
.sortable{display:flex;flex-direction:column;gap:9px;margin:10px 0}
.sort-item{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:11px;font-size:14px;cursor:grab;user-select:none}
.sort-item .ord{flex:none;width:26px;height:26px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--muted)}
.sort-item .mv{margin-left:auto;color:var(--dim);cursor:pointer;font-size:15px;padding:2px 8px}
.sort-item .mv:hover{color:var(--orange2)}
/* dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:22px}
.dash-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.dash-card:hover{transform:translateY(-4px);border-color:var(--violet);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.dash-card .dc-num{font-family:"Unbounded";font-size:13px;font-weight:800;color:var(--orange2);letter-spacing:1px}
.dash-card h3{font-size:18px;margin:6px 0 8px}
.dash-card p{font-size:13.5px;color:var(--muted)}
.dash-card .dc-foot{margin-top:14px;display:flex;align-items:center;gap:10px}
.dc-prog{flex:1;height:7px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.dc-prog>div{height:100%;background:linear-gradient(90deg,var(--orange),var(--violet));width:0%;transition:width .5s}
.dc-state{font-size:12px;font-weight:700;color:var(--dim)}
.dc-state.ok{color:var(--ok)}
.dash-hero-stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 18px;flex:1;min-width:150px}
.stat b{font-family:"Unbounded";font-size:22px;display:block;color:var(--orange2)}
.stat span{font-size:12px;color:var(--muted)}
.rulette{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:16px}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;font-size:13.5px;color:var(--muted)}
.rule b{color:var(--txt);display:block;margin-bottom:5px;font-size:14.5px}
.match-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
.match-row .m-lab{font-weight:700;font-size:14.5px;min-width:190px}
.match-row select{background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px;font-family:inherit;min-width:230px}
.final-hero{text-align:center;padding:40px 20px;border-radius:22px;background:linear-gradient(135deg,rgba(225,97,57,.2),rgba(95,199,184,.18)),var(--panel);border:1px solid var(--line)}
.big-emoji{font-size:56px}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--dim);font-size:13px;text-align:center}
.confetti{position:fixed;top:-10px;font-size:22px;animation:fall linear forwards;z-index:99;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
.tool-flex{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.mini{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13px;color:var(--muted);transition:.15s}
.mini:hover{border-color:var(--orange);color:var(--orange2)}
.vs-panel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
@media(max-width:700px){.vs-panel{grid-template-columns:1fr}}
.vs-col{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:110px}
.vs-col h5{font-size:13px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.vs-col.a h5{color:var(--orange2)}.vs-col.b h5{color:var(--violet2)}
.vs-item{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px;margin-bottom:7px;cursor:pointer;transition:.15s}
.vs-item:hover{border-color:var(--gold);color:var(--gold)}
.vs-item.placed{opacity:.45;cursor:default}

/* ---- Panneaux Expert ---- */
.exp-panel{margin:22px 0;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:24px}
.exp-panel .ep-k{display:inline-block;background:rgba(225,97,57,.18);border:1px solid rgba(225,97,57,.45);color:var(--orange2);padding:4px 14px;border-radius:99px;font-size:11.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px}
.ana-box{background:var(--bg2);border-left:3px solid var(--teal);border-radius:0 12px 12px 0;padding:13px 16px;font-size:15px;margin-bottom:12px}
.ana-box .lab{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal2);display:block;margin-bottom:4px}
.exp-box{background:linear-gradient(120deg,rgba(225,97,57,.14),rgba(95,199,184,.10));border:1px solid rgba(225,97,57,.4);border-radius:14px;padding:15px 18px;font-size:15px;margin-bottom:14px}
.exp-box .lab{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--orange2);display:block;margin-bottom:5px}
.exp-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:800px){.exp-grid2{grid-template-columns:1fr}}
.exp-col{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
.exp-col h4{font-size:14px;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.exp-col ul{list-style:none}
.exp-col li{font-size:13.5px;color:var(--muted);padding:5px 0 5px 24px;position:relative;border-bottom:1px dashed var(--line)}
.exp-col li:last-child{border:none}
.exp-col li::before{position:absolute;left:0;top:5px}
.exp-col.err li::before{content:"✗";color:var(--ko)}
.exp-col.chk li::before{content:"✓";color:var(--ok)}
.act-box{background:linear-gradient(120deg,rgba(95,199,184,.14),transparent);border:1px solid rgba(95,199,184,.4);border-radius:14px;padding:14px 17px;font-size:14.5px;margin-bottom:14px}
.act-box .lab{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal2);display:block;margin-bottom:5px}
.gloss{background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.gloss h4{font-size:14px;padding:12px 17px 8px}
.gloss .g-row{display:flex;gap:14px;padding:9px 17px;border-top:1px solid var(--line);font-size:13.5px;align-items:baseline}
.gloss .g-row b{color:var(--orange2);min-width:150px;flex:none}
.gloss .g-row span{color:var(--muted)}


/* ---- Améliorations V2 ---- */
.note-area{width:100%;min-height:110px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:13px 15px;font-size:14.5px;font-family:inherit;resize:vertical;outline:none;box-sizing:border-box}
.note-area:focus{border-color:var(--teal)}
@media print{body>*{display:none!important}#cert{display:flex!important}#certinner{-webkit-print-color-adjust:exact;print-color-adjust:exact}#certbar{display:none!important}}

</style>
</head>
<body>
<header class="top"><div class="wrap top-in">
  <div class="logo"><div class="logo-badge">🌱</div><div>Vivier IA<small>Module 4 · Sécurité IA</small></div></div>
  <div class="prog-wrap"><div class="prog"><div id="progBar"></div></div><span class="prog-txt" id="progTxt">0 / 7 sections</span></div>
</div></header>

const DATA=[{"num":"01","title":"Le cadre : RGPD et AI Act","concepts":[{"t":"Ouverture","d":"Bonjour, je suis Zézé, fondateur de Vivier IA. Un client sérieux pose presque toujours une question de conformité très tôt : où vont mes données, qui y a accès ? Dans cette section, vous verrez pourquoi il faut savoir répondre, les quatre principes du RGPD, les quatre niveaux de risque de l'AI Act, et comment les deux cadres se complètent. Attention : ce module ne remplace pas un juriste."},{"t":"Pourquoi un module réglementaire","d":"Une réponse claire et maîtrisée sur la conformité devient un argument de vente. Un client sérieux pose une question de conformité très tôt. Un client de grand compte les pose presque toujours dès le début de la conversation. Pensez-y à chaque nouveau projet : c'est un réflexe qui s'acquiert avec la pratique. Si vous ne savez pas répondre avec assurance, vous perdez en crédibilité avant même de parler de la solution technique. "},{"t":"Ce que le module couvre, et ses limites","d":"Savoir quand appeler un vrai juriste fait partie de la compétence. Des réflexes et du vocabulaire, pas un avis juridique. Il aide à intégrer la conformité dès la conception d'un projet IA. Cette distinction paraît simple, mais elle change vraiment la manière de répondre à un client. Il ne remplace pas un avis juridique sur un cas précis et sensible. C'est une base pour parler avec assurance et savoir quand appeler un vrai juri"},{"t":"Le RGPD : quatre principes","d":"Moins vous conservez de données sensibles, moins vous avez à les protéger. Il encadre le traitement des données personnelles dans l'Union européenne. Il s'applique dès qu'une donnée d'un résident européen est concernée. Relisez ce point avec un cas de votre propre activité, pour qu'il devienne concret. Collectez seulement ce qui est nécessaire, et dites à la personne ce que vous faites de sa donnée. Cette idée simple évite bea"},{"t":"L'AI Act : quatre niveaux de risque","d":"Le même outil peut changer de niveau selon l'usage. Il classe les systèmes d'IA par niveau de risque. Le niveau élevé couvre par exemple un système utilisé pour le recrutement ou pour évaluer un crédit. Ne cherchez pas à tout retenir d'un coup : revenez à ce point à chaque projet. Au niveau limité, vous devez dire que la personne parle à une IA. Au niveau minimal, peu ou pas d'obligation spécifique. Retenez-la telle quelle, sa"},{"t":"Deux cadres qui se complètent","d":"Un même projet peut relever des deux cadres à la fois. Le RGPD encadre la donnée, l'AI Act encadre le système. Le RGPD encadre la donnée personnelle utilisée, quel que soit l'outil. Vous pourrez ainsi expliquer la règle simplement à un client, sans jargon. L'AI Act encadre le système d'IA lui-même. Pensez à un exemple de votre propre activité pour vérifier que vous l'avez bien comprise. Un système de tri de CV traite des donné"},{"t":"Mode d'emploi d'un prompt","d":"Un prompt, c'est le message que vous écrivez à Claude pour lui demander quelque chose. Voici comment utiliser ceux de ce chapitre. D'abord, ouvrez Claude et démarrez une conversation neuve. Ensuite, copiez le prompt tel quel. Remplacez les mots entre crochets par vos propres informations, fictives ou non sensibles. Enfin, relisez la réponse et comparez-la avec le résultat attendu. Ne collez jamais une clé, un mot de passe ou u"}],"icon":"⚖️","sub":"RGPD et AI Act en vocabulaire simple : quatre principes, quatre niveaux de risque, et pourquoi la conformité est un argument de vente.","key":"Une réponse claire et maîtrisée sur la conformité devient un argument de vente.","cas":{"t":"La conformité qui rassure dès les premières questions","ctx":"Le contexte : Diagnostic en ligne qui enregistre l'e-mail et les réponses d'un dirigeant (à revérifier avant publication).","d1":"La réponse précise : Un visiteur écrit dans la table, mais personne ne la lit avec la clé publique. Seul un outil d'administration, avec la clé de service, pourra la lire.","d2":"La preuve : Un test réel l'a confirmé : une lecture avec la clé publique ne rend aucune ligne.","lecon":"Une réponse claire et maîtrisée sur la conformité devient un argument de vente."},"prompts":[{"t":"Comprendre les principes du RGPD","use":"Pour apprendre les quatre principes du RGPD avec des exemples simples, puis vous tester. Aide pour l'étape 1 de l'exercice.","txt":"Je suis débutant complet en intelligence artificielle et en protection des données.\nExpliquez-moi simplement les quatre principes centraux du RGPD : minimisation, information, base légale et droits de la personne (accès, correction, suppression).\nPour chaque principe, donnez une définition en une phrase et un exemple tiré de mon activité : [VOTRE ACTIVITÉ].\nExpliquez chaque terme technique en une phrase simple.\nTerminez par un petit quiz de quatre questions, une par principe, et attendez mes réponses avant de corriger.\nVous expliquez seulement : ne donnez aucun conseil juridique.","att":"Une liste claire des quatre principes (minimisation, information, base légale, droits) avec un exemple lié à votre activité. *Source : 01-le-cadre.md, l.36-40.*"},{"t":"Les niveaux de risque de l'AI Act","use":"Pour voir les quatre niveaux de risque de l'AI Act et situer un usage de votre activité. Aide pour l'étape 2 de l'exercice.","txt":"Je suis débutant et je découvre l'AI Act européen.\nExpliquez-moi les quatre niveaux de risque : inacceptable, élevé, limité, minimal. Présentez un tableau à trois colonnes : niveau, ce que cela signifie, exemple. Appuyez-vous seulement sur ces repères : l'inacceptable est interdit, le recrutement ou l'évaluation d'un crédit relèvent du risque élevé, et le risque limité impose de dire à la personne qu'elle parle à une IA.\nEnsuite, dites dans quel niveau pourrait se situer cet usage : [VOTRE USAGE DE L'IA], en précisant qu'un juriste doit confirmer.\nExpliquez chaque terme technique en une phrase simple. Aucun conseil juridique.","att":"Un tableau des quatre niveaux (inacceptable, élevé, limité, minimal) et une première idée du niveau de votre propre usage. *Source : 01-le-cadre.md, l.44-50.*"},{"t":"Tri de candidatures : RGPD et AI Act","use":"Pour justifier qu'un tri de candidatures relève des deux cadres et préparer des questions. Aide pour l'étape 4 de l'exercice.","txt":"Je suis débutant et je dois répondre à cette question : un système qui trie des candidatures est-il concerné par le RGPD, par l'AI Act, ou par les deux ?\nMa réponse et ma justification : [VOTRE RÉPONSE ET POURQUOI].\nRelisez ma justification et dites-moi ce qui est juste ou à améliorer. Expliquez en mots simples la différence : le RGPD encadre la donnée personnelle quel que soit l'outil, l'AI Act encadre le système d'IA selon son usage et son risque.\nExpliquez chaque terme technique en une phrase simple.\nTerminez par trois questions utiles à poser à un juriste. Ne donnez aucun conseil juridique.","att":"Une justification claire (donnée personnelle et risque élevé : les deux cadres) et trois questions pour un juriste. *Source : 01-le-cadre.md, l.50-55.* ## Questions de vérification **1. Pourquoi la conformité peut-elle devenir un argument de vente ?** *Corrigé :* Une réponse claire rassure dès les premières questions et différencie face aux concurrents ou solutions sans garantie. **2. Citez les quatre principes centraux du RGPD.** *Corrigé :* Minimisation, information, base légale, droits de la personne. **3. Quels sont les quatre niveaux de risque de l'AI Act ?** *Corrigé :* Inacceptable, élevé, limité, minimal. **4. Un tri de candidatures relève de quel cadre ?** *Corrigé :* Des deux : RGPD pour les données personnelles, AI Act pour le risque élevé. **5. Ce module remplace-t-il un avis juridique ?** *Corrigé :* Non : il donne des réflexes et du vocabulaire, et aide à savoir quand appeler un juriste. ## Projet [À COMPLÉTER] : le texte source ne décrit pas de projet."}],"exercice":[{"e":"Citez les quatre principes centraux du RGPD.","s":"minimisation de la collecte, information, base légale, droits de la personne (accès, rectification, suppression)."},{"e":"Quels sont les quatre niveaux de risque de l'AI Act ?","s":"inacceptable, élevé, limité, minimal."},{"e":"En quoi le RGPD et l'AI Act se complètent-ils sans se confondre ?","s":"le RGPD encadre la donnée personnelle quel que soit l'outil ; l'AI Act encadre le système d'IA selon son usage et son risque."},{"e":"Un système de tri de candidatures est-il concerné par le RGPD, l'AI Act, ou les deux ? Justifiez.","s":"les deux : données personnelles (RGPD) et système à risque élevé (AI Act)."}],"quiz":[{"q":"Pourquoi la conformité peut-elle devenir un argument de vente ?","x":"Une réponse claire rassure dès les premières questions et différencie face aux concurrents ou solutions sans garantie.","o":["Parce qu'elle rassure dès les premières questions et différencie face aux concurrents sans garantie","Parce qu'elle est obligatoire pour tout site web","Parce qu'elle remplace la qualité du produit","Parce qu'elle évite d'avoir un site web"],"c":0},{"q":"Citez les quatre principes centraux du RGPD.","x":"Minimisation, information, base légale, droits de la personne.","o":["Minimisation, information, base légale, droits de la personne","Vitesse, qualité, prix, disponibilité","Collecte maximale, consentement caché, durée illimitée, partage libre","Rouge, orange, vert, bleu"],"c":0},{"q":"Quels sont les quatre niveaux de risque de l'AI Act ?","x":"Inacceptable, élevé, limité, minimal.","o":["Inacceptable, élevé, limité, minimal","Public, interne, confidentiel, secret","Faible, moyen, fort, critique","Légal, illégal, gris, blanc"],"c":0},{"q":"Un tri de candidatures relève de quel cadre ?","x":"Des deux : RGPD pour les données personnelles, AI Act pour le risque élevé.","o":["Des deux : RGPD pour les données personnelles, AI Act pour le risque élevé","Du RGPD uniquement","De l'AI Act uniquement","D'aucun : un tri de CV n'est pas réglementé"],"c":0},{"q":"Ce module remplace-t-il un avis juridique ?","x": ,"Oui : il couvre tous les cas juridiques","Oui, si le client signe un papier","Oui, mais seulement en France"],"c":0,"x":"Non : il donne des réflexes et du vocabulaire, et aide à savoir quand appeler un juriste."}]},"ana":"Le RGPD, ce sont les règles de la maison : on y entre chez quelqu'un, on ne fouille pas ses tiroirs, on rend ce qu'on a emprunté, et on sait pourquoi on est là.","expert":"Ne fuyez pas la conformité : vendez-la. Quand un client hésite entre vous et un concurrent, « je connais les règles et je les applique » décide souvent du contrat. C'est un argument commercial, pas une corvée.","erreurs":["Croire qu'un petit projet est hors champ du RGPD","Promettre « 100% conforme » sans avis juridique","Tout bloquer par peur et ne rien livrer"],"check":["Les 4 principes RGPD cités sans hésiter","Le niveau de risque de votre application identifié","Les 4 niveaux AI Act connus","La phrase « je sais quand appeler un juriste » sincère"],"action":"Repérez dans votre offre actuelle la mention confidentialité. Si elle n'existe pas, écrivez-la aujourd'hui — c'est votre premier argument conformité.","glossaire":[["RGPD","Le règlement européen sur les données personnelles : 4 principes clés"],["AI Act","Le règlement européen sur l'IA : 4 niveaux de risque"],["Minimisation","Ne collecter que ce qui est nécessaire"],["Base légale","La justification qui autorise le traitement d'une donnée"]],"shots":[{"img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABNgAAAL4CAIAAAAmqN0nAACWsElEQVR4nOzdd3xT9f7H8W92ujcdtKVl770ECjJVUECG86rXgXtvvTiu+NPrvq6rXieiXkUBBy5EGRUE2VD26ILulY40STN+fwRjbZPTdHDStK/ng4ePNDnnez7f74n55p1zcqKIGDtcAAAAAAAgF6WvCwAAAAAAdC4EUQAAAACArAiiAAAAAABZEUQBAAAAALIiiAIAAAAAZEUQBQAAAADIiiAKAAAAAJAVQRQAAAAAICuCKAAAAABAVupWrp+QlNgmdQAAAAAA/Ehe7skWr9vCIEr+BAAAAIDOzJUKW5BIW3JqLikUAAAAAODUgoTYvCOiRFAAAAAAQAPOqOj9odFmHBElhQIAAAAAPPE+M3obREmhAAAAAABpXiZHfr4FAAAAACArr4Ioh0MBAAAAAN7wJj82HURJoQAAAAAA7zWZIjk1FwAAAAAgq+b9fEuzrKly1P9zRoiiuS1kLI6r/+fAJwua24L+3qH1/zQ9v7u5LQAAAAAA2lYT Fxx56UT9bobhl8z0KjJR0cHYc/tjwsNqYi7/ruv75Vln0tbOCA+HvviRgcd/q7tenrf7FJvIDdiRqVGNSn184//70iL7+1YwEAAEB70z4TUfmiZ00Ni40RQhz5+PPiS1lCiKuHUnw7R/SdMaX/vJmFFzKvp51pQrW7/vKWdeNsde2vRVbRjrslc9fezF17WzsKoKNrxzcZmegBAGiv/h9GBKRef+NsFAAAAABJRU5ErkJggg==","cap":"La pratique pas à pas — 4 étapes numérotées à rejouer chez vous, dans l'ordre."}]},{"num":"02","title":"Travailler en sécurité","concepts":[{"t":"Ouverture","d":"Bonjour, je suis Zézé, fondateur de Vivier IA. Toutes les données ne se valent pas. Dans cette section, vous verrez comment repérer une donnée à risque, pourquoi une clé peut être plus sensible qu'un fichier de personnes, comment cartographier les flux de données, et comment les classer en trois niveaux avant de choisir vos mesures de sécurité."},{"t":"Toutes les données ne se valent pas","d":"Une donnée à risque se juge par l'impact réel d'une fuite, pas par sa nature générale. Une donnée à risque se juge par l'impact d'une fuite. C'est une donnée dont la fuite ou le mauvais usage aurait un vrai impact sur la personne concernée. Pensez-y à chaque nouveau projet : c'est un réflexe qui s'acquiert avec la pratique. Un nom seul dans un annuaire public est peu sensible. Associé à un état de santé, une orientation ou une"},{"t":"Les catégories qui demandent plus de vigilance","d":"Réunis, des éléments anodins peuvent décrire un projet d'entreprise précis, donc confidentiel. Les données dites sensibles au sens du RGPD. La santé, l'origine, les opinions politiques ou religieuses, l'orientation sexuelle : un traitement très rigoureux. Cette distinction paraît simple, mais elle change vraiment la manière de répondre à un client. Toute donnée financière, tout identifiant unique (numéro de sécurité sociale, p"},{"t":"Parfois, la donnée sensible est une clé","d":"La donnée la plus sensible n'est pas toujours une donnée de personne : c'est parfois la clé. Parfois, c'est la clé qui ouvre toutes les autres. La clé de service d'une base de données donne accès à tout, en lecture et en écriture. Si elle fuit, tout est exposé. Relisez ce point avec un cas de votre propre activité, pour qu'il devienne concret. Elle est dans un fichier local de configuration. Le dépôt de code étant public, ce f"},{"t":"Cartographier avant de sécuriser","d":"Cette liste a permis de repérer un risque : l'écriture ouverte à tous, qui peut causer du spam. Sans cartographie, vous protégez au hasard. Quelles données entrent dans le système, d'où elles viennent, où elles sont stockées, qui y a accès, pour combien de temps. Ne cherchez pas à tout retenir d'un coup : revenez à ce point à chaque projet. Sans cette vue d'ensemble, un point faible reste invisible jusqu'à l'incident. Le dirig"},{"t":"Une classification à trois niveaux","d":"Classez d'abord : vous évitez de sur-protéger le public et de sous-protéger le sensible. Classer chaque flux avant de choisir les mesures. Peu de contraintes sont nécessaires, car la donnée est déjà accessible à tous. Contrainte modérée : la donnée ne doit pas sortir de l'organisation. Chiffrement, accès restreint, traçabilité des consultations. Une donnée à risque au sens vu plus haut. Classez d'abord : vous évitez de sur-pro"},{"t":"Appliquer la classification","d":"Les clés d'accès, les e-mails des élèves et les paiements sont confidentiels. Chaque niveau a ses mesures. Le texte de la vitrine, l'accroche et les prix affichés d'une plateforme sont publics. Gardez ce repère sous la main lors de vos premiers échanges avec un client. Les workflows n8n, les documents de cadrage et la carte des versions circulent dans l'organisation. Un récapitulatif envoyé à des distributeurs est interne : la"}],"icon":"🔐","sub":"Cartographier, classer, protéger : les données sensibles, les clés de service et la vue d'ensemble qui rend les points faibles visibles.","key":"Une donnée à risque se juge par l'impact réel d'une fuite, pas par sa nature générale.","cas":{"t":"La clé de service qui ouvre tout","ctx":"Le contexte : Plateforme Vivier IA, septembre et octobre 2026 (à revérifier avant publication).","d1":"Le risque : La clé de service de la base donne accès à tout, en lecture et en écriture. Si elle fuit, tout est exposé.","d2":"La mesure : Elle est dans un fichier local de configuration. Le dépôt de code étant public, ce fichier n'y est jamais envoyé.","lecon":"Une donnée à risque se juge par l'impact réel d'une fuite, pas par sa nature générale."},"prompts":[{"t":"Évaluer le risque de mes données","use":"Pour juger si une donnée est à risque selon l'impact réel d'une fuite, avec des exemples fictifs. Aide pour l'étape 1 de l'exercice.","txt":"Je suis débutant et je veux apprendre à repérer les données à risque.\nVoici trois exemples fictifs de données de mon activité : [DONNÉE FICTIVE UN], [DONNÉE FICTIVE DEUX], [DONNÉE FICTIVE TROIS].\nExpliquez-moi qu'une donnée à risque se juge sur l'impact réel qu'aurait une fuite pour la personne. Pour chaque exemple, dites si l'impact serait faible, moyen ou fort, et pourquoi.\nCitez ensuite trois catégories de données sensibles du RGPD (santé, origine, opinions politiques ou religieuses, orientation sexuelle : trois au choix) et rappelez que les données financières demandent aussi de la vigilance.\nExpliquez chaque terme technique en une phrase simple. Aucune vraie donnée de client, aucun conseil juridique.","att":"Une évaluation du risque de vos trois exemples fictifs et trois catégories de données sensibles expliquées simplement. *Source : 02-travailler-en-securite.md, l.5-14.*"},{"t":"Pourquoi cartographier d'abord","use":"Pour comprendre pourquoi dresser la carte des flux avant de sécuriser, avec une analogie simple. Aide pour l'étape 3 de l'exercice.","txt":"Je suis débutant en sécurité des données.\nExpliquez-moi avec une analogie de la vie quotidienne pourquoi il faut cartographier les flux de données avant de les sécuriser. Citez ce que doit lister une cartographie : les données qui entrent, leur origine, leur lieu de stockage, qui y a accès, et pour combien de temps.\nExpliquez aussi pourquoi, sans cette vue d'ensemble, un point faible peut rester invisible jusqu'à l'incident.\nProposez ensuite trois questions courtes sur mon activité : [VOTRE ACTIVITÉ], pour m'aider à préparer ma propre cartographie.\nExpliquez chaque terme technique en une phrase simple.","att":"Une explication imagée de l'utilité de cartographier avant de sécuriser, et trois questions pour préparer votre propre carte. *Source : 02-travailler-en-securite.md, l.40-49.*"},{"t":"Cartographier un flux de données","use":"Pour décrire un flux réel de votre activité et le classer en public, interne ou confidentiel. Aide pour l'étape 4 de l'exercice.","txt":"Je suis débutant. Aidez-moi à cartographier un flux de données de mon activité, avec des exemples fictifs seulement.\nOrigine de la donnée : [D'OÙ VIENT LA DONNÉE]. Stockage : [OÙ ELLE EST RANGÉE]. Accès : [QUI PEUT LA VOIR]. Durée : [COMBIEN DE TEMPS ELLE EST GARDÉE].\nSi une information manque, posez-moi d'abord vos questions.\nPuis présentez un tableau : entrée, stockage, accès, durée, classification en trois niveaux (public, interne, confidentiel). Justifiez la classification en une phrase et expliquez chaque niveau simplement.\nExpliquez chaque terme technique en une phrase simple. Aucun conseil juridique, aucune vraie donnée sensible.","att":"Un tableau complet de votre flux (origine, destination, accès) avec une classification cohérente en trois niveaux. *Source : 02-travailler-en-securite.md, l.40-57.* ## Questions de vérification **1. Sur quoi se juge le risque d'une donnée ?** *Corrigé :* Sur l'impact réel d'une fuite ou d'un mauvais usage sur la personne concernée. **2. Citez trois catégories de données sensibles du RGPD.** *Corrigé :* Santé, origine, opinions politiques ou religieuses, orientation sexuelle (trois au choix). **3. Pourquoi cartographier avant de sécuriser ?** *Corrigé :* Sans vue d'ensemble, un point faible reste invisible jusqu'à l'incident. **4. Quels sont les trois niveaux d ion, pour qu'elle ne devienne jamais un blocage de dernière minute. Dans cette section, vous verrez le principe de privacy by design, trois réflexes à installer, et trois cas réels où une protection a été écrite, ou aurait dû l'être."},{"t":"« Sans barrières », mais pas sans contrainte","d":"« Sans barrières Le titre peut prêter à confusion. Aller plus vite en laissant la conformité de côté est exactement ce que cette section ne recommande pas. Pensez-y à chaque nouveau projet : c'est un réflexe qui s'acquiert avec la pratique. Ainsi, elle ne devient jamais un blocage de dernière minute, qui retarde ou annule un déploiement déjà avancé. Gardez cette idée en tête : elle revient dans toute la suite du parcours. Pour"},{"t":"Le principe de privacy by design","d":"La protection n'a pas été ajoutée après coup : c'est du privacy by design. Penser la conformité dès le cadrage du projet. Intégrer la conformité au départ coûte beaucoup moins cher que de retravailler un système déjà construit. Cette distinction paraît simple, mais elle change vraiment la manière de répondre à un client. Le périmètre d'un brief de projet devrait inclure la classification des données concernées, vue en section "},{"t":"Minimiser et documenter","d":"Documenter les choix fait partie de la conformité : une mesure non écrite peut disparaître. Deux réflexes à installer dès le déploiement. Ne collectez et ne transmettez à un modèle d'IA que ce qui est strictement nécessaire à la tâche. Relisez ce point avec un cas de votre propre activité, pour qu'il devienne concret. Notez quelles données sont utilisées, pour quelle raison, et où elles vont. Cette idée simple évite beaucoup d"},{"t":"Prévoir les demandes des personnes","d":"Sachez dès le départ comment répondre à une demande d'accès ou de suppression. Savoir répondre avant que la demande n'arrive. Sachez dès le départ comment répondre à une demande d'accès ou de suppression. Ne cherchez pas à tout retenir d'un coup : revenez à ce point à chaque projet. Le plus mauvais moment pour chercher la procédure est celui où la demande est là. Retenez-la telle quelle, sans chercher à la compliquer, c'est ai"},{"t":"Écrire les risques dans le cadrage","d":"Les risques sont écrits avant la mise en ligne, pas découverts après. Les risques sont écrits avant la mise en ligne. Par exemple : l'écriture ouverte au public, qui peut causer du spam. Vous pourrez ainsi expliquer la règle simplement à un client, sans jargon. Une migration qui supprime trois colonnes ne s'applique qu'après vérification du contenu. Pensez à un exemple de votre propre activité pour vérifier que vous l'avez bie"},{"t":"Les trois réflexes en un coup d'œil","d":"Minimiser, documenter, prévoir : trois réflexes à installer dès le déploiement. À installer dès le déploiement. Une donnée non collectée est une donnée à ne pas protéger. Gardez ce repère sous la main lors de vos premiers échanges avec un client. Une décision écrite ne disparaît pas sans que personne le remarque. Vous pourrez la réutiliser dans vos propres projets, quel que soit l'outil du moment. La réponse aux demandes des p"}],"icon":"🚧","sub":"Intégrer la conformité dès la conception : minimiser, documenter, prévoir — pour ne jamais être bloqué au déploiement.","key":"« Sans barrières","cas":{"t":"La conformité dès le cadrage, pas après","ctx":"Le contexte : Table des diagnostics d'un cabinet de conseil IA, le 17 septembre 2026 (à revérifier avant publication).","d1":"La mesure : La table a été créée avec sa protection par ligne (RLS) déjà active.","d2":"Le résultat : Les visiteurs ont le droit d'écrire. Personne n'a le droit de lire avec la clé publique.","lecon":"« Sans barrières"},"prompts":[{"t":"Conformité dès le départ","use":"Pour comprendre que déployer sans barrières veut dire intégrer la conformité dès la conception. Aide pour l'étape 1 de l'exercice.","txt":"Je suis débutant complet et je prépare un projet avec de l'IA : [VOTRE PROJET].\nExpliquez-moi pourquoi l'expression « déployer sans barrières » ne veut pas dire ignorer la conformité, mais l'intégrer dès la conception pour qu'elle ne bloque pas un déploiement déjà avancé.\nExpliquez aussi pourquoi y penser dès le cadrage coûte beaucoup moins cher que de retravailler un système déjà construit. Utilisez une analogie simple, par exemple la construction d'une maison.\nExpliquez chaque terme technique, comme « privacy by design », en une phrase simple.\nConcluez avec deux phrases que je pourrai retenir. Ne donnez aucun conseil juridique.","att":"Une explication claire en mots simples, avec une analogie, et deux phrases à retenir sur la conformité dès la conception. *Source : 03-deployer-sans-barrieres.md, l.5-12.*"},{"t":"Mes trois réflexes de conformité","use":"Pour appliquer les trois réflexes (minimiser, documenter, prévoir les demandes) à votre projet. Aide pour l'étape 3 de l'exercice.","txt":"Je suis débutant. Mon projet avec de l'IA : [VOTRE PROJET]. Les données que j'imagine utiliser (exemples fictifs) : [VOS DONNÉES FICTIVES].\nAidez-moi à appliquer trois réflexes :\npremier, minimiser : ne garder et ne transmettre à l'IA que le strict nécessaire ;\ndeuxième, documenter : quelles données, pourquoi, où elles vont ;\ntroisième, prévoir comment répondre à une demande d'accès ou de suppression d'une personne.\nPour chaque réflexe, posez-moi une question puis proposez une action concrète et simple.\nExpliquez chaque terme technique en une phrase simple. Aucun conseil juridique : listez plutôt deux questions à poser à un juriste.","att":"Une courte fiche avec une action concrète pour chacun des trois réflexes, adaptée à votre projet. *Source : 03-deployer-sans-barrieres.md, l.13-17.*"},{"t":"Classification dans le brief","use":"Pour rattacher la classification des données à la bonne partie d'un brief de projet. Aide pour l'étape 4 de l'exercice.","txt":"Je suis débutant. Un brief de projet IA suit un gabarit à quatre éléments : contexte, objectif, périmètre, autonomie.\nMon projet : [VOTRE PROJET].\nDites-moi à quel élément je dois rattacher la classification des données (public, interne, confidentiel) et pourquoi, sachant que le périmètre délimite quelles données et quels cas sont couverts.\nRédigez ensuite un brief court en quatre parties pour mon projet, avec une ligne sur la classification des données et une ligne sur les risques écrits avant la mise en ligne.\nExpliquez chaque terme technique en une phrase simple. Remplacez toute information sensible par un exemple fictif. Aucun conseil juridique.","att":"Une réponse claire (le périmètre) et un brief court en quatre parties incluant la classification des données. *Source : 03-deployer-sans-barrieres.md, l.11, l.31-32, l.52-55.* ## Questions de vérification **1. Que veut dire « déployer sans barrières » ?** *Corrigé :* Intégrer la conformité dès la conception pour qu'elle ne bloque jamais un déploiement avancé. **2. Pourquoi intégrer la conformité dès le cadrage coûte-t-il moins cher ?** *Corrigé :* Retravailler un système déjà construit coûte beaucoup plus cher. **3. Quels sont les trois réflexes à installer ?** *Corrigé :* Minimiser, documenter les choix, prévoir la réponse aux demandes d'accès ou de suppression. **4. À quel élément du gabarit rattacher la classification des données ?** *Corrigé :* Au périmètre. **5. Pourquoi documenter une protection ?** *Corrigé :* Une mesure non écrite peut disparaître sans que personne le remarque. ## Projet [À COMPLÉTER] : le texte source ne décrit pas de projet."}],"exercice":[{"e":"Pourquoi « déployer sans barrières » ne veut-il pas dire « ignorer la conformité » ?","s":"cela veut dire l'intégrer dès la conception pour qu'elle ne bloque jamais un déploiement avancé."},{"e":"Pourquoi intégrer la conformité dès le cadrage coûte-t-il moins cher ?","s":"retravailler un système déjà construit coûte beaucoup plus cher que de l'intégrer dès le départ."},{"e":"Citez les trois réflexes de bonnes pratiques.","s":"minimiser dès la conception, documenter les choix, pr 04bW9tr5+NP//iLEKJCrY7f/LtFo2zh9vznXUsOZ3ROo26ZbefkmHvpsqbZxd93DQrv2Hni2Eux+wvTMpjxhmpZ82vNs9+ImbTwpKBVkr+KjLb0aN9O8yLvUrLm7oMdL/3H9MisD584ADDB/wNQ8AnDlsVCYwAAAABJRU5ErkJggg==","cap":"La pratique pas à pas — 4 étapes numérotées à rejouer chez vous, dans l'ordre."}]},{"num":"04","title":"Ateliers pratiques","concepts":[{"t":"Ouverture","d":"Bonjour, je suis Zézé, fondateur de Vivier IA. Dernière section du module 4 : cinq ateliers pour appliquer la conformité. Vous verrez comment vérifier la politique d'un fournisseur d'IA, nettoyer les données avant de les envoyer à un modèle, traiter des CV sans biais, sécuriser une clé d'accès, et extraire une information d'une image puis supprimer l'image."},{"t":"Atelier 1 : paramétrer les LLM","d":"On ne choisit pas un fournisseur sur une impression, surtout si des données sont en jeu. Vérifier avant tout usage professionnel d'un fournisseur d'IA. Chaque fournisseur a sa politique sur l'usage des données envoyées. Certains n'entraînent jamais leurs modèles sur les données de l'API par défaut, d'autres selon l'offre, gratuite ou professionnelle. Pensez-y à chaque nouveau projet : c'est un réflexe qui s'acquiert avec la pr"},{"t":"Atelier 2 : nettoyer la donnée","d":"Un champ vide vaut mieux qu'un champ inventé : la règle protège la personne et la qualité. Retirer ou masquer ce qui identifie et n'est pas nécessaire. Avant l'envoi à un modèle, retirez les informations qui identifient une personne et ne sont pas strictement nécessaires. Cette distinction paraît simple, mais elle change vraiment la manière de répondre à un client. Un nom réel devient « Client A Remplacez les champs identifian"},{"t":"Atelier 3 : traiter des CV sans biais","d":"Ces éléments ne doivent jamais entrer dans les critères de tri automatique. La solution du Module 3, vue sous l'angle de la conformité. Quelles données du CV peuvent être traitées, lesquelles doivent être ignorées ou masquées, comment documenter les critères de tri. Relisez ce point avec un cas de votre propre activité, pour qu'il devienne concret. Une photo (biais d'apparence), une date de naissance précise (biais d'âge), une"},{"t":"Atelier 4 : sécuriser un LLM en cloud","d":"Une clé adaptée à l'usage limite les dégâts si elle est volée. Trois couches de sécurité à vérifier. Jamais une clé partagée entre plusieurs usages, comme pour les credentials n8n. Ne cherchez pas à tout retenir d'un coup : revenez à ce point à chaque projet. Pas dans un fichier de code ni dans un message : en variable d'environnement, ou dans un gestionnaire de credentials dédié. Retenez-la telle quelle, sans chercher à la co"},{"t":"Atelier 5 : extraire d'une image","d":"Une donnée sans durée de conservation reste indéfiniment. Extraire l'information utile, puis supprimer l'image. Sur un justificatif, ne gardez que le champ utile, par exemple la date d'expiration. Conserver toutes les images « au cas où Une obligation légale ou un litige potentiel peut l'exiger : stockez l'image séparément, avec une durée définie à l'avance. Pensez à un exemple de votre propre activité pour vérifier que vous l"},{"t":"Mode d'emploi d'un prompt","d":"Un prompt, c'est le message que vous écrivez à Claude pour lui demander quelque chose. Voici comment utiliser ceux de ce chapitre. D'abord, ouvrez Claude et démarrez une conversation neuve. Ensuite, copiez le prompt tel quel. Remplacez les mots entre crochets par vos propres informations, fictives ou non sensibles. Enfin, relisez la réponse et comparez-la avec le résultat attendu. Ne collez jamais une clé, un mot de passe ou u"}],"icon":"🛠️","sub":"Quatre ateliers guidés : politique de rétention du fournisseur, anonymisation par substitution, tri de CV conforme, sécurité LLM cloud.","key":"On ne choisit pas un fournisseur sur une impression, surtout si des données sont en jeu.","cas":{"t":"La politique de rétention du fournisseur","ctx":"Le contexte : Outil de prospection du fondateur, septembre et octobre 2026 (à revérifier avant publication).","d1":"La donnée : Les noms de personnes qui commentent sont des données personnelles.","d2":"Ce que dit le document de l'outil : Il faut les mentionner dans la politique de confidentialité et purger les anciennes notifications.","lecon":"On ne choisit pas un fournisseur sur une impression, surtout si des données sont en jeu."},"prompts":[{"t":"Anonymiser un texte fictif","use":"Pour s'exercer à l'anonymisation par substitution avant un envoi à une IA. Aide pour l'étape 1 de l'exercice.","txt":"Je suis débutant et je veux comprendre l'anonymisation par substitution.\nVoici un court texte entièrement fictif, avec des noms inventés : [TEXTE FICTIF AVEC DES NOMS INVENTÉS].\nRemplacez chaque nom par un identifiant générique (Client A, Client B…) et chaque adresse précise par une zone géographique large. Donnez la table de correspondance dans un bloc séparé.\nExpliquez ensuite comment remettre les vraies informations seulement à la fin, dans une étape isolée avec accès restreint, et pourquoi le traitement par l'IA est l'étape la plus exposée.\nExpliquez chaque terme technique en une phrase simple. N'utilisez jamais de vraies données de clients.","att":"Le texte fictif anonymisé, une table de correspondance séparée et l'explication du remplacement en fin de processus. *Source : 04-ateliers-pratiques.md, l.46-48, l.52-55.*"},{"t":"Critères de tri de CV conformes","use":"Pour relire vos critères de tri de candidatures et écarter ceux qui créent des biais. Aide pour l'étape 2 de l'exercice.","txt":"Je suis débutant et je prépare un tri de candidatures avec une IA.\nVoici les critères que je pense utiliser : [VOS CRITÈRES DE TRI].\nRelisez-les. Dites lesquels sont pertinents (compétences, expérience, disponibilité) et lesquels doivent être exclus, comme la photo, la date de naissance précise, ou une mention d'origine ou de situation familiale sans rapport avec le poste. Expliquez en une phrase le biais de chaque exclusion.\nRédigez ensuite un modèle de note pour documenter chaque critère : date, raison, personne qui l'a relu.\nExpliquez chaque terme technique en une phrase simple. Aucun conseil juridique : ajoutez deux questions pour un juriste.","att":"Vos critères triés (gardés ou exclus), les champs à exclure expliqués et un modèle de note pour justifier un tri. *Source : 04-ateliers-pratiques.md, l.84-93, l.97.*"},{"t":"Liste de contrôle sécurité cloud","use":"Pour vérifier les trois couches de sécurité d'une IA en ligne, sans jamais montrer de clé. Aide pour l'étape 3 de l'exercice.","txt":"Je suis débutant. Je dois vérifier la sécurité d'un projet qui utilise une IA en ligne : [VOTRE PROJET].\nCréez une liste de contrôle à cocher avec une question pour chacune des trois couches : authentification (une clé dédiée par projet, jamais partagée), stockage (jamais en clair dans un fichier de code ou un message, plutôt dans une variable d'environnement ou un gestionnaire dédié), accès (qui peut consulter ou modifier les identifiants). Ajoutez le rappel de révoquer une clé qui ne sert plus.\nExpliquez « clé API » et « variable d'environnement » en une phrase simple.\nJe ne collerai jamais de vraie clé ici : je décrirai seulement où elle se trouve.","att":"Une liste de contrôle en trois couches (authentification, stockage, accès) et deux termes techniques expliqués simplement. *Source : 04-ateliers-pratiques.md, l.108-112, l.120-123.* ## Questions de vérification **1. Pourquoi vérifier la politique de rétention d'un fournisseur est-il non négociable ?** *Corrigé :* Envoyer des données client à un modèle qui les entraîne ou les conserve serait une violation difficile à rattraper. **2. Comment fonctionne l'anonymisation par substitution ?** *Corrigé :* Remplacer l'identifiant avant l'envoi, puis remapper vers la vraie identité après, dans une étape isolée. **3. Citez trois champs à exclure d'un tri de CV automatique.** *Corrigé :* Photo, date de naissance précise, mention d'origine ou de situation familiale non pertinente. **4. Quelles sont les trois couches de sécurité d'un LLM en cloud ?** *Corrigé :* Authentification dédiée par projet, stockage jamais en clair, accès restreint aux identifiants. **5. Que faire après extraction d'une information d'une image ?** *Corrigé :* Supprimer le document source, sauf raison de conservation avec accès restreint et durée définie. ## Projet [À COMPLÉTER] : le texte source ne décrit pas de projet distinct. Il propose d'appliquer un atelier à un projet réel (question 6)."}],"exercice":[{"e":"Expliquez l'anonymisation par substitution.","s":"remplacer une donnée identifiante par un identifiant générique avant l'envoi, puis remapper vers la vraie identité après, dans une étape isolée."},{"e":"Citez trois champs à exclure d'un pipeline de tri de CV automatique.","s":"photo, date de naissance précise, mention d'origine ou de situation familiale non pertinente (trois au choix)."},{"e":"Citez les trois couches de sécurité à vérifier pour un LLM en cloud.","s":"authentification dédiée par projet, stockage jamais en clair, accès restreint aux identifiants."},{"e":"Quel principe appliquer après extraction d'une information depuis une image ?","s":"extraire l'information nécessaire puis supprimer le document source, sauf raison précise de conservation."}],"quiz":[{"q":"Pourquoi vérifier la politique de rétention d'un fournisseur est-il non négociable ?","x":"Envoyer des données client à un modèle qui les entraîne ou les conserve serait une violation difficile à rattraper.","o":["Envoyer des données client à un modèle qui les entraîne ou les conserve serait une violation difficile à rattraper","C'est une formalité sans importance","Les fournisseurs suppriment toujours tout immédiatement","La politique de rétention n'existe pas"],"c":0},{"q":"Comment fonctionne l'anonymisation par substitution ?","x":"Remplacer l'identifiant avant l'envoi, puis remapper vers la vraie identité après, dans une étape isolée.","o":["Remplacer l'identifiant avant l'envoi, puis remapper vers la vraie iden  let h='<div class="sec-head"><div class="sec-num">📊</div><div><h2>Statistiques de progression</h2><div class="sub">Vue de cet appareil. L\u2019élève peut exporter ses données (JSON) et vous les transmettre pour votre suivi pédagogique.</div></div></div>';

 h+='<div class="dash-hero-stats"><div class="stat"><b>'+done+'/'+DATA.length+'</b><span>sections validées</span></div><div class="stat"><b>'+(state.final===null?"—":state.final+"/10")+'</b><span>évaluation finale</span></div><div class="stat"><b>'+Object.keys(state.stats||{}).length+'</b><span>questions suivies</span></div></div>';
 h+='<div class="card" style="margin-top:18px"><h3><span class="ico">🎯</span>Questions les plus difficiles (taux d\u2019échec)</h3>';
 const rows=[];
 DATA.forEach(s=>(s.quiz||[]).forEach((q,i)=>{const st=state.stats&&state.stats[s.num+"_"+i];if(st&&st.a>0)rows.push({sec:s.title,q:q.q,a:st.a,f:st.f,rate:st.f/st.a});}));
 rows.sort((x,y)=>y.rate-x.rate);
 if(!rows.length)h+='<p style="color:var(--muted);font-size:14px">Pas encore de données — les statistiques apparaissent après les premiers quiz.</p>';
 rows.slice(0,8).forEach(r=>{h+='<div style="margin-bottom:12px"><div style="font-size:13.5px;margin-bottom:4px"><b style="color:var(--orange2)">'+Math.round(r.rate*100)+'% d\u2019échec</b> · '+r.q.slice(0,70)+' <span style="color:var(--dim)">('+r.sec+', '+r.a+' tentative'+(r.a>1?'s':'')+')</span></div><div style="height:8px;background:var(--bg2);border-radius:99px;overflow:hidden"><div style="height:100%;width:'+Math.round(r.rate*100)+'%;background:linear-gradient(90deg,var(--orange),var(--ko))"></div></div></div>';});
 h+='</div><div style="display:flex;gap:12px;margin-top:18px;flex-wrap:wrap"><button class="btn" onclick="exportProgress()">📤 Exporter ma progression (JSON)</button><button class="btn ghost" onclick="show(\'accueil\')">🏠 Retour</button></div>';
 return h}

 const d=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
 const c=document.createElement("div");c.id="cert";
 c.style.cssText="position:fixed;inset:0;z-index:1001;background:#fdfbf7;color:#113832;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Georgia,serif";
 c.innerHTML='<div id="certinner" style="max-width:820px;width:100%;border:6px double #113832;border-radius:8px;padding:44px 50px;text-align:center;position:relative;background:radial-gradient(circle at 50% -20%,rgba(95,199,184,.18),transparent 60%),#fdfbf7">'
 +'<div style="font-size:15px;letter-spacing:4px;color:#e16139;font-weight:700">🌱 VIVIER IA</div>'
 +'<div style="font-size:12px;color:#3d635d;margin-bottom:26px">Le vivier des talents IA francophones</div>'
 +'<div style="font-size:34px;font-weight:800;margin-bottom:6px">Certificat de réussite</div>'
 +'<div style="font-size:15px;color:#3d635d;margin-bottom:26px">'+MODULE_TITLE+'</div>'
 +'<div style="font-size:16px;color:#3d635d">Nous attestons que</div>'
 +'<div style="font-size:30px;font-weight:800;color:#113832;margin:10px 0;border-bottom:2px solid #e16139;display:inline-block;padding:0 30px 6px">'+name+'</div>'
 +'<div style="font-size:15px;color:#3d635d;margin-bottom:22px">a validé la formation avec succès — score final : <b style="color:#e16139">'+score+'/10</b></div>'
 +'<div style="display:flex;justify-content:space-between;margin-top:44px;font-size:13px;color:#3d635d"><div>Fait le '+d+'</div><div style="text-align:center">Zézé Bilivogui<br><span style="font-size:11px">Fondateur de Vivier IA</span></div></div>'
 +'</div>';
 document.body.appendChild(c);
 const bar=document.createElement("div");bar.id="certbar";bar.style.cssText="position:fixed;bottom:18px;left:0;right:0;text-align:center;z-index:1002";
 bar.innerHTML='<button class="btn" id="certprint" style="margin-right:10px">🖨️ Imprimer / Enregistrer en PDF</button><button class="btn ghost" id="certclose">Fermer</button>';
 document.body.appendChild(bar);
 bar.querySelector("#certprint").onclick=()=>window.print();
 bar.querySelector("#certclose").onclick=()=>{c.remove();bar.remove();};
}

/* ================= MOTEUR ================= */
const LS="vivierIA_m4_v3";
let _mem='{"done":{},"final":null}';
let state;
try{state=JSON.parse(localStorage.getItem(LS)||_mem)}catch(e){state=JSON.parse(_mem)}
function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function copyText(btn,txt){navigator.clipboard.writeText(txt).then(()=>{btn.textContent="✓ Copié !";setTimeout(()=>btn.textContent="📋 Copier",1600)})}
function progUpdate(){const n=Object.keys(state.done).length;$("#progBar").style.width=(n/DATA.length*100)+"%";$("#progTxt").textContent=n+" / "+DATA.length+" sections";document.querySelectorAll(".tab").forEach((t,i)=>{if(i>0&&state.done[DATA[i-1].num])t.classList.add("done")});document.querySelectorAll(".dc-prog>div").forEach((d,i)=>{d.style.width=(state.done[DATA[i].num]?100:0)+"%"});document.querySelectorAll(".dc-state").forEach((d,i)=>{if(state.done[DATA[i].num]){d.textContent="✓ Terminé";d.classList.add("ok")}else{d.textContent="À faire";d.classList.remove("ok")}})}

/* ---- Construction des onglets ---- */
const TABS=[{id:"accueil",label:"🏠 Accueil"}].concat(DATA.map(d=>({id:"s"+d.num,label:d.icon+" "+d.num}))).concat([{id:"stats",label:"📊 Stats"},{id:"final",label:"🏆 Évaluation finale"}]);
$("#tabs").innerHTML=TABS.map((t,i)=>`<div class="tab" data-v="${t.id}" data-i="${i}"><span class="dot">${i===0?"🏠":t.id==="final"?"🏆":t.id==="stats"?"📊":DATA[i-1].num}</span>${t.label}</div>`).join("");
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>show(t.dataset.v));

const RULES=[
 ["⚖️","La conformité est un argument de vente","Une réponse claire rassure dès les premières questions."],
 ["🔍","On juge le risque d'une donnée sur son impact réel","Pas sur sa taille : santé, origine, clés de service."],
 ["🗺️","Cartographier avant de sécuriser","Sans vue d'ensemble, un point faible reste invisible jusqu'à l'incident."],
 ["🧱","Intégrer la conformité dès la conception","Retravailler un système construit coûte beaucoup plus cher."],
 ["✍️","Documenter chaque protection","Une mesure non écrite peut disparaître sans que personne le remarque."],
 ["🔑","La clé de service ouvre tout","Si elle fuit, tout est exposé : elle est une donnée très sensible."],
 ["📋","Le module donne des réflexes, pas un avis juridique","Il aide à savoir quand appeler un juriste."]
];

/* ---- Vues ---- */
function show(id){
 document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===id));
 const m=$("#main");m.innerHTML="";const v=document.createElement("div");v.className="view on";
 if(id==="accueil")v.innerHTML=accueilHTML();
 else if(id==="stats")v.innerHTML=statsHTML();
 else if(id==="final")v.innerHTML=finalHTML(),initFinal(v);
 else{const s=DATA.find(d=>"s"+d.num===id);v.innerHTML=sectionHTML(s);initSection(v,s)}
 m.appendChild(v);window.scrollTo({top:0});
}
function accueilHTML(){
 const n=Object.keys(state.done).length;
 return `<div class="hero">
  <span class="kicker">Formation interactive · 7 sections · cas réels d'octobre 2026</span>
  <h1>Sécurité et conformité IA, sans jargon</h1>
  <p>Bienvenue dans le module 4 de Vivier IA, en version pratique et interactive. Chaque section combine : les concepts clés à découvrir au clic, un cas réel, un atelier interactif, un quiz de validation, les prompts prêts à copier-coller et l'exercice sur votre propre projet. Votre progression est sauvegardée dans ce navigateur.</p>
  <div class="dash-hero-stats">
   <div class="stat"><b>${n}/${DATA.length}</b><span>sections validées</span></div>
   <div class="stat"><b>12</b><span>prompts à copier</span></div>
   <div class="stat"><b>20</b><span>questions de quiz</span></div>
   <div class="stat"><b>4</b><span>ateliers interactifs</span></div>
  </div></div>
 <div class="hintline" style="margin-top:22px">🖱️ Cliquez sur une section pour commencer — les concepts se révèlent un par un, comme dans la vidéo.</div>
 <div class="dash-grid">${DATA.map(d=>`<div class="dash-card" onclick="show('s${d.num}')">
   <div class="dc-num">SECTION ${d.num}</div><h3>${d.icon} ${d.title}</h3><p>${d.sub}</p>
   <div class="dc-foot"><div class="dc-prog"><div></div></div><span class="dc-state">À faire</span></div></div>`).join("")}
 </div>
 <div class="card" style="margin-top:24px"><h3><span class="ico">📜</span>Les 7 règles d'or du module</h3>
  <div class="rulette">${RULES.map(r=>`<div class="rule"><b>${r[0]} ${r[1]}</b>${r[2]}</div>`).join("")}</div>
  <div class="safe-note" style="margin-top:16px">🛡️ <div><strong>Règle de sécurité permanente :</strong> ne montrez jamais de vraie clé, mot de passe ou donnée de client. Travaillez sur vos propres projets, en local ou en test — jamais en production. Et aucune vraie musique ou donnée bancaire dans vos démonstrations.</div></div>
 </div>`;
}
function sectionHTML(s){
 return `<div class="sec-head"><div class="sec-num">${s.num}</div><div><h2>${s.icon} ${s.title}</h2><div class="sub">${s.sub}</div></div></div>
 <div class="grid2"><div>
  <div class="card"><h3><span class="ico">💡</span>Les concepts clés</h3>
   <div class="hintline">▶ Cliquez sur chaque concept pour le révéler (comme les diapositives animées).</div>
   ${s.concepts.map((c,i)=>`<div class="concept card" style="padding:14px 16px;margin-bottom:9px"><div class="c-t">${c.t}<span class="plus">+</span></div><div class="c-body">${c.d}</div></div>`).join("")}
  </div>
  <div class="key-banner"><span class="kb-ico">🔑</span><div><div class="kb-l">À retenir</div><p>${s.key}</p></div></div>
  <div class="flip"><div class="flip-in">
   <div class="flip-face flip-front"><span class="tag">📂 Cas réel</span><h4>${s.cas.t}</h4><p><strong>${s.cas.ctx}</strong></p><p>${s.cas.d1}</p><span class="cta">👉 Cliquez pour découvrir la suite et la leçon</span></div>
   <div class="flip-face flip-back"><span class="tag">🎓 La leçon</span><p>${s.cas.d2}</p><p style="color:var(--txt);font-weight:600">${s.cas.lecon}</p></div>
  </div></div>
 </div><div>
  <div class="card"><h3><span class="ico">🏋️</span>À vous de pratiquer</h3>
   ${s.exercice.map((e,i)=>`<div class="step"><div class="sn">${i+1}</div><div>${e.e}<br><span class="sig">✓ Signal de réussite : ${e.s}</span></div></div>`).join("")}
  </div>
  <div class="card" style="margin-top:16px"><h3><span class="ico">🧪</span>Quiz de validation</h3><div id="quiz-${s.num}"></div><div class="quiz-score" id="qs-${s.num}"></div></div>
 </div></div>
 ${notesHTML(s)}<div class="act"><div class="act-h"><div class="a-ico">${s.act.icon||"🧰"}</div><h3>${s.act.title}</h3></div><div class="act-sub">${s.act.sub}</div><div id="act-${s.num}"></div></div>
 <div class="card"><h3><span class="ico">📋</span>Prompts prêts à copier</h3>
  <div class="safe-note">🛡️ <div>Mode d'emploi : 1) ouvrez Claude et démarrez une conversation neuve ; 2) copiez le prompt et remplacez les <strong>[crochets]</strong> par vos informations fictives ou non sensibles ; 3) relisez la réponse et comparez-la au résultat attendu. <strong>Ne collez jamais une vraie clé, un mot de passe ou une donnée de client.</strong></div></div>
  ${s.prompts.map((p,i)=>`<div class="prompt"><div class="p-head"><span class="p-title">${i+1}. ${p.t}</span><span class="p-use">— ${p.use}</span><button class="copy-btn">📋 Copier</button></div><pre>${esc(p.txt)}</pre><div class="p-expected"><b>Résultat attendu :</b> ${p.att}</div></div>`).join("")}
 </div>
 ${expertHTML(s)}<div style="display:flex;gap:12px;margin-top:24px;flex-wrap:wrap"><button class="btn violet" onclick="show('accueil')">🏠 Retour à l'accueil</button>${DATA.findIndex(d=>d.num===s.num)<DATA.length-1?`<button class="btn" onclick="show('s${DATA[DATA.findIndex(d=>d.num===s.num)+1].num}')">Section suivante →</button>`:`<button class="btn" onclick="show('final')">🏆 Aller à l'évaluation finale →</button>`}</div>`;
}
function initSection(v,s){
 v.querySelector(".flip").onclick=e=>e.currentTarget.classList.toggle("flipped");
 v.querySelectorAll(".concept").forEach(c=>c.onclick=()=>c.classList.toggle("open"));
 initNotes(v,s);
 v.querySelectorAll(".copy-btn").forEach(b=>b.onclick=()=>copyText(b,b.closest(".prompt").querySelector("pre").textContent));
 initQuiz(v,s);initAct(v,s);
}
/* ---- Quiz ---- */
function initQuiz(v,s){
 const box=v.querySelector("#quiz-"+s.num),sc=v.querySelector("#qs-"+s.num);
 box.innerHTML=s.quiz.map((q,i)=>`<div class="quiz-q"><div class="qq"><span class="qn">${i+1}</span>${q.q}</div>${q.o.map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${o}</button>`).join("")}<div class="q-expl" id="ex-${s.num}-${i}">💡 ${q.x}</div></div>`).join("")+`<button class="btn" id="qb-${s.num}" style="display:none">Valider ma note</button>`;
 const answers={};let locked=false;
 box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  if(locked)return;const i=+b.dataset.q;answers[i]=+b.dataset.j;
  box.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>x.classList.remove("good","bad"));
  b.classList.add("good");
  box.querySelector("#ex-"+s.num+"-"+i).classList.add("show");
  if(Object.keys(answers).length===s.quiz.length){const btn=box.querySelector("#qb-"+s.num);btn.style.display="inline-block";btn.onclick=()=>{
   locked=true;let n=0;s.quiz.forEach((q,i)=>{if(answers[i]===q.c)n++;recordStat(s.num,i,answers[i]===q.c);box.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>{x.disabled=true;if(+x.dataset.j===q.c)x.classList.add("good");else if(answers[i]===+x.dataset.j)x.classList.add("bad")})});
   const win=n>=4;sc.className="quiz-score show "+(win?"win":"retry");
   sc.innerHTML=win?`🎉 Score : ${n}/5 — Section validée ! ${n===5?"Score parfait, bravo.":"Relisez la question ratée pour viser le 5/5."}`:`Score : ${n}/5 — Il faut 4/5 pour valider. Relisez les explications et réessayez.`;
   if(win){state.done[s.num]=true;save();progUpdate()}
  }}
 });
}
/* ---- Ateliers interactifs (atelier générique piloté par les données) ---- */
function initAct(v,s){ actSteps(v.querySelector("#act-"+s.num), s.act.steps); }
function actSteps(box,steps){
 let i=0,score=0;box.innerHTML='<div id="gz"></div>';const z=box.querySelector("#gz");
 function step(){if(i>=steps.length){z.innerHTML=`<div class="final-hero"><div class="big-emoji">${score>=steps.length-1?"🏆":"📝"}</div><h3>Score : ${score}/${steps.length}</h3><p style="color:var(--muted);margin-top:8px">${score>=steps.length-1?"Beau réflexe : la conformité est devenue un réflexe, pas une barrière.":"Relisez les explications, puis retentez : chaque situation est tirée du cours."}</p></div>`;return}
  const S=steps[i];z.innerHTML=`<div class="hintline">Situation ${i+1}/${steps.length}</div><div class="card" style="background:var(--bg2)"><strong>${S.q}</strong><br><br>${S.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}<div class="feedback" id="gfb"></div></div>`;
  z.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const win=+b.dataset.j===S.c;if(win)score++;z.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.j===S.c)x.classList.add("good");else if(x===b)x.classList.add("bad")});
   const fb=z.querySelector("#gfb");fb.className="feedback show "+(win?"ok":"ko");fb.innerHTML=(win?"✅ ":"⚠️ ")+S.x;setTimeout(()=>{i++;step()},2400)})}
 step();
}
/* ---- Évaluation finale ---- */
function finalHTML(){
 const n=Object.keys(state.done).length;
 return `<div class="sec-head"><div class="sec-num">🏆</div><div><h2>Évaluation finale du module</h2><div class="sub">10 questions mélangées tirées des 7 sections. 8 bonnes réponses pour valider le module. ${state.final!==null?`<strong style="color:var(--orange2)">Dernière tentative : ${state.final}/10</strong>`:""}</div></div></div>
 ${n<7?`<div class="safe-note">📌 <div>Vous avez validé ${n}/7 sections. L'évaluation est disponible à tout moment, mais les sections non validées comptent aussi pour finir le module.</div></div>`:""}
 ${state.final>=8?'<div class="card" style="margin-bottom:16px;border-color:var(--gold)"><h3><span class="ico">🎓</span>Votre certificat est prêt</h3><p style="color:var(--muted);font-size:14px;margin-bottom:12px">Score final : <b style="color:var(--gold)">'+(state.final)+'/10</b> — générez votre certificat nominatif, imprimable ou enregistrable en PDF.</p><button class="btn" onclick="showCertPrompt(state.final)">🎓 Générer mon certificat</button></div>':''}<div class="card" id="finalbox"></div>`;
}
function initFinal(v){
 const box=v.querySelector("#finalbox");
 box.innerHTML=FINAL.map((q,i)=>`<div class="quiz-q"><div class="qq"><span class="qn">${i+1}</span>${q.q} <span style="color:var(--dim);font-size:12px">(section ${q.s})</span></div>${q.o.map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${o}</button>`).join("")}<div class="q-expl" id="fx-${i}"></div></div>`).join("")+`<button class="btn" id="fgo" style="display:none;margin-top:6px">Valider l'évaluation</button><div class="quiz-score" id="fres"></div>`;
 const ans={};let locked=false;
 box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(locked)return;const i=+b.dataset.q;ans[i]=+b.dataset.j;box.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>x.classList.remove("good","bad"));b.classList.add("good");
  if(Object.keys(ans).length===FINAL.length){const g=box.querySelector("#fgo");g.style.display="inline-block";g.onclick=()=>{
   locked=true;let n=0;FINAL.forEach((q,i)=>{if(ans[i]===q.c)n++;box.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>{x.disabled=true;if(+x.dataset.j===q.c)x.classList.add("good");else if(ans[i]===+x.dataset.j)x.classList.add("bad")});const ex=box.querySelector("#fx-"+i);ex.textContent="💡 Réponse liée à la section "+q.s+" — voir la section correspondante pour réviser.";ex.classList.add("show")});
   state.final=n;save();const r=box.querySelector("#fres");const win=n>=8;r.className="quiz-score show "+(win?"win":"retry");
   r.innerHTML=win?`🏆 ${n}/10 — Module validé ! Vous avez terminé les quatre modules de la formation Vivier IA. Félicitations ! Idée centrale à emporter : on apprend à diriger un agent qui code, en cadrant, en vérifiant et en choisissant les outils selon le besoin plutôt que par habitude.`:`${n}/10 — Il faut 8/10. Les questions ratées sont signalées avec leur section : retournez y jeter un œil, puis recommencez.`;
   if(win){setTimeout(()=>showCertPrompt(n),1200);const em=["🎉","🌟","🚀","🎊","🏆","💜","🧡"];for(let k=0;k<40;k++){const c=document.createElement("div");c.className="confetti";c.textContent=em[k%em.length];c.style.left=Math.random()*100+"vw";c.style.animationDuration=(2+Math.random()*2)+"s";c.style.animationDelay=(Math.random()*1.2)+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),5000)}}}}});
}
/* ---- Init ---- */
progUpdate();show("accueil");

</script>
</body>
</html>
