<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivier IA — Module 5 interactif : Prospection et Lemlist</title>
<style>
:root{
  --bg:#113832; --bg2:#163e37; --panel:#1d4a43; --panel2:#2b554e;
  --line:#3d635d; --txt:#ffffff; --muted:#bcd8d2; --dim:#8fb5ad;
  --orange:#e16139; --orange2:#ec987e; --violet:#5fc7b8; --violet2:#8fe0d3;
  --ok:#33c97e; --okbg:rgba(51,201,126,.12); --ko:#e5484d; --kobg:rgba(229,72,77,.12);
  --gold:#ffd166;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(95,199,184,.14),transparent),radial-gradient(900px 500px at -10% 10%,rgba(225,97,57,.10),transparent),var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.6;min-height:100vh}
h1,h2,h3,h4{font-family:"Unbounded","Segoe UI",system-ui,sans-serif;line-height:1.25}
code,pre,.mono{font-family:"Cascadia Code","Fira Code",Consolas,monospace}
a{color:var(--violet2)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* ---------- Header ---------- */
header.top{position:sticky;top:0;z-index:50;background:rgba(17,56,50,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding:12px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:"Unbounded",sans-serif;font-weight:700;letter-spacing:.5px}
.logo-badge{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--orange),var(--violet));display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 4px 18px rgba(255,138,61,.35)}
.logo small{display:block;font-size:10px;color:var(--muted);font-weight:400;letter-spacing:2px;text-transform:uppercase}
.prog-wrap{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:210px;flex:1;max-width:340px}
.prog{flex:1;height:9px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog>div{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--violet));transition:width .5s ease}
.prog-txt{font-size:12px;color:var(--muted);white-space:nowrap}
/* ---------- Nav ---------- */
nav.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 14px;border-radius:99px;cursor:pointer;font-size:13.5px;font-weight:600;transition:.2s;display:flex;align-items:center;gap:7px}
.tab:hover{border-color:var(--violet);color:var(--txt)}
.tab.on{background:linear-gradient(135deg,rgba(225,97,57,.25),rgba(95,199,184,.22));border-color:var(--orange);color:var(--txt)}
.tab .dot{width:16px;height:16px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim)}
.tab.done .dot{background:var(--ok);border-color:var(--ok);color:#062b18}
/* ---------- Layout ---------- */
main{padding:26px 0 60px}
.view{display:none;animation:fadein .35s ease}
.view.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,rgba(225,97,57,.16),rgba(95,199,184,.14)),var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px 30px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(24px,4vw,38px);margin:10px 0 8px}
.hero .kicker{display:inline-block;background:rgba(225,97,57,.18);border:1px solid rgba(225,97,57,.45);color:var(--orange2);padding:4px 14px;border-radius:99px;font-size:12.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.hero p{color:var(--muted);max-width:760px;font-size:16px}
.sec-head{display:flex;align-items:flex-start;gap:18px;margin:6px 0 22px;flex-wrap:wrap}
.sec-num{font-family:"Unbounded";font-size:44px;font-weight:800;background:linear-gradient(135deg,var(--orange),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.sec-head h2{font-size:clamp(22px,3vw,30px)}
.sec-head .sub{color:var(--muted);margin-top:4px;max-width:720px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
/* ---------- Cards / concepts ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.card h3{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.card h3 .ico{width:28px;height:28px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.concept{cursor:pointer;transition:.2s;border-left:3px solid var(--line)}
.concept:hover{border-left-color:var(--orange);transform:translateX(3px)}
.concept .c-t{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.concept .plus{margin-left:auto;width:22px;height:22px;border-radius:6px;background:var(--panel2);color:var(--orange2);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;transition:.25s}
.concept.open .plus{transform:rotate(45deg);background:rgba(225,97,57,.22)}
.concept .c-body{display:none;margin-top:12px;color:var(--muted);font-size:14.5px}
.concept.open .c-body{display:block;animation:fadein .3s}
.concept .c-body strong{color:var(--txt)}
.hintline{font-size:12.5px;color:var(--dim);margin:4px 0 12px;display:flex;gap:7px;align-items:center}
.key-banner{margin:22px 0;border-radius:16px;padding:18px 22px;background:linear-gradient(120deg,rgba(225,97,57,.18),rgba(95,199,184,.16));border:1px solid rgba(225,97,57,.5);display:flex;gap:14px;align-items:flex-start}
.key-banner .kb-ico{font-size:24px;flex:none}
.key-banner .kb-l{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--orange2)}
.key-banner p{font-size:16.5px;font-weight:600;margin-top:2px}
/* ---------- Flip cas réel ---------- */
.flip{perspective:1200px;min-height:250px}
.flip-in{position:relative;width:100%;min-height:250px;transition:transform .6s;transform-style:preserve-3d;cursor:pointer}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:22px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.flip-front{background:linear-gradient(150deg,rgba(95,199,184,.22),var(--panel))}
.flip-back{background:linear-gradient(150deg,rgba(225,97,57,.22),var(--panel));transform:rotateY(180deg)}
.flip-face .tag{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--violet2)}
.flip-back .tag{color:var(--orange2)}
.flip-face h4{font-size:17px}
.flip-face p{color:var(--muted);font-size:14px}
.flip-face .cta{margin-top:auto;font-size:12.5px;color:var(--dim)}
/* ---------- Quiz ---------- */
.quiz-q{margin-bottom:16px}
.quiz-q .qq{font-weight:700;margin-bottom:10px;display:flex;gap:10px}
.quiz-q .qq .qn{flex:none;width:26px;height:26px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--orange2)}
.opt{display:block;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:11px 14px;border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:14.5px;transition:.15s}
.opt:hover{border-color:var(--violet)}
.opt.good{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--kobg);border-color:var(--ko)}
.opt:disabled{cursor:default;opacity:.9}
.q-expl{display:none;background:var(--bg2);border-left:3px solid var(--orange);border-radius:0 10px 10px 0;padding:10px 14px;font-size:13.5px;color:var(--muted);margin-top:6px}
.q-expl.show{display:block;animation:fadein .3s}
.quiz-score{display:none;text-align:center;padding:18px;border-radius:16px;font-size:17px;font-weight:700;margin-top:8px}
.quiz-score.show{display:block}
.quiz-score.win{background:var(--okbg);border:1px solid var(--ok);color:var(--ok)}
.quiz-score.retry{background:var(--kobg);border:1px solid var(--ko);color:var(--ko)}
.btn{background:linear-gradient(135deg,var(--orange),#c24d28);color:#fff;border:none;padding:11px 22px;border-radius:12px;font-size:14.5px;font-weight:700;cursor:pointer;transition:.2s;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,138,61,.35)}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
.btn.violet{background:linear-gradient(135deg,var(--violet),#3ba898)}
/* ---------- Prompts ---------- */
.prompt{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.prompt .p-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.prompt .p-title{font-weight:700;font-size:15px}
.prompt .p-use{font-size:12.5px;color:var(--dim)}
.prompt pre{background:#0a2620;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:12.8px;white-space:pre-wrap;color:#d9d5f5;max-height:230px;overflow:auto}
.copy-btn{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:6px 13px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;transition:.15s}
.copy-btn:hover{border-color:var(--orange);color:var(--orange2)}
.p-expected{margin-top:10px;font-size:13px;color:var(--muted);background:rgba(95,199,184,.12);border:1px solid rgba(95,199,184,.4);border-radius:10px;padding:9px 12px}
.p-expected b{color:var(--violet2)}
.safe-note{display:flex;gap:10px;background:var(--kobg);border:1px solid rgba(229,72,77,.4);border-radius:12px;padding:12px 15px;font-size:13.5px;color:#f0b9bb;margin-bottom:14px}
/* ---------- Exercices ---------- */
.step{display:flex;gap:14px;padding:13px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border:none}
.step .sn{flex:none;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--violet));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.step .sig{display:inline-block;margin-top:6px;font-size:12.5px;background:var(--okbg);border:1px solid rgba(51,201,126,.4);color:var(--ok);padding:4px 11px;border-radius:99px}
/* ---------- Activities ---------- */
.act{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:24px;margin:22px 0}
.act-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.act-h .a-ico{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,rgba(225,97,57,.32),rgba(95,199,184,.3));display:flex;align-items:center;justify-content:center;font-size:19px}
.act-h h3{font-size:18px}
.act-sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.feedback{display:none;margin-top:14px;padding:13px 16px;border-radius:12px;font-size:14px;animation:fadein .3s}
.feedback.show{display:block}
.feedback.ok{display:block;background:var(--okbg);border:1px solid var(--ok);color:#bff0d6}
.feedback.ko{display:block;background:var(--kobg);border:1px solid var(--ko);color:#f3c2c4}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:8px 15px;cursor:pointer;font-size:13.5px;transition:.15s;color:var(--txt)}
.chip:hover{border-color:var(--violet)}
.chip.sel{background:rgba(225,97,57,.2);border-color:var(--orange);color:var(--orange2)}
.chip.okc{background:var(--okbg);border-color:var(--ok)}
.chip.koc{background:var(--kobg);border-color:var(--ko)}
/* terminal */
.term{background:#0a2620;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:8px}
.term-bar{display:flex;gap:7px;align-items:center;padding:9px 13px;background:#14352f;border-bottom:1px solid var(--line)}
.term-bar i{width:11px;height:11px;border-radius:50%;display:inline-block}
.term-bar span{margin-left:8px;font-size:12px;color:var(--dim)}
.term-out{padding:14px;height:280px;overflow-y:auto;font-size:13.3px;line-height:1.65}
.term-out .cmd{color:var(--orange2)}
.term-out .okl{color:var(--ok)}
.term-out .err{color:var(--ko)}
.term-out .info{color:var(--violet2)}
.term-out .warn{color:var(--gold)}
.term-line{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:#0d2c26}
.term-line .ps{color:var(--ok);font-size:13.3px;flex:none}
.term-line input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:13.3px;font-family:inherit}
.term-side{font-size:13px;color:var(--muted)}
.term-side ul{margin:8px 0 14px 18px}
.term-side li{margin-bottom:4px}
/* sortable */
.sortable{display:flex;flex-direction:column;gap:9px;margin:10px 0}
.sort-item{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:11px;font-size:14px;cursor:grab;user-select:none}
.sort-item .ord{flex:none;width:26px;height:26px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--muted)}
.sort-item .mv{margin-left:auto;color:var(--dim);cursor:pointer;font-size:15px;padding:2px 8px}
.sort-item .mv:hover{color:var(--orange2)}
/* dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:22px}
.dash-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.dash-card:hover{transform:translateY(-4px);border-color:var(--violet);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.dash-card .dc-num{font-family:"Unbounded";font-size:13px;font-weight:800;color:var(--orange2);letter-spacing:1px}
.dash-card h3{font-size:18px;margin:6px 0 8px}
.dash-card p{font-size:13.5px;color:var(--muted)}
.dash-card .dc-foot{margin-top:14px;display:flex;align-items:center;gap:10px}
.dc-prog{flex:1;height:7px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.dc-prog>div{height:100%;background:linear-gradient(90deg,var(--orange),var(--violet));width:0%;transition:width .5s}
.dc-state{font-size:12px;font-weight:700;color:var(--dim)}
.dc-state.ok{color:var(--ok)}
.dash-hero-stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 18px;flex:1;min-width:150px}
.stat b{font-family:"Unbounded";font-size:22px;display:block;color:var(--orange2)}
.stat span{font-size:12px;color:var(--muted)}
.rulette{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:16px}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;font-size:13.5px;color:var(--muted)}
.rule b{color:var(--txt);display:block;margin-bottom:5px;font-size:14.5px}
.match-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
.match-row .m-lab{font-weight:700;font-size:14.5px;min-width:190px}
.match-row select{background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px;font-family:inherit;min-width:230px}
.final-hero{text-align:center;padding:40px 20px;border-radius:22px;background:linear-gradient(135deg,rgba(225,97,57,.2),rgba(95,199,184,.18)),var(--panel);border:1px solid var(--line)}
.big-emoji{font-size:56px}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--dim);font-size:13px;text-align:center}
.confetti{position:fixed;top:-10px;font-size:22px;animation:fall linear forwards;z-index:99;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
.tool-flex{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.mini{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13px;color:var(--muted);transition:.15s}
.mini:hover{border-color:var(--orange);color:var(--orange2)}
.vs-panel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
@media(max-width:700px){.vs-panel{grid-template-columns:1fr}}
.vs-col{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:110px}
.vs-col h5{font-size:13px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.vs-col.a h5{color:var(--orange2)}.vs-col.b h5{color:var(--violet2)}
.vs-item{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px;margin-bottom:7px;cursor:pointer;transition:.15s}
.vs-item:hover{border-color:var(--gold);color:var(--gold)}
.vs-item.placed{opacity:.45;cursor:default}

/* ---- Panneaux Expert ---- */
.exp-panel{margin:22px 0;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:24px}
.exp-panel .ep-k{display:inline-block;background:rgba(225,97,57,.18);border:1px solid rgba(225,97,57,.45);color:var(--orange2);padding:4px 14px;border-radius:99px;font-size:11.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px}
.ana-box{background:var(--bg2);border-left:3px solid var(--teal);border-radius:0 12px 12px 0;padding:13px 16px;font-size:15px;margin-bottom:12px}
.ana-box .lab{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal2);display:block;margin-bottom:4px}
.exp-box{background:linear-gradient(120deg,rgba(225,97,57,.14),rgba(95,199,184,.10));border:1px solid rgba(225,97,57,.4);border-radius:14px;padding:15px 18px;font-size:15px;margin-bottom:14px}
.exp-box .lab{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--orange2);display:block;margin-bottom:5px}
.exp-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:800px){.exp-grid2{grid-template-columns:1fr}}
.exp-col{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
.exp-col h4{font-size:14px;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.exp-col ul{list-style:none}
.exp-col li{font-size:13.5px;color:var(--muted);padding:5px 0 5px 24px;position:relative;border-bottom:1px dashed var(--line)}
.exp-col li:last-child{border:none}
.exp-col li::before{position:absolute;left:0;top:5px}
.exp-col.err li::before{content:"✗";color:var(--ko)}
.exp-col.chk li::before{content:"✓";color:var(--ok)}
.act-box{background:linear-gradient(120deg,rgba(95,199,184,.14),transparent);border:1px solid rgba(95,199,184,.4);border-radius:14px;padding:14px 17px;font-size:14.5px;margin-bottom:14px}
.act-box .lab{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal2);display:block;margin-bottom:5px}
.gloss{background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.gloss h4{font-size:14px;padding:12px 17px 8px}
.gloss .g-row{display:flex;gap:14px;padding:9px 17px;border-top:1px solid var(--line);font-size:13.5px;align-items:baseline}
.gloss .g-row b{color:var(--orange2);min-width:150px;flex:none}
.gloss .g-row span{color:var(--muted)}


/* ---- Améliorations V2 ---- */
.note-area{width:100%;min-height:110px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:13px 15px;font-size:14.5px;font-family:inherit;resize:vertical;outline:none;box-sizing:border-box}
.note-area:focus{border-color:var(--teal)}
@media print{body>*{display:none!important}#cert{display:flex!important}#certinner{-webkit-print-color-adjust:exact;print-color-adjust:exact}#certbar{display:none!important}}

</style>
</head>
<body>
<header class="top"><div class="wrap top-in">
  <div class="logo"><div class="logo-badge">🌱</div><div>Vivier IA<small>Module 5 · Prospection IA</small></div></div>
  <div class="prog-wrap"><div class="prog"><div id="progBar"></div></div><span class="prog-txt" id="progTxt">0 / 7 sections</span></div>
</div></header>

const DATA=[{"num":"01","title":"Mise en place et warm-up","concepts":[{"t":"Ouverture","d":"Bonjour, je suis Zézé, fondateur de Vivier IA. Prospecter par e-mail froid demande de la patience avant les premiers résultats. Dans cette section, vous verrez ce que Lemlist ajoute au Module 3, comment choisir un outil, comment configurer un domaine d'envoi, pourquoi le warm-up est obligatoire, et comment surveiller la délivrabilité en continu."},{"t":"L'état d'esprit avant de commencer","d":"Vouloir sauter le warm-up pour aller plus vite est l'erreur la plus fréquente des débutants. La prospection froide par e-mail demande de la patience. Le Module 3 a posé les bases de l'outbound. Ce module va plus loin avec Lemlist, spécialisé dans la prospection par e-mail froid à grande échelle, avec IA pour la personnalisation. Pensez-y à chaque nouveau projet : c'est un réflexe qui s'acquiert avec la pratique. Un compte e-ma"},{"t":"Lemlist et ses alternatives","d":"Listez tous vos critères avant de choisir un outil : un critère oublié coûte un ajustement. Un outil de prospection multicanal. Il utilise surtout l'e-mail, avec des options LinkedIn et appel. Il envoie des séquences de messages personnalisés, suit ouvertures et réponses, et intègre l'IA. Cette distinction paraît simple, mais elle change vraiment la manière de répondre à un client. Leurs positionnements diffèrent : certaines v"},{"t":"Les briques et la logique d'une campagne","d":"Une séquence est un enchaînement avec des conditions, pas une simple liste de messages. Comprendre la logique globale avant le détail. Là où l'on construit les séquences, la base de prospects, le déroulé dans le temps des messages, et le suivi des ouvertures, clics et réponses. Relisez ce point avec un cas de votre propre activité, pour qu'il devienne concret. Elle s'appuie sur une liste de prospects et suit une séquence de me"},{"t":"Configurer le compte et le domaine","d":"Choisissez la méthode d'envoi selon le volume et le but. L'adresse d'envoi s'appuie sur un domaine à bonne réputation. Idéalement un domaine professionnel dédié à la prospection, pas la boîte principale de l'activité. Ne cherchez pas à tout retenir d'un coup : revenez à ce point à chaque projet. Ils prouvent aux fournisseurs de messagerie que l'envoi est légitime et non usurpé. Lemlist indique les enregistrements recommandés. "},{"t":"Lancer le warm-up","d":"De petits volumes d'abord : c'est la logique du warm-up. Construire une réputation d'expéditeur légitime. Il envoie et reçoit automatiquement de petits volumes d'e-mails entre comptes, avant tout envoi réel à des prospects. Vous pourrez ainsi expliquer la règle simplement à un client, sans jargon. Une boîte neuve qui commence par un envoi massif est très souvent classée en spam, même avec un excellent message. Pensez à un exem"},{"t":"Surveiller la délivrabilité","d":"Surveillez les échecs en continu, ne les laissez pas s'accumuler. La métrique à suivre en continu. Contre les spams et les rejets. Gardez ce repère sous la main lors de vos premiers échanges avec un client. Réduisez le volume et revoyez le contenu. Ne l'ignorez pas parce que les réponses continuent d'arriver. Vous pourrez la réutiliser dans vos propres projets, quel que soit l'outil du moment. Une plateforme de paiement désact"}],"icon":"🔥","sub":"Boîte neuve, warm-up obligatoire, SPF/DKIM/DMARC, délivrabilité : les fondations avant la première campagne.","key":"Vouloir sauter le warm-up pour aller plus vite est l'erreur la plus fréquente des débutants.","cas":{"t":"Le warm-up qu'on voulait sauter","ctx":"Cas réel Lemlist — plateforme Vivier IA, octobre 2026.","d1":"Vouloir sauter le warm-up pour aller plus vite est l'erreur la plus fréquente : aucune campagne n'a encore été lancée à ce jour, parce que la réputation de la boîte vient d'abord.","d2":"Même logique que le warm-up : de petits volumes d'abord. On surveille les échecs en continu, on ne les laisse pas s'accumuler.","lecon":"De petits volumes d'abord : c'est la logique du warm-up."},"prompts":[{"t":"Préparer SPF, DKIM et DMARC","use":"Pour comprendre ces trois réglages et préparer la configuration de la boîte d'envoi. Aide pour l'étape 1 de l'exercice.","txt":"Je suis débutant complet en prospection par e-mail. Je veux utiliser Lemlist, un outil d'envoi automatique de séquences d'e-mails.\nExpliquez-moi en mots simples ce que prouvent SPF, DKIM et DMARC aux fournisseurs de messagerie, et pourquoi un domaine professionnel dédié vaut mieux qu'une adresse personnelle.\nPréparez ensuite une liste d'étapes : créer le compte, connecter la boîte d'envoi, configurer ces trois réglages chez l'hébergeur du domaine, vérifier dans l'interface que la configuration est reconnue valide avant le warm-up.\nMon domaine envisagé : [VOTRE DOMAINE D'ENVOI].\nExpliquez chaque terme technique en une phrase simple. Ne me demandez jamais de mot de passe.","att":"Une explication simple des trois réglages et une liste d'étapes claire jusqu'à la validation dans l'interface. *Source : 01-mise-en-place-warmup.md, l.92-99.*"},{"t":"Plan de suivi du warm-up","use":"Pour planifier le warm-up et le suivi du score de réputation sur plusieurs semaines. Aide pour l'étape 2 de l'exercice.","txt":"Je suis débutant. Ma boîte d'envoi pour la prospection : [VOTRE ADRESSE D'ENVOI, FICTIVE POUR L'EXERCICE].\nExpliquez en une phrase simple ce que sont le warm-up, la réputation d'expéditeur et la délivrabilité.\nPuis construisez un plan de suivi en tableau, semaine par semaine, sur au moins deux à trois semaines : ce que je fais, ce que je surveille (le score de réputation affiché dans l'interface), et à quel moment passer à un volume d'envoi progressif plutôt qu'à pleine capacité.\nN'inventez aucun chiffre d'envoi précis : parlez de petit volume puis de volume progressif.\nExpliquez chaque terme technique en une phrase simple.","att":"Un tableau de suivi par semaine avec le score de réputation à surveiller et le passage progressif à un volume plus fort. *Source : 01-mise-en-place-warmup.md, l.116-127.*"},{"t":"Risque d'un envoi sans warm-up","use":"Pour comprendre le risque du spam et définir la délivrabilité, avec un petit quiz. Aide pour l'étape 3 de l'exercice.","txt":"Je suis débutant. Un apprenant veut lancer sa première campagne d'e-mails dès la création de son compte, sans warm-up.\nExpliquez-moi, avec une analogie simple, le risque concret qu'il court, et pourquoi cela peut compromettre toutes ses campagnes futures.\nDéfinissez la délivrabilité en une phrase et dites pourquoi on la surveille en continu : une baisse est un signal à traiter tout de suite.\nTerminez par deux questions de quiz, puis attendez ma réponse. Ma première réponse : [VOTRE RÉPONSE EN UNE PHRASE].\nExpliquez chaque terme technique en une phrase simple.","att":"Le risque expliqué (boîte classée en spam, délivrabilité compromise) et une définition claire de la délivrabilité. *Source : 01-mise-en-place-warmup.md, l.14, l.116-121.* ## Questions de vérification **1. Pourquoi le warm-up est-il obligatoire avant une vraie campagne ?** *Corrigé :* Une boîte neuve sans warm-up est très souvent classée en spam dès un envoi massif, même avec un excellent message. **2. Quelles sont les quatre briques principales de l'interface Lemlist ?** *Corrigé :* Campaigns, People Database, Sequences, Tracking. **3. Que prouvent SPF, DKIM et DMARC aux messageries ?** *Corrigé :* Que l'envoi est légitime et non usurpé. **4. Qu'est-ce que la délivrabilité ?** *Corrigé :* La part des messages qui arrivent vraiment en boîte de réception, contre les spams et les rejets. **5. Combien de temps laisser tourner le warm-up ?** *Corrigé :* Au moins 2 à 3 semaines, en surveillant le score de réputation. ## Projet [À COMPLÉTER] : le texte source ne décrit pas de projet."}],"exercice":[{"e":"Créez un compte Lemlist, connectez la boîte d'envoi (idéalement un domaine dédié) et configurez SPF, DKIM et DMARC.","s":"la configuration est reconnue comme valide dans l'interface avant de passer au warm-up."},{"e":"Activez le warm-up pour la boîte configurée et suivez le score de réputation pendant au moins 2 à 3 semaines.","s":"un score de réputation stable, puis un volume d'envoi progressif."},{"e":"Un apprenant veut lancer sa première campagne sans warm-up. Quel risque court-il ?","s":"boîte classée en spam rapidement, ce qui compromet la délivrabilité de toutes ses campagnes futures."},{"e":"Qu'est-ce que la délivrabilité, et pourquoi la surveiller en continu ?","s":"la part des messages qui arrivent en boîte de réception ; une baisse est un signal à traiter immédiatement."}],"quiz":[{"q":"Pourquoi le warm-up est-il obligatoire avant une vraie campagne ?","x":"Une boîte neuve sans warm-up est très souvent classée en spam dès un envoi massif, même avec un excellent message.","o":["Une boîte neuve sans warm-up est très souvent classée en spam dès un envoi massif, même avec un excellent message","Parce que c'est une étape légale obligatoire","Parce que Lemlist l'exige pour activer le compte","Parce que les messages partent plus vite"],"c":0},{"q":"Quelles sont les quatre briques principales de l'interface Lemlist ?","x":"Campaigns, People Database, Sequences, Tracking.","o":["Campaigns, People Database, Sequences, Tracking","Campagnes, E-mails, Contacts, Rapports","Sequences, Warm-up, Scraper, Analytics","Inbox, CRM, Pipeline, Billing"],"c":0},{"q":"Que prouvent SPF, DKIM et DMARC aux messageries ?","x":"Que l'envoi est légitime et non usurpé.","o":["Que l'envoi est légitime et non usurpé","Que le message est bien rédigé","Que la base de contacts est propre","Que le prix du domaine est payé"],"c":0},{"q":"Qu'est-ce que la délivrabilité ?","x":"La part des messages qui arrivent vraiment en boîte de réception, contre les spams et les rejets.","o":["La part des messages qui arrivent vraiment en boîte de réception, contre les spams et les rejets","La vitesse d'envoi des messages","Le nombre de clics sur les liens","La taille des pièces jointes"],"c":0},{"q": zPz6960HHuUILAADQz/1/wEXMxmI3LckAAAAASUVORK5CYII=","cap":"La pratique pas à pas — 4 étapes numérotées à rejouer chez vous, dans l'ordre."}]},{"num":"02","title":"Lancer vos premières campagnes","concepts":[{"t":"Ouverture","d":"Bonjour, je suis Zézé, fondateur de Vivier IA. Vous avez préparé votre domaine et chauffé votre boîte. Maintenant, vous lancez vos premières campagnes. Dans cette section, vous verrez comment faire écrire une séquence par l'IA sans tomber dans le texte générique, comment filtrer une base de prospects, pourquoi démarrer sur un petit volume, et comment suivre les réponses. Gardez en tête que chaque étape se valide avant la suiva"},{"t":"L'IA écrit un premier jet","d":"L'IA accélère la rédaction, mais un bon prompt reste nécessaire pour un résultat exploitable. Elle accélère la rédaction, mais ne remplace pas votre cadrage. L'IA écrit une séquence à partir d'une description de votre offre et de votre cible. Pensez-y à chaque nouveau projet : c'est un réflexe qui s'acquiert avec la pratique. Sans le prompt système et le gabarit à quatre éléments, vous obtenez un texte générique, pas un texte "},{"t":"La structure d'une séquence efficace","d":"Chaque message doit apporter quelque chose de nouveau, pas répéter la demande précédente. Trois messages, chacun avec un rôle. Il accroche sur un problème précis, par exemple un constat sur le secteur du prospect. Cette distinction paraît simple, mais elle change vraiment la manière de répondre à un client. Quelques jours plus tard, avec une preuve concrète : un cas client, un chiffre. Pas seulement « je relance Si aucune répo"},{"t":"People Database : filtrer d'abord","d":"La qualité d'une base dépend de la précision des filtres, pas seulement du volume. Une recherche bien filtrée dès le départ est plus sûre. Secteur, taille d'entreprise, poste, directement dans Lemlist. Pour une première campagne, pas besoin d'outil externe de scraping. Relisez ce point avec un cas de votre propre activité, pour qu'il devienne concret. Exporter une liste large puis filtrer demande plus de travail manuel et prod"},{"t":"La première campagne, de A à Z","d":"Surveillez de près les premiers résultats avant d'élargir la campagne à toute la base. Un volume raisonnable, jamais un envoi massif d'un coup. Importez ou recherchez la liste, créez la séquence, réglez un volume quotidien raisonnable, lancez et surveillez les premiers résultats de près. Ne cherchez pas à tout retenir d'un coup : revenez à ce point à chaque projet. Testez la séquence sur peu de prospects : un bon taux d'ouvert"},{"t":"Le suivi : tracking sheet et CRM","d":"On automatise l'avertissement, pas la relation. Une campagne ne s'arrête pas à l'envoi. Le suivi des réponses détermine la suite avec chaque prospect qui a répondu. Vous pourrez ainsi expliquer la règle simplement à un client, sans jargon. Le tracking sheet centralise le statut de chaque prospect en conversation. Le CRM structure tout le cycle de vie du prospect. Pensez à un exemple de votre propre activité pour vérifier que v"},{"t":"Cas voisin : le test final avant de laisser tourner","d":"Ce que c'est : Aucune campagne Lemlist n'a été lancée. Ce cas est un système voisin, pas un cas Lemlist. Le cas voisin : Pour la notification d'un diagnostic en ligne, le test final a été fait sur l'adresse de production du webhook. Le résultat : L'e-mail est bien arrivé. Un seul envoi réel a suffi pour valider la chaîne, avant de la laisser tourner. Cas réel Lemlist : [À COMPLÉTER] : aucune campagne lancée. Même logique que 2"}],"icon":"🚀","sub":"Filtrer dès la recherche, petits volumes d'abord, tracking sheet : lancer sans risquer la réputation.","key":"L'IA accélère la rédaction, mais un bon prompt reste nécessaire pour un résultat exploitable.","cas":{"t":"La base filtrée à la source","ctx":"Campagne pilote — plateforme Vivier IA.","d1":"La qualité d'une base dépend de la précision des filtres, pas seulement de la taille : chaque message doit apporter quelque chose de nouveau, pas répéter la même demande.","d2":"On lance sur 20 à 50 prospects maximum, avec un tracking sheet qui centralise le statut de chaque conversation.","lecon":"MVP avant V1 : valider la séquence avant d'exposer toute la base."},"prompts":[{"t":"Filtres de recherche précis","use":"Pour définir des filtres précis dans la recherche de prospects avant d'exporter. Aide pour l'étape 2 de l'exercice.","txt":"Je suis débutant en prospection par e-mail. Lemlist propose une recherche de prospects appelée People Database, avec des critères comme le secteur, la taille d'entreprise et le poste.\nMon offre : [VOTRE OFFRE]. Ma cible : [VOTRE CIBLE].\nPosez-moi d'abord les questions qui manquent. Puis préparez une fiche de filtres précis (secteur, taille d'entreprise, poste) et expliquez pourquoi filtrer dès la recherche évite un nettoyage manuel et des erreurs.\nN'inventez aucun prospect ni aucune donnée : si une information manque, laissez le champ vide.\nExpliquez chaque terme technique en une phrase simple.","att":"Une fiche de filtres précis (secteur, taille, poste) et la raison de filtrer avant d'exporter. *Source : 02-premieres-campagnes.md, l.40-44.*"},{"t":"Plan de ma campagne test","use":"Pour préparer une première campagne sur un petit volume, selon le principe MVP avant la première version. Aide pour l'étape 3 de l'exercice.","txt":"Je suis débutant. Je prépare ma première campagne d'e-mails de prospection avec Lemlist. Mon offre : [VOTRE OFFRE].\nExpliquez en une phrase simple le principe « MVP avant la première version » et pourquoi on démarre petit.\nPréparez une liste de contrôle : une liste de vingt à cinquante prospects au maximum, un volume d'envoi quotidien faible et cohérent avec le warm-up, une surveillance quotidienne du taux d'ouverture et de réponse pendant la première semaine, et une décision d'élargir seulement ensuite.\nAjoutez ce qui me dirait que la séquence fonctionne : bon taux d'ouverture, aucune plainte pour spam.\nExpliquez chaque terme technique en une phrase simple.","att":"Une liste de contrôle pour une campagne test à petit volume, avec les signaux à surveiller avant d'élargir. *Source : 02-premieres-campagnes.md, l.77-86.*"},{"t":"Séquence de trois messages","use":"Pour obtenir les grandes lignes d'une séquence de trois messages qui apportent chacun du nouveau. Aide pour l'étape 4 de l'exercice.","txt":"Je suis débutant. Aidez-moi à rédiger les grandes lignes, sans le texte complet, d'une séquence de trois e-mails de prospection.\nMon offre : [VOTRE OFFRE]. Ma cible : [VOTRE CIBLE]. Le problème précis de ma cible : [LE PROBLÈME].\nStructure : un premier e-mail court qui accroche sur un problème précis, une relance qui apporte une information nouvelle (pas seulement « je relance »), un dernier message qui referme proprement.\nProposez trois angles possibles pour le premier e-mail, puis un tableau : message, ce qu'il apporte de nouveau.\nN'inventez aucune preuve ni aucun chiffre : écrivez [À COMPLÉTER PAR MOI].\nExpliquez chaque terme technique en une phrase simple.","att":"Trois angles au choix et un tableau des trois messages montrant ce que chacun apporte de nouveau. *Source : 02-premieres-campagnes.md, l.13-15, l.24.* ## Questions de vérification **1. Pourquoi le prompt système reste-t-il nécessaire ?** *Corrigé :* Sans lui, l'IA produit un texte générique peu exploitable malgré la rapidité. **2. Pourquoi filtrer dès la recherche ?** *Corrigé :* Pour éviter un nettoyage manuel après coup et réduire les erreurs. **3. Quel principe justifie un petit volume au départ ?** *Corrigé :* MVP avant V1 : valider la séquence avant d'exposer toute la base. **4. Combien de prospects pour un premier test ?** *Corrigé :* 20 à 50 prospects maximum. **5. Que fait un tracking sheet ?** *Corrigé :* Il centralise le statut de chaque prospect en conversation. ## Projet [À COMPLÉTER] : le texte source ne décrit pas de projet."}],"exercice":[{"e":"Pourquoi le prompt système reste-t-il nécessaire même quand l'IA génère la séquence ?","s":"sans un bon prompt, l'IA produit un texte générique peu exploitable."},{"e":"Pourquoi filtrer précisément dès la recherche People Database ?","s":"cela évite un nettoyage manuel après coup et réduit les erreurs."},{"e":"Quel principe du Module 3 justifie de démarrer une première campagne sur un petit volume ?","s":"le principe MVP avant V1 : valider que la séquence fonctionne avant d'exposer toute la base."},{"e":"Rédigez les grandes lignes d'une séquence de trois messages en identifiant ce que chacun apporte de nouveau.","s":"pas de réponse unique : chaque message apporte réellement quelque chose de nouveau."}],"quiz":[{"q":"Pourquoi le prompt système reste-t-il nécessaire ?","x":"Sans lui, l'IA produit un texte générique peu exploitable malgré la rapidité.","o":["Sans lui, l'IA produit un texte générique peu exploitable malgré la rapidité","Il n'est plus nécessaire avec les modèles récents","Il sert uniquement à réduire les coûts","Il remplace la relecture humaine"],"c":0},{"q":"Pourquoi filtrer dès la recherche ?","x":"Pour éviter un nettoyage manuel après coup et réduire les erreurs.","o":["Pour éviter un nettoyage manuel après coup et réduire les erreurs","Pour accélérer l'envoi des messages","Pour réduire le prix des abonnements","Pour éviter d'écrire les e-mails"],"c":0},{"q":"Quel principe justifie un petit volume au départ ?","x":"MVP avant V1 : valider la séquence avant d'exposer toute la base.","o":["MVP avant V1 : valider la séquence avant d'exposer toute la base","Pour économiser les crédits d'envoi","Pour éviter le warm-up","Pour satisfaire les messageries"],"c":0},{"q":"Combien de prospects pour un premier test ?","x":"20 à 50 prospects maximum.","o":["20 à 50 prospects maximum","500 à 1 000 prospects","Toute la base d'un coup","Un seul prospect suffit"],"c":0},{"q":"Que fait un tracking sheet ?","x":"Il centralise le statut de chaque prospect en conversation.","o":["Il centralise le statut de chaque prospect en conversation","Il envoie les e-mails automatiquement","Il génère les leads","Il remplace le CRM"],"c":0}],"act":{"type":"steps","icon":"🚀","title":"Le premier lancement","sub":"5 décisions de campagne. Filtrer, tester petit, suivre : la méthode MVP appliquée à la prospection.","steps":[{"q":"Pourquoi le prompt système reste-t-il nécessaire ?","o":["Sans lui, l'IA produit un texte générique peu exploitable malgré la rapidité","Il n'est plus nécessaire avec les modèles récents","Il sert uniquement à réduire les coûts","Il remplace la relecture humaine"],"c":0,"x":"Sans lui, l'IA produit un texte générique peu exploitable malgré la rapidité."},{"q":"Pourquoi filtrer dès la recherche ?","o":["Pour éviter un nettoyage manuel après coup et réduire les erreurs","Pour accélérer l'envoi des messages","Pour réduire le prix des abonnements","Pour éviter d'écrire les e-mails"],"c":0,"x":"Pour éviter un nettoyage manuel après coup et réduire les erreurs."},{"q":"Quel principe justifie un petit volume au départ ?","o":["MVP avant V1 : valider la séquence avant d'exposer toute la base","Pour économiser les crédits d'envoi","Pour éviter le warm-up","Pour satisfaire les messageries"],"c":0,"x":"MVP avant V1 : valider la séquence avant d'exposer toute la base."},{"q":"Combien de prospects pour un premier test ?","o":["20 à 50 prospects maximum","500 à 1 000 prospects","Toute la base d'un coup","Un seul prospect suffit"],"c":0,"x":"20 à 50 prospects maximum."},{"q":"Que fait un tracking sheet ?","o":["Il centralise le statut de chaque prospect en conversation","Il envoie les e-mails automatiquement","Il génère les leads","Il remplace le CRM"],"c":0,"x":"Il centralise le statut de chaque prospect en conversation."}]},"ana":"Le premier lancement, c'est le service d'essai du restaurant : on ouvre à 20 couverts pour que chaque plat soit parfait avant d'ouvrir les 200 places.","expert":"Le tracking sheet est votre mémoire commerciale : sans lui, vous recontactez deux fois la même personne ou oubliez la relance promise. Un tableur simple vaut n'importe quel CRM au début.","erreurs":["Importer toute la base d'un coup","Ne noter aucun statut entre les envois","Changer 3 éléments du message entre deux tests"],"check":["20-50 prospects maximum sur le premier envoi","Les filtres appliqués AVANT l'import","Le tracking sheet tenu à jour après chaque action","Une seule variable modifiée entre deux tests"],"action":"Créez votre tracking sheet : colonnes nom, entreprise, statut, date du dernier contact, prochaine action.","glossaire":[["Tracking sheet","Le tableur de suivi de chaque conversation"],["Premier test","Un envoi réduit pour valider avant d'élargir"],["Filtres","Les critères qui sélectionnent les bons prospects"],["Relance","Le contact de suivi après le premier message"]],"shots":[{"img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABNgAAAL4CAIAAAAmqN0nAACdFUlEQVR4nOzdd3xT1fvA8ZPVNN2LTlpa9ih7ChSUpYACCoL+HDhwoKK4t+IXFfdCxa24RVBwsgSkguzVskdbRveeaZrx++NCqG1ymw5uSfm8X/wR7jjnOefc5uTJHVEFDuojAAAAAABQirq5AwAAAAAAXFhIRAEAAAAAiiIRBQAAAAAoikQUAAAAAKAoElEAAAAAgKJIRAEAAAAAiiIRBQAAAAAoikQUAAAAAKAoElEAAAAAgKK0jdw/Mrp1k8QBAAAAAHAj6SdONnjfBiai5J8AAAAAcCGzZ4UNyEgbcmkuWSgAAAAAQNKADLF+Z0RJQQEAAAAANUipouunRutxRpQsFAAAAADgjOs5o6uJKFkoAAAAAECei5kjP98CAAAAAFCUS4kop0MBAAAAAK5wJX+sOxElCwUAAAAAuK7OLJJLcwEAAAAAiqrfz7fUy8oSW/X/jvFV1beE5KfCq/83/vnM+pbg+VCv6v81vrarviUAAAAAAJpWHWdEG3xdbo0s1OESeTWyUIdL5NXIQh0uAQAAAAA0OflcUhU4qE+Dd3ZGJud08byoTM7p4nlRmZyT86IA3NHzjz7m6+Pz1eLF23bvOh/KgYsU6PCWPaYyrVOs4S27hwHg3Ek/cdLZqqa/NFf+zOfKEluduaj8mc/kp8LrzEXlz3x6PtSLXBS4wD1y9z1R4eHbdu/+avGPzR0LmsDt19/QrVOnxM2bF//263keyfkTapNrwU1rcvQVADRxIurK9bfyuagr19/K56KuXH9LLgrA7Tz18kvNHQIagoE7d+hbAHBf5/BhRQDgdrwMhksvviS+cyc/X7+CwsJ/t2/7+99/rVZr7S2lS/X++icxOjIqJiqqqLj4l5Urkg8csK9au+Gf6Mio6KioJb/9lnRgv7NiX3z8CW8vr5V/r2vXJjY6Kiq/oODnP//s2rHjgN69bTbbnn37fvhlmbRl9YsDZeKsXfvmnTuctVc6MyyEsFgseQUFG7dtW7vhn+oNXL1+fevIyNjoaKPRuHzd2n+3bRNCGDw9Rw0b1qNL1wA/v8ycnKXL/zyamirfey42s852OYzn8Vn3hoeGCiESBg5MGDiwrLz8iXkvNv5gkBliZ3E6jKT6wMmHes3ESRf167d9 t de son secteur, son poste, une actualité récente de son entreprise. Une campagne classique envoie le même message à toute la liste, avec seulement le prénom qui change. Pensez-y à chaque nouveau projet : c'est un réflexe qui s'acquiert avec la pratique. Si la génération est entièr"},{"t":"Le A/B testing","d":"Un seul élément qui varie à la fois donne un résultat utilisable. Mesurer plutôt que deviner. Vous testez deux versions d'un même élément, par exemple l'objet de l'e-mail, sur deux moitiés comparables de la liste. Cette distinction paraît simple, mais elle change vraiment la manière de répondre à un client. Ce sont eux qui ont l'impact le plus direct sur le taux d'ouverture. Prenez le temps d'y réfléchir avant de passer à la s"},{"t":"Variables IA et liquid syntax","d":"C'est la différence entre personnaliser et décorer. Aller au-delà du prénom. Par exemple une observation sur son entreprise, ou une reformulation de son problème probable. Une donnée fixe comme le prénom ne fait que remplacer un mot. Relisez ce point avec un cas de votre propre activité, pour qu'il devienne concret. Elle permet d'afficher une phrase différente selon le secteur du prospect. C'est la logique d'un IF dans n8n, pl"},{"t":"Images dynamiques et personnalisation de façade","d":"Une variable IA mal alimentée en données produit une phrase générique qui a l'air personnalisée. Le risque principal reste le même. Le nom du prospect dans l'image, ou une capture d'écran personnalisée. Elle attire en général plus l'attention qu'un e-mail en texte seul. Ne cherchez pas à tout retenir d'un coup : revenez à ce point à chaque projet. Elle produit une phrase générique qui a l'air personnalisée sans l'être. Cela se"},{"t":"Scénarios plus complexes","d":"Un scénario avancé s'écrit comme « si cet événement, alors cette action Plusieurs canaux, des branches conditionnelles. Une séquence coordonnée augmente les chances d'atteindre un prospect qui ne répond pas toujours sur le même canal. Vous pourrez ainsi expliquer la règle simplement à un client, sans jargon. Le scénario aiguille différemment selon ce que le prospect a fait. C'est la logique d'un IF ou d'un Switch dans n8n. Pen"},{"t":"Cas voisin : un seul élément qui change","d":"Ce que c'est : Aucune campagne Lemlist n'a été lancée. Ce cas est un système voisin, pas un cas Lemlist. Le cas voisin : Sur un visuel, le texte d'une pastille avait un contraste trop faible : 2,87 pour 1. Le changement : Un seul réglage a été modifié : l'opacité d'une couleur, passée à 47 %. Le contraste est monté à 5,26 pour 1. Cas réel Lemlist : [À COMPLÉTER] : aucune campagne lancée. Le principe est le même : un seul éléme"}],"icon":"✍️","sub":"Variables IA, A/B tests, liquid syntax : personnaliser vraiment, pas décorer.","key":"Une génération automatique peut produire une phrase plausible et fausse : relisez un échantillon.","cas":{"t":"La phrase plausible et fausse","ctx":"Génération IA de messages — Lemlist.","d1":"Une génération automatique peut produire une phrase plausible et fausse : une variable IA mal alimentée en données produit une phrase générique, pas une personnalisation.","d2":"On relit toujours un échantillon, et on ne teste qu'un élément à la fois pour savoir lequel fait la différence.","lecon":"Un seul élément qui varie à la fois donne un résultat utilisable."},"prompts":[{"t":"Préparer un test A/B","use":"Pour comparer deux objets d'e-mail en ne changeant qu'un seul élément. Aide pour l'étape 2 de l'exercice.","txt":"Je suis débutant en prospection par e-mail. Mon offre : [VOTRE OFFRE]. Ma cible : [VOTRE CIBLE].\nExpliquez en une phrase simple ce qu'est un test A/B.\nProposez deux versions de l'objet d'un e-mail : une affirmation et une question directe. Dites précisément ce qui doit rester identique dans les deux versions (contenu, heure d'envoi) et pourquoi un seul élément doit varier à la fois.\nExpliquez comment envoyer chaque version à une moitié comparable de la liste et comment lire le résultat : on mesure, on ne devine pas.\nNe promettez aucun résultat. Expliquez chaque terme technique en une phrase simple.","att":"Deux objets d'e-mail à comparer, avec la liste de ce qui reste identique et la méthode de lecture du résultat. *Source : 03-avance-copywriting.md, l.37-45.*"},{"t":"Variable IA contre donnée fixe","use":"Pour distinguer une vraie personnalisation d'une personnalisation de façade. Aide pour l'étape 3 de l'exercice.","txt":"Je suis débutant. Expliquez-moi la différence entre une donnée fixe (le prénom, l'entreprise) et une variable IA qui écrit une phrase entière pour chaque prospect à partir de données réelles.\nVoici les données que j'ai sur un prospect fictif : [DONNÉES FICTIVES D'UN PROSPECT].\nÉcrivez deux phrases : une personnalisation de façade, générique, et une vraie personnalisation fondée sur ces données. Expliquez ce qu'est la liquid syntax en une phrase simple (une condition placée dans le texte, comme un « si… alors »), avec un exemple en mots, sans code.\nRappelez pourquoi il faut relire un échantillon des messages avant de lancer.\nExpliquez chaque terme technique en une phrase simple.","att":"Deux phrases comparées (façade ou réelle), la liquid syntax expliquée simplement et le rappel de relire un échantillon. *Source : 03-avance-copywriting.md, l.9-13, l.66-78.*"},{"t":"Scénario à deux canaux","use":"Pour imaginer un scénario e-mail plus un autre canal, avec une branche selon le comportement. Aide pour l'étape 4 de l'exercice.","txt":"Je suis débutant. Aidez-moi à imaginer un scénario de prospection à deux canaux : l'e-mail et [VOTRE SECOND CANAL, PAR EXEMPLE LINKEDIN OU APPEL].\nMon public : [VOTRE CIBLE]. Dites où ce public répond vraiment.\nPrévoyez au moins une branche conditionnelle selon le comportement du prospect : a ouvert sans répondre, a cliqué sur un lien, ou n'a rien fait. Présentez chaque cas sous la forme « si cet événement, alors cette action », sans répéter simplement un e-mail de relance identique.\nExpliquez « branche conditionnelle » en une phrase simple, avec la comparaison avec un « si… alors ».\nExpliquez chaque terme technique en une phrase simple.","att":"Un scénario à deux canaux avec au moins une branche « si… alors » cohérente avec un comportement réel du prospect. *Source : 03-avance-copywriting.md, l.99-107, l.112-115.* ## Questions de vérification **1. Pourquoi relire un échantillon d'une campagne IA ?** *Corrigé :* Une génération sans relecture peut produire un message incohérent ou hors sujet. **2. Pourquoi un seul élément variable en A/B test ?** *Corrigé :* Sinon on ne sait pas lequel a fait la différence. **3. Qu'est-ce qu'une variable IA ?** *Corrigé :* Une phrase entière personnalisée, générée à partir de données réelles sur le prospect. **4. À quel concept du Module 2 la liquid syntax ressemble-t-elle ?** *Corrigé :* À un IF de n8n, appliqué dans le texte d'un message. **5. Que testent en priorité les A/B tests ?** *Corrigé :* L'objet de l'e-mail et la première phrase. ## Projet [À COMPLÉTER] : le texte source ne décrit pas de projet."}],"exercice":[{"e":"Pourquoi relire un échantillon des messages générés reste-t-il indispensable ?","s":"une génération sans relecture peut produire un message incohérent ou hors sujet pour un prospect précis."},{"e":"Pourquoi ne tester qu'un seul élément variable à la fois ?","s":"tester plusieurs éléments rend impossible de savoir lequel a fait la différence."},{"e":"Quelle différence entre une variable IA et une donnée fixe comme le prénom ?","s":"la variable IA génère une phrase entière à partir de données réelles ; la donnée fixe insère une information déjà connue."},{"e":"Imaginez un scénario à deux canaux avec au moins une branche conditionnelle.","s":"pas de réponse unique : branche cohérente avec un vrai comportement observable."}],"quiz":[{"q":"Pourquoi relire un échantillon d'une campagne IA ?","x":"Une génération sans relecture peut produire un message incohérent ou hors sujet.","o":["Une génération sans relecture peu "t":"Ouverture","d":"Bonjour, je suis Zézé, fondateur de Vivier IA. Quand la recherche intégrée ne suffit plus, il faut aller chercher les données ailleurs. Dans cette section, vous verrez ce que sont le scraping, l'enrichissement et le nettoyage, pourquoi une donnée publique reste soumise au RGPD, et comment n8n peut automatiser tout ce parcours."},{"t":"Quand People Database ne suffit plus","d":"Le scraping ou l'enrichissement devient nécessaire quand l'outil intégré n'a pas votre critère. Un besoin plus précis que la recherche intégrée. Votre besoin peut être plus précis que ce que l'outil propose pour une recherche standard. Pensez-y à chaque nouveau projet : c'est un réflexe qui s'acquiert avec la pratique. Il faut alors du scraping ou un enrichissement externe, plus avancés que la recherche intégrée. Gardez cette "},{"t":"Le scraping et ses limites","d":"Une donnée publique n'est pas une zone sans règle. Extraire des données publiques, avec des règles. Le scraping extrait automatiquement des données publiques d'un site, par exemple un annuaire professionnel ou le site d'une entreprise. Cette distinction paraît simple, mais elle change vraiment la manière de répondre à un client. La pratique doit respecter les conditions d'utilisation du site, et le RGPD pour les données person"},{"t":"L'enrichissement","d":"On enrichit avant d'importer dans Lemlist. Compléter une donnée partielle. Une liste qui ne contient que cela peut être complétée. Relisez ce point avec un cas de votre propre activité, pour qu'il devienne concret. On cherche l'e-mail professionnel, le poste exact et la taille de l'entreprise. Des outils dédiés croisent plusieurs sources. Cette idée simple évite beaucoup d'erreurs, surtout au début, quand tout paraît nouveau. "},{"t":"Le nettoyage","d":"Nettoyer avant l'envoi protège directement la délivrabilité. La dernière étape avant l'envoi. Une liste enrichie contient presque toujours des doublons, des e-mails invalides ou des entrées incomplètes. Ne cherchez pas à tout retenir d'un coup : revenez à ce point à chaque projet. On supprime les doublons et on vérifie la validité des e-mails avant l'envoi. Retenez-la telle quelle, sans chercher à la compliquer, c'est ainsi qu"},{"t":"Le pipeline avec n8n","d":"n8n peut automatiser tout le pipeline, de l'enrichissement à l'import. Automatiser de bout en bout. Un workflow n8n (Module 2) appelle un outil d'enrichissement avec le nœud HTTP Request. Vous pourrez ainsi expliquer la règle simplement à un client, sans jargon. Il déduplique avec un nœud dédié, puis vérifie la validité des e-mails. Pensez à un exemple de votre propre activité pour vérifier que vous l'avez bien comprise. La li"},{"t":"Cas voisins : un outil de prospection","d":"Ce que c'est : Aucune campagne Lemlist n'a été lancée. Ces cas viennent d'un outil de prospection construit pour un réseau de vente. Les noms sont des données personnelles : Les noms de personnes qui commentent, récupérés par l'API d'un réseau social, en sont. Il faut le dire dans la politique de confidentialité. Pas de donnée inventée : Si l'API ne renvoie pas un nom, le champ reste vide et l'interface l'indique. Aucun messag"}],"icon":"🧹","sub":"Scraping, enrichissement, nettoyage et pipeline n8n : une donnée propre avant chaque envoi.","key":"Le scraping ou l'enrichissement devient nécessaire quand l'outil intégré n'a pas votre critère.","cas":{"t":"Le champ vide plus honnête","ctx":"Pipeline d'enrichissement — n8n et Lemlist.","d1":"Une donnée publique n'est pas une zone sans règle : le RGPD s'applique dès qu'une donnée personnelle est traitée, même déjà publique.","d2":"Quand l'API ne renvoie pas un champ, on le laisse vide : un champ vide est plus honnête qu'un champ inventé. On enrichit avant d'importer dans Lemlist.","lecon":"Nettoyer avant l'envoi protège directement la délivrabilité."},"prompts":[{"t":"Questions RGPD sur le scraping","use":"Pour comprendre pourquoi une donnée publique reste soumise au RGPD et préparer des questions. Aide pour l'étape 2 de l'exercice.","txt":"Je suis débutant. Je pense construire une liste de prospects à partir de données publiques d'un site : [LE TYPE DE SITE OU D'ANNUAIRE].\nExpliquez-moi en mots simples ce qu'est le scraping et pourquoi une donnée publique reste soumise aux conditions d'utilisation du site et au RGPD dès qu'elle concerne une personne.\nDonnez une courte liste de questions à se poser avant de collecter, puis trois questions à poser à un juriste. Ne donnez aucun conseil juridique.\nExpliquez chaque terme technique en une phrase simple.","att":"Le scraping expliqué, pourquoi le RGPD s'applique aussi aux données publiques, et trois questions pour un juriste. *Source : 04-aller-plus-loin.md, l.13, l.30.*"},{"t":"Checklist de nettoyage de liste","use":"Pour nettoyer une liste de prospects avant l'envoi et protéger la réputation du domaine. Aide pour l'étape 3 de l'exercice.","txt":"Je suis débutant. Avant d'envoyer une campagne, je dois nettoyer ma liste de prospects. Voici sa description, sans aucune vraie donnée : [DESCRIPTION DE VOTRE LISTE].\nExpliquez pourquoi une liste enrichie contient presque toujours des doublons, des e-mails invalides et des entrées incomplètes, et pourquoi envoyer à des adresses invalides dégrade la réputation du domaine d'envoi.\nPréparez une liste de contrôle simple : dédupliquer, vérifier la validité des e-mails, traiter les entrées incomplètes sans inventer de donnée (un champ vide vaut mieux qu'un champ inventé).\nExpliquez chaque terme technique en une phrase simple.","att":"Une liste de contrôle de nettoyage (doublons, e-mails invalides, champs vides) et le lien avec la délivrabilité. *Source : 04-aller-plus-loin.md, l.19-21, l.36.*"},{"t":"Pipeline automatisé expliqué","use":"Pour comprendre les étapes d'un pipeline automatisé, de l'enrichissement à l'import dans Lemlist. Aide pour l'étape 4 de l'exercice.","txt":"Je suis débutant. Expliquez-moi, avec une analogie de chaîne de montage, comment l'outil d'automatisation vu au module deux peut gérer un pipeline de prospection de bout en bout : appel d'un outil d'enrichissement avec HTTP Request, déduplication, vérification des e-mails, puis envoi de la liste nettoyée dans Lemlist par son API.\nMon cas : [VOTRE CAS DE PROSPECTION].\nPrésentez les étapes dans l'ordre, avec une phrase par étape. Rappelez qu'il faut protéger chaque point d'entrée d'un pipeline automatisé, sinon n'importe qui peut le déclencher. Ne me demandez aucune clé secrète.\nExpliquez chaque terme technique, comme « API », en une phrase simple.","att":"Les étapes du pipeline dans l'ordre (enrichir, dédupliquer, vérifier, importer), expliquées simplement avec une analogie. *Source : 04-aller-plus-loin.md, l.25, l.39.* ## Questions de vérification **1. Quand le scraping ou l'enrichissement devient-il nécessaire ?** *Corrigé :* Quand un critère précis manque dans l'outil intégré, ou qu'une source propre à l'activité est nécessaire. **2. Une donnée publique échappe-t-elle au RGPD ?** *Corrigé :* Non : il s'applique dès qu'une donnée personnelle est traitée, même déjà publique. **3. Pourquoi nettoyer une liste avant l'envoi ?** *Corrigé :* Des adresses invalides dégradent la réputation du domaine d'envoi. **4. Que faire d'un champ que l'API ne renvoie pas ?** *Corrigé :* Le laisser vide : un champ vide est plus honnête qu'un champ inventé. **5. Quel nœud n8n appelle un outil d'enrichissement ?** *Corrigé :* HTTP Request. ## Projet [À COMPLÉTER] : le texte source ne décrit pas de projet."}],"exercice":[{"e":"Dans quel cas le scraping ou l'enrichissement devient-il nécessaire ?","s":"quand un critère très précis manque dans l'outil intégré, ou qu'une source de données propre à l'activité est nécessaire."},{"e":"Pourquoi le scraping de données publiques n'échappe-t-il pas au RGPD ?","s":"le RGPD s'applique dès qu'une donnée personnelle est traitée, quelle que soit sa source."},{"e":"Pourquoi nettoyer une liste avant l'envoi protège-t-il la délivrabilité ?","s":"des adresses invalides dégradent la réputation du domaine d'envoi et la part de messages en boîte de réception."},{"e":"Comment n8n automatise-t-il ce pipeline de bout en bout ?","s":"HTTP Request pour l'enrichissement, nœuds dédiés pour dédupliquer et vérifier, puis import dans Lemlist par son API."},{"e":"Quelle étape du module 5 vous semble la plus déterminante, et pourquoi ?","s":"pas de réponse unique : cohérence et justification de l'argument."}],"quiz":[{"q":"Quand le scraping ou l'enrichissement devient-il nécessaire ?","x":"Quand un critère précis manque dans l'outil intégré, ou qu'une source propre à l'activité est nécessaire.","o":["Quand un critère précis manque dans l'outil intégré, ou qu'une source propre à l'activité est nécessaire","Dès le premier jour, systématiquement","Uniquement pour les grandes entreprises","Jamais, c'est interdit"],"c":0},{"q":"Une donnée publique échappe-t-elle au RGPD ?","x":"Non : il s'applique dès qu'une donnée personnelle est traitée, même déjà publique.","o":["Non : il s'applique dès qu'une donnée personnelle est traitée, même déjà publique","Oui, les données publiques sont libres d'usage","Oui, si elles viennent de LinkedIn","Seulement pour les données médicales"],"c":0},{"q":"Pourquoi nettoyer une liste avant l'envoi ?","x":"Des adresses invalides dégradent la réputation du domaine d'envoi.","o":["Des adresses invalides dégradent la réputation du domaine d'envoi","Pour réduire le nombre de campagnes","Pour accélérer l'ouverture des messages","Pour éviter les réponses"],"c":0},{"q":"Que faire d'un champ que l'API ne renvoie pas ?","x":"Le laisser vide : un champ vide est plus honnête qu'un champ inventé.","o":["Le laisser vide : un champ vide est plus honnête qu'un champ inventé","Inventer une valeur plausible","Mettre « N/A » partout","Supprimer la ligne entière"],"c":0},{"q":"Quel nœud n8n appelle un outil d'enrichissement ?","x":"HTTP Request.","o":["HTTP Request","Webhook","Merge","IF"],"c":0}],"act":{"type":"steps", /* ---- Panneau Expert ---- */
function expertHTML(s){
 if(!s.ana) return "";
 let h = '<div class="exp-panel"><span class="ep-k">🎓 L’Atelier de l’Expert</span>';
 h += '<div class="ana-box"><span class="lab">💬 Comprendre avec une image</span>'+s.ana+'</div>';
 h += '<div class="exp-box"><span class="lab">🧠 Le conseil de l’expert — 50 ans de métier</span>'+s.expert+'</div>';
 h += '<div class="exp-grid2"><div class="exp-col err"><h4>⚠️ Les erreurs qui coûtent cher</h4><ul>'+s.erreurs.map(e=>'<li>'+e+'</li>').join('')+'</ul></div>';
 h += '<div class="exp-col chk"><h4>✅ La checklist de l’expert</h4><ul>'+s.check.map(c=>'<li>'+c+'</li>').join('')+'</ul></div></div>';
 h += '<div class="act-box"><span class="lab">🎯 À faire cette semaine</span>'+s.action+'</div>';
 h += '<div class="gloss"><h4>📖 Mini-glossaire — sans jargon</h4>'+s.glossaire.map(g=>'<div class="g-row"><b>'+g[0]+'</b><span>'+g[1]+'</span></div>').join('')+'</div>';
 if (s.shots && s.shots.length) {
   h += '<div style="margin-top:16px">';
   for (const sh of s.shots) {
     h += '<figure style="margin:0 0 14px"><img src="' + sh.img + '" style="width:100%;border-radius:14px;border:1px solid var(--line);display:block" alt="Capture guidee">'
        + '<figcaption style="font-size:13px;color:var(--muted);padding:9px 4px 0"><b style="color:var(--teal2)">📸 La pratique en image —</b> ' + sh.cap + '</figcaption></figure>';
   }
   h += '</div>';
 }
 if (s.shots && s.shots.length) {
   h += '<div style="margin-top:16px">';
   for (const sh of s.shots) {
     h += '<figure style="margin:0 0 14px"><img src="' + sh.img + '" style="width:100%;border-radius:14px;border:1px solid var(--line);display:block" alt="Capture guidee">'
        + '<figcaption style="font-size:13px;color:var(--muted);padding:9px 4px 0"><b style="color:var(--teal2)">📸 La pratique en image —</b> ' + sh.cap + '</figcaption></figure>';
   }
   h += '</div>';
 }
 if (s.shots && s.shots.length) {
   h += '<div style="margin-top:16px">';
   for (const sh of s.shots) {
     h += '<figure style="margin:0 0 14px"><img src="' + sh.img + '" style="width:100%;border-radius:14px;border:1px solid var(--line);display:block" alt="Capture guidee">'
        + '<figcaption style="font-size:13px;color:var(--muted);padding:9px 4px 0"><b style="color:var(--teal2)">📸 La pratique en image —</b> ' + sh.cap + '</figcaption></figure>';
   }
   h += '</div>';
 }
 return h + '</div>';
}
