/* ---- Notes personnelles ---- */
function notesHTML(s){return '<div class="card" style="margin-top:16px"><h3><span class="ico">📝</span>Mes notes personnelles</h3><div class="hintline">✍️ Vos idées, sauvegardées automatiquement sur cet appareil.</div><textarea id="note-'+s.num+'" class="note-area" placeholder="Ex. : vérifier la pagination tarifs avant la suite, idée d\u2019automatisation pour le client X..."></textarea><div style="display:flex;gap:10px;margin-top:8px;align-items:center"><button class="btn ghost" id="notesave-'+s.num+'">💾 Sauvegarder</button><span id="notemsg-'+s.num+'" style="color:var(--ok);font-size:13px"></span></div></div>'}
function loadNote(num){try{return localStorage.getItem(LS+"_note_"+num)||""}catch(e){return""}}
function saveNote(num,val){try{localStorage.setItem(LS+"_note_"+num,val)}catch(e){}}
function initNotes(v,s){const ta=v.querySelector("#note-"+s.num);if(!ta)return;ta.value=loadNote(s.num);const btn=v.querySelector("#notesave-"+s.num),msg=v.querySelector("#notemsg-"+s.num);const doSave=()=>{saveNote(s.num,ta.value);if(msg){msg.textContent="✓ Sauvegardé";setTimeout(()=>{msg.textContent=""},1500)}};if(btn)btn.onclick=doSave;ta.addEventListener("input",()=>{clearTimeout(ta._t);ta._t=setTimeout(doSave,800)})}
/* ---- Stats ---- */
function recordStat(sec,qi,ok){if(!state.stats)state.stats={};const k=sec+"_"+qi;if(!state.stats[k])state.stats[k]={a:0,f:0};state.stats[k].a++;if(!ok)state.stats[k].f++;save()}
function statsHTML(){
 let h='<div class="sec-head"><div class="sec-num">📊</div><div><h2>Statistiques de progression</h2><div class="sub">Vue de cet appareil. L\u2019élève peut exporter ses données (JSON) et vous les transmettre pour votre suivi pédagogique.</div></div></div>';
 const done=Object.keys(state.done).length;
 h+='<div class="dash-hero-stats"><div class="stat"><b>'+done+'/'+DATA.length+'</b><span>sections validées</span></div><div class="stat"><b>'+(state.final===null?"—":state.final+"/10")+'</b><span>évaluation finale</span></div><div class="stat"><b>'+Object.keys(state.stats||{}).length+'</b><span>questions suivies</span></div></div>';
 h+='<div class="card" style="margin-top:18px"><h3><span class="ico">🎯</span>Questions les plus difficiles (taux d\u2019échec)</h3>';
 const rows=[];
 DATA.forEach(s=>(s.quiz||[]).forEach((q,i)=>{const st=state.stats&&state.stats[s.num+"_"+i];if(st&&st.a>0)rows.push({sec:s.title,q:q.q,a:st.a,f:st.f,rate:st.f/st.a});}));
 rows.sort((x,y)=>y.rate-x.rate);
 if(!rows.length)h+='<p style="color:var(--muted);font-size:14px">Pas encore de données — les statistiques apparaissent après les premiers quiz.</p>';
 rows.slice(0,8).forEach(r=>{h+='<div style="margin-bottom:12px"><div style="font-size:13.5px;margin-bottom:4px"><b style="color:var(--orange2)">'+Math.round(r.rate*100)+'% d\u2019échec</b> · '+r.q.slice(0,70)+' <span style="color:var(--dim)">('+r.sec+', '+r.a+' tentative'+(r.a>1?'s':'')+')</span></div><div style="height:8px;background:var(--bg2);border-radius:99px;overflow:hidden"><div style="height:100%;width:'+Math.round(r.rate*100)+'%;background:linear-gradient(90deg,var(--orange),var(--ko))"></div></div></div>';});
 h+='</div><div style="display:flex;gap:12px;margin-top:18px;flex-wrap:wrap"><button class="btn" onclick="exportProgress()">📤 Exporter ma progression (JSON)</button><button class="btn ghost" onclick="show(\'accueil\')">🏠 Retour</button></div>';
 return h}
function exportProgress(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="progression-vivieria.json";document.body.appendChild(a);a.click();a.remove()}
/* ---- Certificat ---- */
function showCertPrompt(score){
 if(document.getElementById("certo"))return;
 const o=document.createElement("div");o.id="certo";
 o.style.cssText="position:fixed;inset:0;background:rgba(10,20,18,.85);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px";
 o.innerHTML='<div style="background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px;max-width:420px;width:100%"><h3 style="margin-bottom:8px">🎓 Votre certificat</h3><p style="color:var(--muted);font-size:14px;margin-bottom:16px">Entrez votre nom complet tel qu\u2019il apparaîtra sur le certificat.</p><input id="certname" placeholder="Prénom et nom" style="width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:12px 15px;font-size:16px;margin-bottom:14px;box-sizing:border-box"><div style="display:flex;gap:10px"><button class="btn" id="certgo">Générer</button><button class="btn ghost" id="certcancel">Annuler</button></div></div>';
 document.body.appendChild(o);
 o.querySelector("#certcancel").onclick=()=>o.remove();
 o.querySelector("#certgo").onclick=()=>{const nm=o.querySelector("#certname").value.trim();if(!nm)return;o.remove();renderCert(nm,score);};
}
function renderCert(name,score){
 const old=document.getElementById("cert");if(old)old.remove();
 const d=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
 const c=document.createElement("div");c.id="cert";
 c.style.cssText="position:fixed;inset:0;z-index:1001;background:#fdfbf7;color:#113832;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Georgia,serif";
 c.innerHTML='<div id="certinner" style="max-width:820px;width:100%;border:6px double #113832;border-radius:8px;padding:44px 50px;text-align:center;position:relative;background:radial-gradient(circle at 50% -20%,rgba(95,199,184,.18),transparent 60%),#fdfbf7">'
 +'<div style="font-size:15px;letter-spacing:4px;color:#e16139;font-weight:700">🌱 VIVIER IA</div>'
 +'<div style="font-size:12px;color:#3d635d;margin-bottom:26px">Le vivier des talents IA francophones</div>'
 +'<div style="font-size:34px;font-weight:800;margin-bottom:6px">Certificat de réussite</div>'
 +'<div style="font-size:15px;color:#3d635d;margin-bottom:26px">'+MODULE_TITLE+'</div>'
 +'<div style="font-size:16px;color:#3d635d">Nous attestons que</div>'
 +'<div style="font-size:30px;font-weight:800;color:#113832;margin:10px 0;border-bottom:2px solid #e16139;display:inline-block;padding:0 30px 6px">'+name+'</div>'
 +'<div style="font-size:15px;color:#3d635d;margin-bottom:22px">a validé la formation avec succès — score final : <b style="color:#e16139">'+score+'/10</b></div>'
 +'<div style="display:flex;justify-content:space-between;margin-top:44px;font-size:13px;color:#3d635d"><div>Fait le '+d+'</div><div style="text-align:center">Zézé Bilivogui<br><span style="font-size:11px">Fondateur de Vivier IA</span></div></div>'
 +'</div>';
 document.body.appendChild(c);
 const bar=document.createElement("div");bar.id="certbar";bar.style.cssText="position:fixed;bottom:18px;left:0;right:0;text-align:center;z-index:1002";
 bar.innerHTML='<button class="btn" id="certprint" style="margin-right:10px">🖨️ Imprimer / Enregistrer en PDF</button><button class="btn ghost" id="certclose">Fermer</button>';
 document.body.appendChild(bar);
 bar.querySelector("#certprint").onclick=()=>window.print();
 bar.querySelector("#certclose").onclick=()=>{c.remove();bar.remove();};
}

/* ================= MOTEUR ================= */
const LS="vivierIA_m5_v3";
let _mem='{"done":{},"final":null}';
let state;
try{state=JSON.parse(localStorage.getItem(LS)||_mem)}catch(e){state=JSON.parse(_mem)}
function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function copyText(btn,txt){navigator.clipboard.writeText(txt).then(()=>{btn.textContent="✓ Copié !";setTimeout(()=>btn.textContent="📋 Copier",1600)})}
function progUpdate(){const n=Object.keys(state.done).length;$("#progBar").style.width=(n/DATA.length*100)+"%";$("#progTxt").textContent=n+" / "+DATA.length+" sections";document.querySelectorAll(".tab").forEach((t,i)=>{if(i>0&&state.done[DATA[i-1].num])t.classList.add("done")});document.querySelectorAll(".dc-prog>div").forEach((d,i)=>{d.style.width=(state.done[DATA[i].num]?100:0)+"%"});document.querySelectorAll(".dc-state").forEach((d,i)=>{if(state.done[DATA[i].num]){d.textContent="✓ Terminé";d.classList.add("ok")}else{d.textContent="À faire";d.classList.remove("ok")}})}

/* ---- Construction des onglets ---- */
const TABS=[{id:"accueil",label:"🏠 Accueil"}].concat(DATA.map(d=>({id:"s"+d.num,label:d.icon+" "+d.num}))).concat([{id:"stats",label:"📊 Stats"},{id:"final",label:"🏆 Évaluation finale"}]);
$("#tabs").innerHTML=TABS.map((t,i)=>`<div class="tab" data-v="${t.id}" data-i="${i}"><span class="dot">${i===0?"🏠":t.id==="final"?"🏆":t.id==="stats"?"📊":DATA[i-1].num}</span>${t.label}</div>`).join("");
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>show(t.dataset.v));

const RULES=[
 ["🔥","Le warm-up n'est pas optionnel","Une boîte neuve sans warm-up finit en spam, même avec un excellent message."],
 ["📬","SPF, DKIM, DMARC : prouver que l'envoi est légitime","La délivrabilité se construit avant la première campagne."],
 ["🧪","MVP avant V1, même en prospection","20 à 50 prospects maximum pour valider la séquence avant d'élargir."],
 ["✍️","Un seul élément variable à la fois","Sinon on ne sait pas lequel a fait la différence."],
 ["🎭","Personnaliser, pas décorer","Une variable IA mal alimentée produit une phrase générique."],
 ["🧹","Nettoyer avant l'envoi protège la délivrabilité","Des adresses invalides dégradent la réputation du domaine."],
 ["🤝","On automatise l'avertissement, pas la relation","Chaque message doit apporter quelque chose de nouveau."]
];

/* ---- Vues ---- */
function show(id){
 document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===id));
 const m=$("#main");m.innerHTML="";const v=document.createElement("div");v.className="view on";
 if(id==="accueil")v.innerHTML=accueilHTML();
 else if(id==="stats")v.innerHTML=statsHTML();
 else if(id==="final")v.innerHTML=finalHTML(),initFinal(v);
 else{const s=DATA.find(d=>"s"+d.num===id);v.innerHTML=sectionHTML(s);initSection(v,s)}
 m.appendChild(v);window.scrollTo({top:0});
}
function accueilHTML(){
 const n=Object.keys(state.done).length;
 return `<div class="hero">
  <span class="kicker">Formation interactive · 7 sections · cas réels d'octobre 2026</span>
  <h1>Prospection et Lemlist, sans jargon</h1>
  <p>Bienvenue dans le module 5 de Vivier IA, en version pratique et interactive. Chaque section combine : les concepts clés à découvrir au clic, un cas réel, un atelier interactif, un quiz de validation, les prompts prêts à copier-coller et l'exercice sur votre propre projet. Votre progression est sauvegardée dans ce navigateur.</p>
  <div class="dash-hero-stats">
   <div class="stat"><b>${n}/${DATA.length}</b><span>sections validées</span></div>
   <div class="stat"><b>12</b><span>prompts à copier</span></div>
   <div class="stat"><b>20</b><span>questions de quiz</span></div>
   <div class="stat"><b>4</b><span>ateliers interactifs</span></div>
  </div></div>
 <div class="hintline" style="margin-top:22px">🖱️ Cliquez sur une section pour commencer — les concepts se révèlent un par un, comme dans la vidéo.</div>
 <div class="dash-grid">${DATA.map(d=>`<div class="dash-card" onclick="show('s${d.num}')">
   <div class="dc-num">SECTION ${d.num}</div><h3>${d.icon} ${d.title}</h3><p>${d.sub}</p>
   <div class="dc-foot"><div class="dc-prog"><div></div></div><span class="dc-state">À faire</span></div></div>`).join("")}
 </div>
 <div class="card" style="margin-top:24px"><h3><span class="ico">📜</span>Les 7 règles d'or du module</h3>
  <div class="rulette">${RULES.map(r=>`<div class="rule"><b>${r[0]} ${r[1]}</b>${r[2]}</div>`).join("")}</div>
  <div class="safe-note" style="margin-top:16px">🛡️ <div><strong>Règle de sécurité permanente :</strong> ne montrez jamais de vraie clé, mot de passe ou donnée de client. Travaillez sur vos propres projets, en local ou en test — jamais en production. Et aucune vraie musique ou donnée bancaire dans vos démonstrations.</div></div>
 </div>`;
}
function sectionHTML(s){
 return `<div class="sec-head"><div class="sec-num">${s.num}</div><div><h2>${s.icon} ${s.title}</h2><div class="sub">${s.sub}</div></div></div>
 <div class="grid2"><div>
  <div class="card"><h3><span class="ico">💡</span>Les concepts clés</h3>
   <div class="hintline">▶ Cliquez sur chaque concept pour le révéler (comme les diapositives animées).</div>
   ${s.concepts.map((c,i)=>`<div class="concept card" style="padding:14px 16px;margin-bottom:9px"><div class="c-t">${c.t}<span class="plus">+</span></div><div class="c-body">${c.d}</div></div>`).join("")}
  </div>
  <div class="key-banner"><span class="kb-ico">🔑</span><div><div class="kb-l">À retenir</div><p>${s.key}</p></div></div>
  <div class="flip"><div class="flip-in">
   <div class="flip-face flip-front"><span class="tag">📂 Cas réel</span><h4>${s.cas.t}</h4><p><strong>${s.cas.ctx}</strong></p><p>${s.cas.d1}</p><span class="cta">👉 Cliquez pour découvrir la suite et la leçon</span></div>
   <div class="flip-face flip-back"><span class="tag">🎓 La leçon</span><p>${s.cas.d2}</p><p style="color:var(--txt);font-weight:600">${s.cas.lecon}</p></div>
  </div></div>
 </div><div>
  <div class="card"><h3><span class="ico">🏋️</span>À vous de pratiquer</h3>
   ${s.exercice.map((e,i)=>`<div class="step"><div class="sn">${i+1}</div><div>${e.e}<br><span class="sig">✓ Signal de réussite : ${e.s}</span></div></div>`).join("")}
  </div>
  <div class="card" style="margin-top:16px"><h3><span class="ico">🧪</span>Quiz de validation</h3><div id="quiz-${s.num}"></div><div class="quiz-score" id="qs-${s.num}"></div></div>
 </div></div>
 ${notesHTML(s)}<div class="act"><div class="act-h"><div class="a-ico">${s.act.icon||"🧰"}</div><h3>${s.act.title}</h3></div><div class="act-sub">${s.act.sub}</div><div id="act-${s.num}"></div></div>
 <div class="card"><h3><span class="ico">📋</span>Prompts prêts à copier</h3>
  <div class="safe-note">🛡️ <div>Mode d'emploi : 1) ouvrez Claude et démarrez une conversation neuve ; 2) copiez le prompt et remplacez les <strong>[crochets]</strong> par vos informations fictives ou non sensibles ; 3) relisez la réponse et comparez-la au résultat attendu. <strong>Ne collez jamais une vraie clé, un mot de passe ou une donnée de client.</strong></div></div>
  ${s.prompts.map((p,i)=>`<div class="prompt"><div class="p-head"><span class="p-title">${i+1}. ${p.t}</span><span class="p-use">— ${p.use}</span><button class="copy-btn">📋 Copier</button></div><pre>${esc(p.txt)}</pre><div class="p-expected"><b>Résultat attendu :</b> ${p.att}</div></div>`).join("")}
 </div>
 ${expertHTML(s)}<div style="display:flex;gap:12px;margin-top:24px;flex-wrap:wrap"><button class="btn violet" onclick="show('accueil')">🏠 Retour à l'accueil</button>${DATA.findIndex(d=>d.num===s.num)<DATA.length-1?`<button class="btn" onclick="show('s${DATA[DATA.findIndex(d=>d.num===s.num)+1].num}')">Section suivante →</button>`:`<button class="btn" onclick="show('final')">🏆 Aller à l'évaluation finale →</button>`}</div>`;
}
function initSection(v,s){
 v.querySelector(".flip").onclick=e=>e.currentTarget.classList.toggle("flipped");
 v.querySelectorAll(".concept").forEach(c=>c.onclick=()=>c.classList.toggle("open"));
 initNotes(v,s);
 v.querySelectorAll(".copy-btn").forEach(b=>b.onclick=()=>copyText(b,b.closest(".prompt").querySelector("pre").textContent));
 initQuiz(v,s);initAct(v,s);
}
/* ---- Quiz ---- */
function initQuiz(v,s){
 const box=v.querySelector("#quiz-"+s.num),sc=v.querySelector("#qs-"+s.num);
 box.innerHTML=s.quiz.map((q,i)=>`<div class="quiz-q"><div class="qq"><span class="qn">${i+1}</span>${q.q}</div>${q.o.map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${o}</button>`).join("")}<div class="q-expl" id="ex-${s.num}-${i}">💡 ${q.x}</div></div>`).join("")+`<button class="btn" id="qb-${s.num}" style="display:none">Valider ma note</button>`;
 const answers={};let locked=false;
 box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  if(locked)return;const i=+b.dataset.q;answers[i]=+b.dataset.j;
  box.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>x.classList.remove("good","bad"));
  b.classList.add("good");
  box.querySelector("#ex-"+s.num+"-"+i).classList.add("show");
  if(Object.keys(answers).length===s.quiz.length){const btn=box.querySelector("#qb-"+s.num);btn.style.display="inline-block";btn.onclick=()=>{
   locked=true;let n=0;s.quiz.forEach((q,i)=>{if(answers[i]===q.c)n++;recordStat(s.num,i,answers[i]===q.c);box.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>{x.disabled=true;if(+x.dataset.j===q.c)x.classList.add("good");else if(answers[i]===+x.dataset.j)x.classList.add("bad")})});
   const win=n>=4;sc.className="quiz-score show "+(win?"win":"retry");
   sc.innerHTML=win?`🎉 Score : ${n}/5 — Section validée ! ${n===5?"Score parfait, bravo.":"Relisez la question ratée pour viser le 5/5."}`:`Score : ${n}/5 — Il faut 4/5 pour valider. Relisez les explications et réessayez.`;
   if(win){state.done[s.num]=true;save();progUpdate()}
  }}
 });
}
/* ---- Ateliers interactifs (atelier générique piloté par les données) ---- */
function initAct(v,s){ actSteps(v.querySelector("#act-"+s.num), s.act.steps); }
function actSteps(box,steps){
 let i=0,score=0;box.innerHTML='<div id="gz"></div>';const z=box.querySelector("#gz");
 function step(){if(i>=steps.length){z.innerHTML=`<div class="final-hero"><div class="big-emoji">${score>=steps.length-1?"🏆":"📝"}</div><h3>Score : ${score}/${steps.length}</h3><p style="color:var(--muted);margin-top:8px">${score>=steps.length-1?"Beau réflexe : la réputation de votre boîte est entre de bonnes mains.":"Relisez les explications, puis retentez : chaque situation est tirée du cours."}</p></div>`;return}
  const S=steps[i];z.innerHTML=`<div class="hintline">Situation ${i+1}/${steps.length}</div><div class="card" style="background:var(--bg2)"><strong>${S.q}</strong><br><br>${S.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}<div class="feedback" id="gfb"></div></div>`;
  z.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const win=+b.dataset.j===S.c;if(win)score++;z.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.j===S.c)x.classList.add("good");else if(x===b)x.classList.add("bad")});
   const fb=z.querySelector("#gfb");fb.className="feedback show "+(win?"ok":"ko");fb.innerHTML=(win?"✅ ":"⚠️ ")+S.x;setTimeout(()=>{i++;step()},2400)})}
 step();
}
/* ---- Évaluation finale ---- */
function finalHTML(){
 const n=Object.keys(state.done).length;
 return `<div class="sec-head"><div class="sec-num">🏆</div><div><h2>Évaluation finale du module</h2><div class="sub">10 questions mélangées tirées des 7 sections. 8 bonnes réponses pour valider le module. ${state.final!==null?`<strong style="color:var(--orange2)">Dernière tentative : ${state.final}/10</strong>`:""}</div></div></div>
 ${n<7?`<div class="safe-note">📌 <div>Vous avez validé ${n}/7 sections. L'évaluation est disponible à tout moment, mais les sections non validées comptent aussi pour finir le module.</div></div>`:""}
 ${state.final>=8?'<div class="card" style="margin-bottom:16px;border-color:var(--gold)"><h3><span class="ico">🎓</span>Votre certificat est prêt</h3><p style="color:var(--muted);font-size:14px;margin-bottom:12px">Score final : <b style="color:var(--gold)">'+(state.final)+'/10</b> — générez votre certificat nominatif, imprimable ou enregistrable en PDF.</p><button class="btn" onclick="showCertPrompt(state.final)">🎓 Générer mon certificat</button></div>':''}<div class="card" id="finalbox"></div>`;
}
function initFinal(v){
 const box=v.querySelector("#finalbox");
 box.innerHTML=FINAL.map((q,i)=>`<div class="quiz-q"><div class="qq"><span class="qn">${i+1}</span>${q.q} <span style="color:var(--dim);font-size:12px">(section ${q.s})</span></div>${q.o.map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${o}</button>`).join("")}<div class="q-expl" id="fx-${i}"></div></div>`).join("")+`<button class="btn" id="fgo" style="display:none;margin-top:6px">Valider l'évaluation</button><div class="quiz-score" id="fres"></div>`;
 const ans={};let locked=false;
 box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(locked)return;const i=+b.dataset.q;ans[i]=+b.dataset.j;box.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>x.classList.remove("good","bad"));b.classList.add("good");
  if(Object.keys(ans).length===FINAL.length){const g=box.querySelector("#fgo");g.style.display="inline-block";g.onclick=()=>{
   locked=true;let n=0;FINAL.forEach((q,i)=>{if(ans[i]===q.c)n++;box.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>{x.disabled=true;if(+x.dataset.j===q.c)x.classList.add("good");else if(ans[i]===+x.dataset.j)x.classList.add("bad")});const ex=box.querySelector("#fx-"+i);ex.textContent="💡 Réponse liée à la section "+q.s+" — voir la section correspondante pour réviser.";ex.classList.add("show")});
   state.final=n;save();const r=box.querySelector("#fres");const win=n>=8;r.className="quiz-score show "+(win?"win":"retry");
   r.innerHTML=win?`🏆 ${n}/10 — Module validé ! Vous avez terminé les cinq modules de la formation Vivier IA. Félicitations ! Idée centrale à emporter : on apprend à diriger un agent qui code, en cadrant, en vérifiant et en choisissant les outils selon le besoin plutôt que par habitude.`:`${n}/10 — Il faut 8/10. Les questions ratées sont signalées avec leur section : retournez y jeter un œil, puis recommencez.`;
   if(win){setTimeout(()=>showCertPrompt(n),1200);const em=["🎉","🌟","🚀","🎊","🏆","💜","🧡"];for(let k=0;k<40;k++){const c=document.createElement("div");c.className="confetti";c.textContent=em[k%em.length];c.style.left=Math.random()*100+"vw";c.style.animationDuration=(2+Math.random()*2)+"s";c.style.animationDelay=(Math.random()*1.2)+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),5000)}}}}});
}
/* ---- Init ---- */
progUpdate();show("accueil");

</script>
</body>
</html>
