<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Vignette de la vidéo de présentation</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Public+Sans:wght@600;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden}
body{position:relative;background:radial-gradient(900px 600px at 85% 15%,#1d5a50,#113832 55%,#0b2622);font-family:"Public Sans",system-ui,sans-serif;color:#eaf5f2}
.trame{position:absolute;inset:0;background:radial-gradient(rgba(234,245,242,.10) 1.5px,transparent 1.5px) 0 0/22px 22px;mask-image:radial-gradient(700px 520px at 30% 50%,#000,transparent)}
.lueur1{position:absolute;width:640px;height:640px;right:-120px;top:-160px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,77,.38),transparent 65%)}
.lueur2{position:absolute;width:560px;height:560px;left:-160px;bottom:-200px;border-radius:50%;background:radial-gradient(circle,rgba(95,199,184,.35),transparent 65%)}
.texte{position:absolute;left:70px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.kick{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;padding:9px 18px;border-radius:99px;border:2px solid rgba(95,199,184,.45);background:rgba(95,199,184,.12);font:700 18px "Space Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#5fc7b8}
.kick i{width:10px;height:10px;border-radius:50%;background:#ff7a4d;display:block}
h1{font:800 78px/1.02 Fraunces,Georgia,serif;letter-spacing:-.025em}
h1 em{font-style:normal;color:#5fc7b8}
p{font:600 26px/1.35 "Public Sans",sans-serif;color:rgba(234,245,242,.82);max-width:560px}
.nom{display:flex;align-items:center;gap:14px;margin-top:6px;font:800 22px "Public Sans",sans-serif}
.nom span{display:block;font:700 15px "Space Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#5fc7b8;margin-top:3px}
.photo{position:absolute;right:70px;top:100px;width:500px;height:500px}
.photo .anneau{position:absolute;inset:-22px;border-radius:50%;border:4px dashed rgba(95,199,184,.6)}
.photo .anneau2{position:absolute;inset:-52px;border-radius:50%;border:2px solid rgba(255,122,77,.35)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;border-radius:50%;border:10px solid #2b8c82;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.play{position:absolute;left:50%;bottom:-38px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:#ff7a4d;color:#113832;border-radius:99px;padding:16px 34px 16px 18px;white-space:nowrap;font:800 26px "Public Sans",sans-serif;box-shadow:0 18px 44px rgba(255,122,77,.5)}
.play b{display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:#113832}
.play svg{margin-left:4px}
.duree{position:absolute;right:24px;bottom:24px;background:rgba(0,0,0,.65);color:#fff;font:700 22px "Space Mono",monospace;padding:6px 14px;border-radius:8px}
</style>
</head>
<body>
<div class="trame"></div><div class="lueur1"></div><div class="lueur2"></div>
<div class="texte">
  <div class="kick"><i></i>Présentation</div>
  <h1>Découvre <em>Vivier Academies</em></h1>
  <p>La plateforme, la formation, la communauté, et Chatllow, en cinq minutes.</p>
  <div class="nom"><div>Zézé Bilivogui<span>Expert Agentic Coding</span></div></div>
</div>
<div class="photo">
  <div class="anneau2"></div><div class="anneau"></div>
  <img src="../scenes/assets/zeze-bilivogui.jpg" alt="">
  <div class="play"><b><svg width="26" height="28" viewBox="0 0 26 28"><path d="M2 2l22 12L2 26z" fill="#ff7a4d"/></svg></b>Lancer la vidéo</div>
</div>
<div class="duree">5:20</div>
</body>
</html>
