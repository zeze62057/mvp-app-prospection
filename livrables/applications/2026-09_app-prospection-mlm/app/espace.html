<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kora — Mon espace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
  .esp-wrap { max-width: 720px; margin: 0 auto; padding: 40px 24px 64px; }
  .esp-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card);
    box-shadow: var(--shadow-card); padding: 28px;
  }
  .esp-card h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  .esp-card p { font-size: 15px; color: var(--ink-2); padding-top: 10px; line-height: 1.6; }
  .esp-soon { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
  .esp-soon div {
    font-size: 13.5px; color: var(--ink-3); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  .esp-actions { margin-top: 22px; }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand"><div class="brand__mark">K</div><div class="brand__name">Kora</div></div>
    </div>
  </header>
  <main class="esp-wrap">
    <div class="esp-card" id="espace">
      <p>Chargement…</p>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="espace.js"></script>
</body>
</html>
