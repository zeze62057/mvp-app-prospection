<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kora — Rejoindre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
  .join-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .join-card {
    width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; box-shadow: 0 30px 60px -30px rgba(11,18,32,0.28); padding: 32px; text-align: center;
  }
  .join-card .brand { justify-content: center; padding-bottom: 18px; }
  .join-card h1 { font-size: 20px; font-weight: 700; }
  .join-card p { font-size: 14.5px; color: var(--ink-2); padding-top: 10px; line-height: 1.55; }
</style>
</head>
<body>
<div class="join-wrap">
  <div class="join-card">
    <div class="brand">
      <div class="brand__mark">K</div>
      <div class="brand__name">Kora</div>
    </div>
    <h1>Ton espace</h1>
    <p id="msg">Ouverture de ton accès…</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="rejoindre.js"></script>
</body>
</html>
