<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #14161F; } a:hover { color: #3E5CF0; }
    .swatch { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; }
  </style>
</helmet>
<div style="width: 960px; height: 680px; background: #FCFCFB; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; padding: 56px; font-family: 'IBM Plex Sans', sans-serif;">

  <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #8B8D97; text-transform: uppercase;">Identite Chatllow</div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 24px;">
    <div style="display: flex; align-items: center; gap: 22px;">
      <svg width="72" height="72" viewBox="0 0 64 64" fill="none">
        <rect x="4" y="4" width="40" height="40" rx="13" fill="#14161F" opacity="0.14"/>
        <rect x="20" y="20" width="40" height="40" rx="13" fill="oklch(62% 0.19 250)"/>
      </svg>
      <div style="font-family: 'Space Grotesk', sans-serif; font-size: 76px; font-weight: 600; letter-spacing: -0.02em; color: #14161F; line-height: 1;">Chatllow</div>
    </div>
    <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5B5D68;">Diagnostic IA pour décideurs</div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: flex-end;">
    <div style="display: flex; gap: 20px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="swatch" style="background: #14161F;"></div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5B5D68;">#14161F</div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="swatch" style="background: oklch(62% 0.19 250);"></div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5B5D68;">indigo</div>
      </div>
    </div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5B5D68; text-align: right; line-height: 1.6;">
      Space Grotesk / IBM Plex Sans<br>
      Retenue le 2026-09-16 (piste "Signal net")
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
