<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #E9ECEE; } a:hover { color: oklch(65% 0.12 190); }
    .swatch { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; }
  </style>
</helmet>
<div style="width: 960px; height: 680px; background: #262A30; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; padding: 56px; font-family: 'IBM Plex Sans', sans-serif; position: relative; overflow: hidden;">

  <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(233,236,238,0.045) 40px), repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(233,236,238,0.045) 40px);"></div>

  <div style="display: flex; justify-content: space-between; align-items: center; position: relative;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #8B9096; text-transform: uppercase;">Option D</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #8B9096; text-transform: uppercase;">Rigueur analytique</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 26px; position: relative;">
    <div style="display: flex; align-items: flex-end; gap: 6px; height: 40px;">
      <div style="width: 12px; height: 16px; background: oklch(65% 0.12 190);"></div>
      <div style="width: 12px; height: 28px; background: oklch(65% 0.12 190);"></div>
      <div style="width: 12px; height: 40px; background: oklch(65% 0.12 190);"></div>
    </div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 72px; font-weight: 600; letter-spacing: -0.01em; color: #E9ECEE; line-height: 1;">Chatllow</div>
    <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #9BA0A6;">Analyse et deploiement d'IA</div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: flex-end; position: relative;">
    <div style="display: flex; gap: 20px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="swatch" style="background: #262A30; border: 1px solid #454A51;"></div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9BA0A6;">#262A30</div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="swatch" style="background: oklch(65% 0.12 190);"></div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9BA0A6;">teal</div>
      </div>
    </div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9BA0A6; text-align: right; line-height: 1.6;">
      IBM Plex Mono / IBM Plex Sans<br>
      Ton : technique, rigoureux, orienté données
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
