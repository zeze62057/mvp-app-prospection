<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #16213A; } a:hover { color: #3A4A6B; }
    .swatch { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; }
  </style>
</helmet>
<div style="width: 960px; height: 680px; background: #FAF8F4; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; padding: 56px; font-family: 'IBM Plex Sans', sans-serif;">

  <div style="display: flex; justify-content: space-between; align-items: center;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #8A8477; text-transform: uppercase;">Option A</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #8A8477; text-transform: uppercase;">Sobre &amp; institutionnel</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 28px;">
    <div style="font-family: 'Source Serif 4', serif; font-size: 88px; font-weight: 500; letter-spacing: -0.01em; color: #16213A; line-height: 1;">Chatllow</div>
    <div style="width: 160px; height: 1px; background: #16213A;"></div>
    <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #5B5648;">Conseil en intelligence artificielle</div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: flex-end;">
    <div style="display: flex; gap: 20px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="swatch" style="background: #16213A;"></div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5B5648;">#16213A</div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="swatch" style="background: #FAF8F4; border: 1px solid #D8D2C4;"></div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5B5648;">#FAF8F4</div>
      </div>
    </div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5B5648; text-align: right; line-height: 1.6;">
      Source Serif 4 / IBM Plex Sans<br>
      Ton : cabinet établi, retenue, crédibilité immédiate
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
