<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Vivier IA : images de la vitrine et de la communauté</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #F2F7F5; overflow: hidden; }
  svg { display: block; }
  .apercu { padding: 24px; display: grid; gap: 24px; font-family: system-ui, sans-serif; color: #113832; overflow: auto; }
  .apercu figure { display: block; }
  .apercu figcaption { font-size: 14px; margin-bottom: 6px; }
</style>
</head>
<body>
<script>
// Couleurs de la charte Vivier IA. Aucune image contient de texte.
const K = { ink: '#113832', teal: '#2B8C82', tealL: '#5FC7B8', coral: '#FF7A4D', d1: '#16443c', d2: '#0b2622' };

const TAILLES = {
  'methode': [760, 448],
  'comp-1': [760, 224], 'comp-2': [760, 224], 'comp-3': [760, 224], 'comp-4': [760, 224], 'comp-5': [760, 224], 'comp-6': [760, 224],
  'eco-1': [760, 320], 'eco-2': [760, 320], 'eco-3': [760, 320],
  'banniere': [1600, 400],
  'communaute-banniere': [600, 320],
};

const ring = (x, y, r, sw = 10, c = K.tealL, o = 1) => `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-opacity="${o}"/>`;
const dot = (x, y, r, c = K.coral, o = 1) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" fill-opacity="${o}"/>`;
const line = (x1, y1, x2, y2, sw = 10, c = K.tealL, o = 1) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${sw}" stroke-opacity="${o}" stroke-linecap="round"/>`;
// La Clé : anneau, trait en diagonale, point d'accès corail (proportions du logo).
const cle = (x, y, s, c = K.tealL) =>
  ring(x, y, 22 * s, 9 * s, c) + line(x + 16 * s, y - 16 * s, x + 50 * s, y - 50 * s, 9 * s, c) + dot(x + 50 * s, y - 50 * s, 9 * s);

function fond(w, h, glowA, glowB, id) {
  return `<defs>
    <linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${K.d1}"/><stop offset="1" stop-color="${K.d2}"/></linearGradient>
    <radialGradient id="a${id}" cx="${glowA[0]}" cy="${glowA[1]}" r="0.6"><stop offset="0" stop-color="${glowA[2]}" stop-opacity="${glowA[3]}"/><stop offset="1" stop-color="${glowA[2]}" stop-opacity="0"/></radialGradient>
    <radialGradient id="b${id}" cx="${glowB[0]}" cy="${glowB[1]}" r="0.5"><stop offset="0" stop-color="${glowB[2]}" stop-opacity="${glowB[3]}"/><stop offset="1" stop-color="${glowB[2]}" stop-opacity="0"/></radialGradient>
    <pattern id="p${id}" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="2.4" fill="#EAF5F2" fill-opacity="0.14"/></pattern>
  </defs>
  <rect width="${w}" height="${h}" fill="url(#g${id})"/>
  <rect width="${w}" height="${h}" fill="url(#a${id})"/>
  <rect width="${w}" height="${h}" fill="url(#b${id})"/>
  <rect width="${w}" height="${h}" fill="url(#p${id})"/>`;
}
const TEAL_GLOW = [0.2, 0.15, K.tealL, 0.5];
const CORAL_GLOW = [0.85, 0.2, K.coral, 0.32];

const COMPOSITIONS = {
  'methode': () => {
    const pts = [[120, 350], [255, 285], [385, 225], [520, 160], [645, 95]];
    let s = ring(150, 400, 210, 6, K.tealL, 0.12);
    for (let i = 0; i < pts.length - 1; i++) s += line(...pts[i], ...pts[i + 1], 8, K.tealL, 0.55);
    pts.slice(0, -1).forEach(p => { s += dot(p[0], p[1], 34, K.d2) + ring(p[0], p[1], 26, 10); });
    s += ring(pts[4][0], pts[4][1], 58, 4, K.coral, 0.5) + dot(pts[4][0], pts[4][1], 30);
    return fond(760, 448, TEAL_GLOW, CORAL_GLOW, 'm') + s;
  },
  'comp-1': () => fond(760, 224, TEAL_GLOW, CORAL_GLOW, 'c1') + cle(470, 135, 1.8),
  'comp-2': () => fond(760, 224, TEAL_GLOW, CORAL_GLOW, 'c2') +
    ring(430, 90, 52, 8, K.tealL, 0.95) + ring(525, 110, 52, 8, K.tealL, 0.7) + ring(620, 85, 52, 8, K.tealL, 0.45) + dot(477, 100, 12),
  'comp-3': () => {
    const p = [[300, 150], [405, 125], [510, 95], [610, 60], [700, 35]];
    let s = '';
    for (let i = 0; i < p.length - 1; i++) s += line(...p[i], ...p[i + 1], 7, K.tealL, 0.55);
    p.slice(0, -1).forEach(q => { s += dot(q[0], q[1], 13, K.tealL); });
    return fond(760, 224, TEAL_GLOW, CORAL_GLOW, 'c3') + s + dot(p[4][0], p[4][1], 18);
  },
  'comp-4': () => fond(760, 224, TEAL_GLOW, CORAL_GLOW, 'c4') +
    ring(590, 115, 34, 6, K.tealL, 0.95) + ring(590, 115, 64, 6, K.tealL, 0.55) + ring(590, 115, 94, 6, K.tealL, 0.3) + dot(590, 115, 11),
  'comp-5': () => {
    let s = '';
    for (let r = 0; r < 2; r++) for (let i = 0; i < 4; i++) {
      const x = 380 + i * 92, y = 60 + r * 78;
      s += (r === 0 && i === 2) ? dot(x, y, 15) : ring(x, y, 24, 7, K.tealL, r ? 0.6 : 0.9);
    }
    return fond(760, 224, TEAL_GLOW, CORAL_GLOW, 'c5') + s;
  },
  'comp-6': () => fond(760, 224, TEAL_GLOW, CORAL_GLOW, 'c6') +
    line(436, 100, 604, 100, 8, K.tealL, 0.6) + ring(400, 100, 36, 9) + ring(640, 100, 36, 9) + dot(520, 100, 15),
  'eco-1': () => {
    const hub = [500, 135], sats = [[375, 85], [395, 195], [625, 80], [640, 190], [520, 50]];
    let s = '';
    sats.forEach(p => { s += line(hub[0], hub[1], p[0], p[1], 5, K.tealL, 0.5); });
    sats.forEach(p => { s += dot(p[0], p[1], 26, K.d2) + ring(p[0], p[1], 20, 6, K.tealL, 0.85); });
    s += dot(hub[0], hub[1], 50, K.d2) + ring(hub[0], hub[1], 42, 10) + dot(hub[0], hub[1], 14);
    return fond(760, 320, TEAL_GLOW, CORAL_GLOW, 'e1') + s;
  },
  'eco-2': () => {
    let s = '';
    [[300, 45], [400, 85], [500, 125], [600, 165]].forEach(([x, h], i) => {
      s += `<rect x="${x}" y="${215 - h}" width="80" height="${h}" rx="14" fill="${i === 3 ? K.tealL : 'none'}" fill-opacity="${i === 3 ? 0.9 : 0}" stroke="${K.tealL}" stroke-width="6" stroke-opacity="${0.55 + i * 0.15}"/>`;
    });
    return fond(760, 320, TEAL_GLOW, CORAL_GLOW, 'e2') + s + dot(640, 38, 14);
  },
  'eco-3': () => fond(760, 320, TEAL_GLOW, CORAL_GLOW, 'e3') + ring(430, 185, 160, 5, K.tealL, 0.16) + cle(430, 190, 2.5),
  'banniere': () => fond(1600, 400, [0.1, 0.2, K.tealL, 0.35], [0.9, 0.5, K.coral, 0.22], 'b') +
    ring(1400, 150, 120, 6, K.tealL, 0.25) + ring(1400, 150, 190, 6, K.tealL, 0.17) + ring(1400, 150, 260, 6, K.tealL, 0.1) + dot(1400, 150, 14, K.coral, 0.9),
  'communaute-banniere': () => fond(600, 320, [0.15, 0.1, K.tealL, 0.4], [0.9, 0.15, K.coral, 0.4], 'cb') + ring(360, 230, 150, 5, K.tealL, 0.14) + cle(340, 225, 2.2),
};

// Le site cadre les images "cover, centre haut" : on centre chaque motif sur la largeur pour qu'un
// rognage horizontal (carte plus etroite) ne coupe jamais le motif.
const DX = { 'comp-1': -120, 'comp-2': -145, 'comp-3': -120, 'comp-4': -210, 'comp-5': -138, 'comp-6': -140, 'eco-1': -127, 'eco-2': -110, 'eco-3': -100 };
function rendu(n) {
  const s = COMPOSITIONS[n]();
  const dx = DX[n] || 0;
  if (!dx) return s;
  const i = s.lastIndexOf('fill="url(#p');
  const j = s.indexOf('/>', i) + 2;
  return s.slice(0, j) + `<g transform="translate(${dx},0)">` + s.slice(j) + '</g>';
}

const params = new URLSearchParams(location.search);
const nom = params.get('nom');
if (nom === 'apercu') {
  document.body.classList.add('apercu');
  Object.keys(TAILLES).forEach(n => {
    const [w, h] = TAILLES[n];
    document.body.insertAdjacentHTML('beforeend', `<figure><figcaption>${n} (${w} x ${h})</figcaption><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${rendu(n)}</svg></figure>`);
  });
} else if (TAILLES[nom]) {
  const [w, h] = TAILLES[nom];
  document.body.style.cssText = `width:${w}px;height:${h}px;margin:0`;
  document.documentElement.style.cssText = `width:${w}px;height:${h}px`;
  document.body.innerHTML = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${rendu(nom)}</svg>`;
}
</script>
</body>
</html>
