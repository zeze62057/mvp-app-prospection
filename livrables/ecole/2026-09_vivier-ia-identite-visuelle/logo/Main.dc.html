<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500&display=swap">
  <style>
    .eaa-root { width:640px; height:860px; box-sizing:border-box; background:#F2F7F5; font-family:'Manrope',system-ui,sans-serif; color:#113832; padding:64px; display:flex; flex-direction:column; }
    .eaa-eyebrow { font-size:11px; letter-spacing:0.16em; text-transform:uppercase; opacity:0.55; }
    .eaa-eyebrow strong { opacity:1; font-weight:600; }
    .eaa-center { flex-grow:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; text-align:center; }
    .eaa-wordmark { font-family:'Unbounded',system-ui,sans-serif; font-weight:700; font-size:38px; margin:0; }
    .eaa-tagline { font-size:15px; opacity:0.65; margin:0; }
    .hairline { height:1px; background:#113832; opacity:0.15; margin:8px 0 26px; }
    .eaa-section-label { font-size:11px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.5; margin:0 0 14px; }
    .eaa-row { display:flex; gap:22px; }
    .swatch { display:flex; flex-direction:column; align-items:center; gap:8px; }
    .swatch-chip { width:44px; height:44px; border-radius:50%; }
    .swatch-hex { font-family:monospace; font-size:10px; opacity:0.55; }
    .type-block { margin-top:30px; }
    .type-display { font-family:'Unbounded',system-ui,sans-serif; font-weight:700; font-size:28px; display:block; }
    .type-body { font-size:15px; opacity:0.75; display:block; margin-top:6px; }
    .type-caption { font-family:monospace; font-size:10px; opacity:0.5; letter-spacing:0.04em; text-transform:uppercase; display:block; margin-top:4px; }
  </style>
</helmet>
<div class="eaa-root">
  <div class="eaa-eyebrow"><strong>Vivier IA</strong> · logo retenu — Banc, meneur corail</div>
  <div class="eaa-center">
    <svg width="170" height="150" viewBox="0 0 140 120" fill="none">
      <g transform="translate(96,34) rotate(-10) scale(1.3)">
        <ellipse cx="0" cy="0" rx="12" ry="6" fill="#FF7A4D"/>
        <polygon points="-12,0 -22,-7 -22,7" fill="#FF7A4D"/>
      </g>
      <g transform="translate(58,52) rotate(5)" opacity="0.95">
        <ellipse cx="0" cy="0" rx="12" ry="6" fill="#2B8C82"/>
        <polygon points="-12,0 -22,-7 -22,7" fill="#2B8C82"/>
      </g>
      <g transform="translate(36,70) rotate(-15) scale(0.85)" opacity="0.85">
        <ellipse cx="0" cy="0" rx="12" ry="6" fill="#2B8C82"/>
        <polygon points="-12,0 -22,-7 -22,7" fill="#2B8C82"/>
      </g>
      <g transform="translate(70,80) rotate(12) scale(0.8)" opacity="0.75">
        <ellipse cx="0" cy="0" rx="12" ry="6" fill="#2B8C82"/>
        <polygon points="-12,0 -22,-7 -22,7" fill="#2B8C82"/>
      </g>
      <g transform="translate(26,46) rotate(8) scale(0.7)" opacity="0.65">
        <ellipse cx="0" cy="0" rx="12" ry="6" fill="#2B8C82"/>
        <polygon points="-12,0 -22,-7 -22,7" fill="#2B8C82"/>
      </g>
    </svg>
    <div>
      <p class="eaa-wordmark">Vivier IA</p>
      <p class="eaa-tagline">Le vivier des talents IA francophones</p>
    </div>
  </div>
  <div class="hairline"></div>
  <div>
    <p class="eaa-section-label">Palette retenue</p>
    <div class="eaa-row">
      <div class="swatch"><div class="swatch-chip" style="background:#113832"></div><span class="swatch-hex">Encre #113832</span></div>
      <div class="swatch"><div class="swatch-chip" style="background:#2B8C82"></div><span class="swatch-hex">Banc #2B8C82</span></div>
      <div class="swatch"><div class="swatch-chip" style="background:#FF7A4D"></div><span class="swatch-hex">Meneur #FF7A4D</span></div>
      <div class="swatch"><div class="swatch-chip" style="background:#F2F7F5; border:1px solid #11383222"></div><span class="swatch-hex">Fond #F2F7F5</span></div>
    </div>
  </div>
  <div class="type-block">
    <p class="eaa-section-label">Typographie</p>
    <span class="type-display">Vivier</span>
    <span class="type-caption">Unbounded · titres</span>
    <span class="type-body">Former, révéler, faire grandir les meilleurs.</span>
    <span class="type-caption">Manrope · texte courant</span>
  </div>
</div>
</x-dc>
</body>
</html>
